# Main menu. The Bink flare (MainBk_flare.bik, 800x145 at y 210) replays this
# picture's logo band with the background baked in -- Menus.asi's detail transfer
# carries the hi-res layer through it, see menus.c.
# Seed 1 under the old prompt ("scattered small stars") drew two large flared stars
# in the corners that pulled the eye off the menu; this prompt shrinks them, and
# fade= takes the sides down to near-black so the centre stays the focus. Seed 6 (of
# 1-6; 3-5 rejected) was the pick; dehaze= removes the blue haze it continues from
# stock's corners, which no prompt kept out.
source=bitmaps/main/mainbkgr.bmp
blend=35
seed=6
prompt=deep space with swirling orange, amber and violet nebula clouds, dark blue-purple sky, faint dim pinpoint stars, even soft lighting
negative=text, letters, logo, emblem, buttons, interface, frame, border, people, spaceship, starship, cube, planet, bright star, glowing star, star flare, lens flare, sun, starburst, glare, light source
fade=12
dehaze=100
