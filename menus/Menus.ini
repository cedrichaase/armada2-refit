; Menus.asi -- fixes Armada II's fixed 800x600 GDI menu shell: display mode,
; scaling, one window (Embed), backdrops, underlay.  Was MenuScale.asi before menus 2.0.0.
; Lives beside Armada2.exe.  Loaded by the Ultimate ASI Loader (winmm.dll),
; the same loader STA2WidescreenPatch.asi uses, so it needs no extra setup
; beyond the winmm=n,b override that is already in place.

[Menus]

; 0 = observe only, write Menus.log and change nothing
; 1 = centre the shell on the screen at its original size
; 2 = centre AND scale it to fill the screen height
Mode=2

; The shell's design area.  800x600 is measured, not assumed: every menu
; background in bitmaps/ is an 800x600 BMP and the dialogs are positioned at
; fixed offsets inside that box.  There is no reason to change this.
DesignWidth=800
DesignHeight=600

; 1 = snap to a whole-number scale factor (2x = 1600x1200 on a 1440p screen,
;     crisper but leaves a band top and bottom)
; 0 = fill the height exactly (2.4x = 1920x1440), always pillarboxed, never
;     stretched
IntegerScale=0

; 1 = HALFTONE resampling, 0 = nearest neighbour
Smooth=1

; The engine asks for a hard-coded 800x600x16 display mode while the menus are
; up -- measured, and the reason the shell has nowhere to be scaled into: it
; already fills its own small screen, which then sits in the corner of the
; real one.  This raises that mode so the scaler has room.
; Set to 0 if the front end misbehaves; the menus then stay stock-sized.
RaiseShellMode=1

; Front-end mode to ask for.  0 = the current desktop size, which is what you
; want.  ShellBpp is 16 or 32; the stock value is 16.
ShellWidth=0
ShellHeight=0
ShellBpp=32

; 1 = open every menu (DialogBoxParamA) as a CHILD of the game window instead
;     of a separate top-level window.  Under Wine each top-level menu is its
;     own X11 window, which the compositor tiles and focuses like a new app --
;     measured in Menus.log as menus at 3410x1378 and 1696x1378.  With 1,
;     the game is one window from launch to exit.
; 0 = stock: every menu is its own window
Embed=1

; 1 = Esc in the in-mission menu acts as Return to Game, so Esc opens and
;     closes it.  Needs Embed=1.
; 0 = stock: Esc does nothing inside the menu
EscapeReturns=1

; 1 = stock: the shell also paints each screen's 800x600 background 1:1 onto
;     the game window behind the menus.  Scaled, that shows in the top-left
;     corner for ~100 ms whenever one menu closes and the next opens.
; 0 = that paint is removed and one menu cuts straight to the next
Underlay=0

; Write Menus.log beside Armada2.exe
Log=1

; 1 = also log the first few paint events of every dialog (BeginPaint, GetDC,
;     and which of them presented).  A diagnostic; leave at 0.
Trace=0

; Hi-res, widescreen backdrops behind the full-screen menus -- see menus.c
; ("backdrops"); the plates are built by menus/backdrop.sh and installed
; by menus/install-plates.sh.  0 = black pillarboxes and a
; plain stretch, exactly as before.
Backdrops=1

; How far (0-255, the largest channel difference) the shell's frame may depart
; from the stock background and still receive the hi-res layer's detail, with
; the share falling linearly to nothing at this value.  The main menu's Bink
; flare replays the logo band 8/255 off stock on average, so this must stay
; well above that; hover highlights and text are 100+ off and are left alone.
DetailTolerance=48

; A frame pixel this close to stock (0-255, largest channel difference) is
; treated as stock, ramping back to the frame by twice this.  The hover Binks
; replay their rectangle's background ~2/255 darker than the BMP, which dimmed
; the whole rectangle while hovered; this removes it.  0 = off.
NoiseFloor=6

; 1 = write the composed screen to Menus-backdrop<n>.bmp beside Armada2.exe,
;     once per backdrop, ~60 presents after it first shows.  A test aid: it lets
;     a harness check the result without taking over the visible workspace.
DumpBackdrop=0

; Stock background BMP per screen, relative to the game directory.  The plate
; for each is Menus\<same file name>; install.sh copies the ones built.
[Backdrops]
1=bitmaps\main\mainbkgr.bmp
2=bitmaps\single\singleplay.bmp

; N.soften=x,y,w,h [x,y,w,h ...] (design px, up to 4): an animation on screen N
; whose glow is cut off by its own rectangle.  Its halo is carried on outwards
; over 12 px, where the background is untouched.  TutorialGlow.bik (the
; campaign screen's Tutorials hover) runs its halo right to all four edges; the
; stock game hid the left cut behind the screen's black frame, which the plate
; paints over.
2.soften=28,20,320,200
