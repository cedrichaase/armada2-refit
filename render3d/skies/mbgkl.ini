; mbgkl -- the dark Klingon sky (prefix mbgkl): a2_borg01, a2_kling04, a2_kling05, mp06shot.
; Almost black, with sparse patches of many colours: pink-violet, teal, an orange streak.
; Stock's faces average R, G, B 3.7, 3.2, 3.6 (out of 255); this recipe aims there,
; a little under rather than over.
; Every key is documented in render3d/README.md, "Sky recipes".
