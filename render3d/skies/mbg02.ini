; mbg02 -- the blue sky (mbg02.sod): fourteen maps, a2_fed01 among them; mbgblue.sod is the same model.
; Dark blue-violet cloud over the whole sky, little empty space.
; Stock's faces average R, G, B 8.2, 7.6, 30.7 (out of 255); this recipe aims there,
; a little under rather than over.
; Every key is documented in render3d/README.md, "Sky recipes".
[Sky]
Seed=99
Scale=2.4
Warp=0.35
Detail=0.5
Coverage=0.6
Softness=2.4
Patchiness=0.8
Ridge=0
Gamma=1.0
HueScale=2.5
HueMix=0.3
Brightness=0.295
Dither=1
Deep=3,3,12
GasA=24,22,82
GasB=32,26,92
Glow=30,28,90
Core1=0,0,10,0
Core1Colour=0,0,0
Core2=0,0,10,0
Core2Colour=0,0,0
Band=0,90,20,0
Stretch=0,90,1
; detail: grain, dust, haze and stars (render3d/README.md, "Sky recipes")
Grain=0.5,5,0.6
Dust=0.5,4,0.5
