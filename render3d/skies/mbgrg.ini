; mbgrg -- the red-green sky (prefix mbgrg): five maps.
; Very dim green gas in soft, broken cloud, with rust-brown in places.
; Stock's faces average R, G, B 2.8, 4.8, 2.0 (out of 255); this recipe aims there,
; a little under rather than over. It was toned down in sky 1.2.3 (too bright and
; hard-edged in a2_kling01, then); since render3d 0.3.0 its shape and grade are fitted
; to stock like every other sky, at the user's request.
; Every key is documented in render3d/README.md, "Sky recipes".
[Sky]
Seed=44
Scale=9.8
Warp=0.35
Detail=0.35
Coverage=0.9
Softness=3.25
Patchiness=1.0
Ridge=0
Gamma=1.3
HueScale=3.0
HueMix=0.2
Brightness=0.25
Dither=1
Deep=0,1,0
GasA=32,62,24
GasB=58,40,20
Glow=44,72,32
Core1=0,0,10,0
Core1Colour=0,0,0
Core2=0,0,10,0
Core2Colour=0,0,0
Band=0,90,20,0
Stretch=0,90,1
; detail: haze and stars (render3d/README.md, "Sky recipes")
Haze=0.5,1.6
Octaves=4
; the grade, fitted to the stock faces by render3d/perf/sky-grade.py (render3d/README.md, "Sky recipes")
GradeGain=6.403,3.846,11.360
GradeCurve=1.957,1.682,1.841
