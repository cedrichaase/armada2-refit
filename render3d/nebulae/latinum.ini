; latinum -- Latinum Nebula, the resource: small, a bright gold core in a soft orange
; ball. Not a Nebula to the engine but a TerrainObject (LatinumNebula), so it has no
; effect radius: Radius= sets its size, and Core= brightens it towards its centre.
; Ring=: at the core's edge, in patches, the colours cycle as stock's do (teal, blue-
; violet, pink-violet, green, about a second each). Pulse=: the core brightens and
; dims, its speed wandering, as stock's.
