[package]
name = "r3d-particles"
version = "0.45.0"
edition = "2024"
publish = false
description = "render3d's particles module: particles, sprites, vents and nebula puffs"
license = "MIT"

[lib]
name = "r3d_particles"
path = "src/lib.rs"

[dependencies]
r3d-core = { path = "../../core" }
a2ini = { path = "../../../crates/a2ini" }
a2fmt = { path = "../../../crates/a2fmt" }
a2engine = { path = "../../../crates/a2engine" }
gpu = { path = "../../../gpu" }
libm = "0.2"
