# The overlays module's settings rows: a fragment of render3d/settings.toml
# (tools/settings/README.md, "Fragments"), exported after the core's rows in module
# priority order. Generated: settings_table.rs beside it.
plugin = "Render3D"
file = "Render3D.ini"
module = "overlays"

[[row]]
name = "overlays_fog"
section = "Overlays"
key = "Fog"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Fog of war"
help = "render3d draws the fog of war and the shroud."

[[row]]
name = "overlays_grid"
section = "Overlays"
key = "Grid"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Grid"
help = "render3d draws the tactical grid."

[[row]]
