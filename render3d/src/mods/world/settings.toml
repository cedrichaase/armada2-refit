# The world module's settings rows: a fragment of render3d/settings.toml
# (tools/settings/README.md, "Fragments"), exported after the core's rows in module
# priority order. Generated: settings_table.rs beside it.
plugin = "Render3D"
file = "Render3D.ini"
module = "world"

[[row]]
name = "world_planets"
section = "World"
key = "Planets"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Planets"
help = "render3d draws the planets and moons. Off hands them back to the game."

[[row]]
name = "world_rocks"
section = "World"
key = "Rocks"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Asteroids"
help = "render3d draws asteroids and scrap. Off hands them back to the game."

[[row]]
name = "world_nebulae"
section = "World"
key = "Nebulae"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Nebulae"
help = "render3d draws nebulae as lit gas. Off hands them back to the game."

[[row]]
name = "nebulae_lit"
section = "Nebulae"
key = "Lit"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Lit nebula gas"
help = "Explosions, shots and beams light the gas they are in. Needs the Vulkan or Direct3D 12 renderer."

[[row]]
name = "world_surfaces"
section = "World"
key = "Surfaces"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Planet and asteroid surfaces"
help = "Planets and asteroids use render3d's surface recipes. Off keeps their original textures."
