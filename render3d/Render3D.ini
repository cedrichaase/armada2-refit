; Render3D.asi: the 3D view drawn by render3d (render3d/README.md).
[Render3D]
; 0: the engine draws the 3D view, as without the plugin.
Enable=1
Log=1
; Samples per pixel on the scene target: 0, 2, 4 or 8.
MSAA=4
; 1: the scene is drawn in half floats, so light adds up past white and blooms by
; how bright it is. 0: an 8-bit target, for comparison.
HDR=1
; How much of the light above BloomThreshold spreads into a glow (0 = none), and how
; soft that threshold's knee is. 1.0 is stock's white.
Bloom=0.12
BloomThreshold=1.0
BloomKnee=0.5
; Scales the scene before the tone map.
Exposure=1.0
; Where the tone map starts to roll off towards white; below it, colours are stock's.
Shoulder=0.8
; 1: the HUD's action-camera view goes through render3d as well.
Inset=1

; The overlays module (README.md, "Module: overlays"): fog of war, shroud, the tactical
; grid, selection bubbles, fog-of-war ghosts. Each 0 leaves that part to the engine.
[Overlays]
Fog=1
Grid=1
Selection=1
Ghosts=1
; 1: the station being placed drawn by render3d (an approximation); 0: the engine's.
BuildGhost=0
; The fog's and shroud's edges, as Fog.ini had them (fog/README.md).
;   bspline      the smoothest: a circle of cells reads as a circle
;   catmull-rom  closer to the cells: corners stay sharper
Filter=bspline
; Where the edge sits, from seen (0) to hidden (1); 0.5 is stock's.
FogThreshold=0.5
ShroudThreshold=0.5
; How soft the edge is: 0 as sharp as a pixel allows, 0.5 about two cells wide.
FogSoftness=0.2
ShroudSoftness=0.1
; Stock's darker rim along the edge: 1 as stock, 0 flat; RimWidth 0.25 is stock's.
FogRim=1
ShroudRim=1
RimWidth=0.25
; The least width of an edge, in pixels.
Antialias=1.0
