; Render3D.asi: the 3D view drawn by render3d (render3d/README.md).
[Render3D]
; 0: the engine draws the 3D view, as without the plugin.
Enable=1
Log=1
; Samples per pixel on the scene target: 0, 2, 4 or 8.
MSAA=4
; 1: the scene is drawn in half floats, so light adds up past white and blooms by
; how bright it is. 0: an 8-bit target, for comparison.
HDR=1
; How much of the light above BloomThreshold spreads into a glow (0 = none), and how
; soft that threshold's knee is. 1.0 is stock's white.
Bloom=0.12
BloomThreshold=1.0
BloomKnee=0.5
; Scales the scene before the tone map.
Exposure=1.0
; Where the tone map starts to roll off towards white; below it, colours are stock's.
Shoulder=0.8
; 1: the HUD's action-camera view goes through render3d as well.
Inset=1
; 1: log CPU and GPU time per view and per step every TimingEvery seconds (README.md,
; "Timing"). With Enable=0 it times the engine's own 3D view instead, for comparison.
Timing=0
TimingEvery=5

; The specials module (README.md, "specials"): the special-object effects (Computer
; Override, Energy Dissipator, Psionic Disruption). Enable=0 hands them to the engine
; (read again every 2 s); Overlay=0 / Lights=0 drop the layer over the hull / the light.
[Specials]
Enable=1
Overlay=1
Lights=1

; The overlays module (README.md, "Module: overlays"): fog of war, shroud, the tactical
; grid, selection bubbles, fog-of-war ghosts. Each 0 leaves that part to the engine.
[Overlays]
Fog=1
Grid=1
Selection=1
Ghosts=1
; The height posts (DrawHeightPost: the build ghost's, the move target's) as
; anti-aliased lines: width in pixels at 1080 lines, soft edge in pixels. 0: the engine's.
HeightPosts=1
HeightPostWidth=1.5
; The fog's and shroud's edges, as Fog.ini had them (README.md, "overlays").
;   bspline      the smoothest: a circle of cells reads as a circle
;   catmull-rom  closer to the cells: corners stay sharper
Filter=bspline
; Where the edge sits, from seen (0) to hidden (1); 0.5 is stock's.
FogThreshold=0.5
ShroudThreshold=0.5
; How soft the edge is: 0 as sharp as a pixel allows, 0.5 about two cells wide.
FogSoftness=0.2
ShroudSoftness=0.1
; Stock's darker rim along the edge: 1 as stock, 0 flat; RimWidth 0.25 is stock's.
FogRim=1
ShroudRim=1
RimWidth=0.25
; The least width of an edge, in pixels.
Antialias=1.0

; The world module (README.md, "world"): planets, moons and asteroids, nebulae. Each 0
; leaves that part to the engine (or its plugin).
[World]
Planets=1
Rocks=1
Nebulae=1
; 0: the planets and rocks keep their stock textures instead of their recipes.
Surfaces=1
; The dilithium moons' inner shell: dark (as under Lighting.asi: black cracks) or glow.
MoonShell=dark
; The dilithium moons' light, through their cracks only: the brightness in the cracks
; (times the nimbus's colour at its peak, and the share of dilithium left; 0: the cracks
; are holes onto the shell, as before), how much of the nimbus's pulse they take (0..1),
; and the white at a crack's core. MoonNimbus=1 draws the round nimbus behind the moon too.
MoonCracks=4
MoonPulse=0.5
MoonCrackCore=1
MoonNimbus=0
