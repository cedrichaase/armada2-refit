; The main menu's scene: a Federation fleet in orbit, front three-quarter, over a
; class M planet seen whole below and behind it.
; Every key is documented in render3d/README.md, "The menu scene". A copy at
; Menu\main.ini in the game directory takes precedence, and is read again within a
; second of an edit, for tuning live.
;
; The scene is in the fleet's frame, the fleet flying along +z (the hulls' noses);
; the planet's centre is the origin.
; Framed on the bench at 1280x720 with the menu column at the left: the Galaxy at the
; centre right, the formation trailing back and up to the right, the globe lower right,
; the sun off the right edge lighting the hulls from the side.
