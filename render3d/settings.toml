plugin = "Render3D"
file = "Render3D.ini"
shipped = "render3d/Render3D.ini"
# The core's rows; each module's are in its fragment, src/mods/<m>/settings.toml
# (tools/settings/README.md, "Fragments"). [Lights] is split by key between owners.
shared_sections = ["Lights"]

[[row]]
name = "msaa"
section = "Render3D"
key = "MSAA"
kind = "enum"
default = "4"
values = ["0", "2", "4", "8"]
labels = ["Off", "2x", "4x", "8x"]
apply = "restart"
scope = "local"
tab = "graphics"
label = "Anti-aliasing"
help = "Samples per pixel on the 3D view. Higher is smoother and costs more GPU time."

[[row]]
name = "hdr"
section = "Render3D"
key = "HDR"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "HDR and bloom"
help = "Draw the 3D view in half floats, so bright light blooms. Off draws an 8-bit view."

[[row]]
name = "modules_hulls"
section = "Modules"
key = "hulls"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Ships"
help = "render3d draws the ships. Off hands them back to the game, with its own look."

[[row]]
name = "modules_sky"
section = "Modules"
key = "sky"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Sky"
help = "render3d draws the sky. Off hands it back to the game."

[[row]]
name = "modules_particles"
section = "Modules"
key = "particles"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Particles"
help = "render3d draws particles, smoke and venting. Off hands them back to the game."

[[row]]
name = "modules_effects"
section = "Modules"
key = "effects"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Effects"
help = "render3d draws explosions, shields, repair and debris. Off hands them back to the game."

[[row]]
name = "modules_ordnance"
section = "Modules"
key = "ordnance"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Weapons"
help = "render3d draws beams, torpedoes and shots. Off hands them back to the game."

[[row]]
name = "modules_specials"
section = "Modules"
key = "specials"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "graphics"
label = "Special weapons"
help = "render3d draws the special weapons' effects. Off hands them back to the game."

[[row]]
name = "modules_world"
section = "Modules"
key = "world"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Planets, rocks and gas"
help = "render3d draws planets, moons, asteroids and nebulae."
flags = ["no_row"]

[[row]]
name = "modules_overlays"
section = "Modules"
key = "overlays"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "Overlays"
help = "render3d draws the fog of war, grid, selection and ghosts."
flags = ["no_row"]
