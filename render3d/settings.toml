plugin = "Render3D"
file = "Render3D.ini"
shipped = "render3d/Render3D.ini"

[[row]]
name = "msaa"
section = "Render3D"
key = "MSAA"
kind = "enum"
default = "4"
values = ["0", "2", "4", "8"]
labels = ["Off", "2x", "4x", "8x"]
apply = "restart"
scope = "local"
tab = "graphics"
label = "Anti-aliasing"
help = "Samples per pixel on the 3D view. Higher is smoother and costs more GPU time."

[[row]]
name = "hdr"
section = "Render3D"
key = "HDR"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "graphics"
label = "HDR and bloom"
help = "Draw the 3D view in half floats, so bright light blooms. Off draws an 8-bit view."

[[row]]
name = "modules_hulls"
section = "Modules"
key = "hulls"
kind = "bool"
default = "1"
