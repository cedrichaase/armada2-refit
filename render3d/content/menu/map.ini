; The front end's map: every scene behind the main menu and the campaign selection,
; on one map under one sun. UI.asi asks for a view by name (main, and on the campaign
; selection tutorials, federation, klingon, borg) and the camera moves over to it.
; Every key is documented in render3d/README.md, "The menu scene". A copy at
; Menu\map.ini in the game directory takes precedence, and is read again within a
; second of an edit, for tuning live.
;
; The planet's centre is the origin, +y up. A group is a place on the map: its ships,
; gas and views are given in its frame (+z forward, turned by Yaw= about +y), and a
; ship's nose points along its +z. The sun is where the Key comes from (-KeyAxis), the
; same for every view: each camera is set against it.
[Scene]
Sky=mbgblue
SkyTurn=0.004
Stars=1400
StarSize=0.0012
StarSeed=7
Sun=Msun1
SunDistance=4000
KeyAxis=0.719,-0.457,-0.523
KeyColour=1.0,0.95,0.86
FillAxis=-0.6,0.3,0.7
FillColour=0.10,0.12,0.18
Blend=1.6

; Campaign progress (render3d/README.md, "Campaign progress"): a ship or gas field with
; Campaign= (or in a group with one) is on the map from From= missions of that campaign
; complete until Until=. UI.asi says how far each campaign has got; Default= is the
; count of a campaign it has not told of (6: the map as it was before progress
; counted, plus what comes early). For tuning, <campaign>=N forces a count:
;   federation=10
[Progress]
Default=6

; A departure, while a mission loads from the campaign selection (Render3D_MenuWarp):
; the view's ships go to warp front first, the camera swings behind them and follows,
; and the tunnel comes in once they have gone. Seconds unless said.
[Warp]
Delay=0.9
Stagger=0.18
Ramp=0.75
Stretch=30
Speed=120
Turn=1.3
Follow=260
TunnelAt=0.1
TunnelIn=0.9
Dim=0.85
TunnelSpeed=1.0
Widen=18
Flash=2.2
FlashTime=0.45

[Planet]
Class=PB_CLSSM
Radius=4200
At=0,0,0
Axis=0.3,1,0.2
Spin=0.3
Clouds=0.002
Orbit=0.004

