; The world module's table in the fleetops set (Fleet Operations: Roots; render3d/README.md,
; "Content sets" and "world"; PLAN-FLEETOPS.md, FO-5 step 6): names only. The recipes
; are the stock set's, ours; a game directory's Nebulae\<odf>.ini still wins.

[World]
; Roots' moons are ordinary SODs (map_dilithium_moon*, map_tritanium_moon*) with no
; glow shell of stock's material, so none is named.
MoonGlowMaterial =

; No surface recipe: every stock recipe is keyed by a stock texture (Master*, mdmoon,
; PB_CLSS*), and Roots' planets and moons are its own art, which no recipe of ours is
; fitted to (PLAN-FLEETOPS.md, decision 7). They keep their textures.
[Surfaces]

; Roots' nebula classes (classLabel nebula_obj in ODF.fpq), each with the stock recipe of
; the stock nebula of the same nebulaType (what it does in the game) and the same glow
; hue in its ODF (red_glow, green_glow, blue_glow): Mutara 3, purple; Nucleon 2, red as
; stock's metreon; Crystalid, Fluidic and Organic 4, green as stock's metaphasic; Fluid
; 5, blue as stock's cerulean. Tetryon (2, blue-violet, a type whose stock nebula is red)
; has no match and keeps the engine's billboards. The set and single classes alike: the
; radius is the class's own (the recipes set none).
; Roots' latinum class (classLabel latinum) is its asteroid sets and debris fields, not
; a latinum nebula, so it is not named: the stock set's latinum recipe would fill the
; asteroid fields with gas.
[Nebulae]
map_nebula_mutara = nebulae/mnebula8.ini
map_nebula_mutaraset = nebulae/mnebula8.ini
map_nebula_nucleon = nebulae/mnebula7.ini
map_nebula_nucleonset = nebulae/mnebula7.ini
map_nebula_crystalid = nebulae/mnebula9.ini
map_nebula_crystalidset = nebulae/mnebula9.ini
map_nebula_fluidic = nebulae/mnebula9.ini
map_nebula_fluidicset = nebulae/mnebula9.ini
map_nebula_organic = nebulae/mnebula9.ini
map_nebula_fluid = nebulae/mnebula10.ini
map_nebula_fluidset = nebulae/mnebula10.ini
