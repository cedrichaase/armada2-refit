; "Content sets"; PLAN-FLEETOPS.md, FO-5 step 6): the stock set's. The kinds are the
; engine's effect classes (TimedChangeTeam, TimedDrain, TimedCrewDisruption), which Roots
; keeps, each found from its weapon's ordnance ODF (Roots' overrid keeps stock's name),
