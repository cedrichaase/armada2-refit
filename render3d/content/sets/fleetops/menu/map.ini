; ---- A Borg fusion cube in a Mutara nebula (the Borg campaign) -------------------------
; Straight along the sun's way from the planet: the camera, low, looks up at the cube
; in front of the sun, and the cube's shadow falls through the gas towards it.
[Group.borg]
At=-11500,7300,8370
WarpColour=0.35,1.0,0.45

[View.borg]
Group=borg
Eye=-716,-140,-1862
Target=-233,-150,90
Fov=44
Sway=8,4,6
SwayPeriod=50

[Ship.fusion]
Group=borg
Odf=bhbattleship
At=0,0,0
; While the Borg campaign is locked: down in the Mutara gas (its band lies 450 below
; the cube's place), half hidden.
LockedAt=60,-300,120
; Locked: turned a corner towards the camera, so it reads as a cube: the face on the
; left catches the Key, the one on the right stays in shade, and the bottom corner shows
; (at Yaw=20 a face met the camera square on and it read as a flat tile; 35..55 still
; did, 80 and 100 lost the corner).
LockedYaw=70
Yaw=20
Bob=0.4

[Ship.diamond]
Group=borg
Odf=bsupport
At=-671,-184,-1544
; Locked: in the gas behind the cube, along the band, rather than out in front.
LockedAt=-324,-300,235
Yaw=-35
Bob=0.6
Phase=1.7

; A band along the cube's shadow, turned with the shadow's way across the map (away
; from the sun, 36 degrees from +x): a view ray crosses mostly shadowed gas, and the
; shadow reads as a dark wedge through the lit band (seen from the side: a shadow seen
; along its length, or through gas lit beyond it, is lost).
[Group.borgshadow]
At=-11500,7300,8370
Yaw=36

; ---- Roots' own campaigns (the campaign selection of Roots' Single Player) --------------
