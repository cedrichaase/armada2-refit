; The ordnance module's table in the fleetops set (Fleet Operations: Roots; render3d/README.md,
; "Content sets" and "ordnance"; PLAN-FLEETOPS.md, FO-5 step 6). The looks are the stock
; set's recipes, ours; this table only says which of Roots' ordnance ODFs each draws.

[Ordnance]
SodExts = .sod, .SOD

[Recipes]
ordnance = ordnance/ordnance.ini

; Which ordnance ODF (a weapon's ordName in Roots' ODF.fpq) each built-in recipe draws:
; Ordnance.<odf> or Wave.<odf> = the recipe's section, without its prefix. With this
; table a built-in recipe draws only the ODFs it names: a stock name Roots shares may be
; another weapon there (Roots' ionstm is a utritium beam, classLabel utribeam, where
; stock's is the Klingon ion storm torpedo, ionstorm_tp; so it is not named, and the
; engine draws it). Each line pairs the ODF with the recipe of the stock weapon of the
; same classLabel and the same use, read off the ODFs; a [Ordnance.<odf>] section of
; Render3D.ini still draws the ODF of its name. A shot no line names, and the shots the
; recipes do not reach (ordinary weapons, Roots' new classes), keep stock's sprites
; or Roots' own models (the ordnance module's Stock and Models paths) or the engine.
[Names]
; Every race's construction ship: weapon npc_tractorbeam (tractor_bm).
Ordnance.npc_tractorbeamo = tracbmo
; The Borg battleships' holding beams (holding_bm).
Ordnance.borg_ships_holo = holdbm
Ordnance.borg_stations_holo = holdbm
; Species 8472's corvette: Clairvoyance (CvoyantLink).
Ordnance.clairvoyance = clairvoyantlink
; The Cardassian support ships' Energy Drain (micro), as stock's Cardassian
; micro-organisms.
Ordnance.gdisso = microorgs
; Stock's names, the same classLabel in Roots: the holo-generator, the shield inverter,
; the computer override.
Ordnance.hologen = hologen
Ordnance.shieldi = shieldi
Ordnance.overrid = overrid
; The miners' beams (minebm): dilithium as stock's dilithium, tritanium (Roots' metal)
; as the Borg's metal beam. Biomatter (Species 8472's miner) has no stock beam.
Ordnance.all_mine_dilithiumo = minedilithium
Ordnance.all_mine_dilithium2o = minedilithium
Ordnance.all_mine_tritaniumo = minemetalborg
Ordnance.all_mine_tritanium2o = minemetalborg
; The repair beam (minebm, effect_repair).
Ordnance.fed_repair_beamo = repairbeam
; Waves (shockwavexplode): the Romulan cloak enhancer's, and the fleet support's weapon
; enhancer (stock's name).
Wave.gcloakenhancew = CloakEnhancerWave
Wave.weaponenhancerwave = WeaponEnhancerWave
