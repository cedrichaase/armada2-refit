; The overlays module's table in the fleetops set (Fleet Operations: Roots; render3d/README.md,
; "Content sets"; PLAN-FLEETOPS.md, FO-5 step 6).

[Overlays]
; Roots keeps stock's selection model, select.sod (beside its per-race select_<race>.sod).
SelectionModel = select
; QOL is not installed on Roots, so no move queue is exported: the move paths draw every
; move the engine's ships fly, a formation move's followers by their leader's path, not
; only the paths sketched with the waypoint key (stock's default, `sketched`;
; PLAN-FLEETOPS.md, "FO-B: the formation move's path").
EngineMoves = all
