; The hulls module's table in the fleetops set (Fleet Operations: Roots; render3d/README.md,
; "Content sets"; PLAN-FLEETOPS.md, FO-5): names and keys only, never numbers fitted to
; Roots' art (PLAN-FLEETOPS.md, decision 7). The SOD conventions are stock's.

[Hulls]
CocoonSod = 8472_cocoon
OdfExt = .odf
HardpointsNode = hardpoints
LightsNodes = lights, light
DamageParentNodes = life, engines, weapons, shield, shields, sensors, crew, damage
BorgNode = borg
OreNode = ore
ScrapGlowSprite = glowdmoon
; The [Hulls] key prefix of the bump profile (BorgAmbient, BorgSun, ...).
BumpProfile = Borg
; Roots bump-maps nearly every hull (for the engine's GPU vertex path, not for a look),
; so the bump profile goes by the ODF's race (read through its #includes), never by
; "bump-mapped". Render3D.ini [Hulls] BorgRaces= replaces this list.
ProfileBy = race
; The ODF key that names the race (the default).
RaceKey = race
ProfileRaces = borg, freeborg
; Roots' *_bump textures are tangent-space normal maps, not height maps; a flat one
; (all_bump: one colour) counts as none.
BumpMaps = normal

[ResourceColours]
Crew = 0, 1, 0
Officers = 1, 1, 1
Dilithium = 0.6, 0.9, 1
Latinum = 1, 1, 0
Metal = 0.8, 0.8, 0.8
Biomatter = 1, 0, 0
