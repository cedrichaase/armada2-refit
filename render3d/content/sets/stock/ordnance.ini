; The ordnance module's table in the stock set (render3d/README.md, "Content sets").

[Ordnance]
; A SOD name as an ODF's shotGeometry writes it, in either case.
SodExts = .sod, .SOD

; The special weapons' and waves' recipes and the warp flash: name = file under
; render3d/content/. Render3D.ini overrides them section by section, key by key.
[Recipes]
ordnance = ordnance/ordnance.ini
