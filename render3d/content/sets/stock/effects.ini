; The effects module's table in the stock set (render3d/README.md, "Content sets").
; Names of the game's data, never addresses. A set without this file gives the module
; no names: no faction colours, no cocoon debris.

[Effects]
; The weapons whose CreateShieldHit calls are tapped, in the order of the sites in
; hooks.rs (their log lines).
Sites = beam, shot, mine, missile
; The SOD of the Evolver's cocoon, broken up when it hatches.
CocoonSod = 8472_cocoon
; [Shields] RayFactions= when the ini names none.
RayFactions = Klingon

; A shield's colour by faction, in order: Key = initial, R, G, B. The key is the
; [Shields] colour key, the initial the first letter of its ships' ODF names (lower
; case), the colour 0..255 its default. The last entry, initial -, is every ship no
; letter names.
[Factions]
Federation = f, 90, 170, 255
Klingon = k, 12, 255, 6
Romulan = r, 90, 255, 130
Borg = b, 110, 255, 120
Cardassian = c, 255, 200, 80
Species8472 = 8, 255, 140, 40
Other = -, 140, 200, 255
