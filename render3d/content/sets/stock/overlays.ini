; The overlays module's table in the stock set (render3d/README.md, "Content sets").

[Overlays]
; The selection bubble's model (select.sod), drawn at each selected object.
SelectionModel = select
; Which engine moves the move paths draw when no plugin exports a move queue (QOL.asi):
; `sketched` (the default), only paths sketched with the waypoint key; `all`, every move
; the player's selected ships fly, a formation move's followers by their leader's path.
EngineMoves = sketched
