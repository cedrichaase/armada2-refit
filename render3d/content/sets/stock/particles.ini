; The particles module's table in the stock set (render3d/README.md, "Content sets").

[Particles]
; The engine's damage-node names (CraftClass::InitializeDamageNodes): the first node of
; each in a SOD (any case), in the order of the instance's damage bytes.
Systems = shields, engines, target, sensors, life, borg
; The vents' sprites by default (plasma, gas); [Particles] PlasmaSprite= and
; GasSprite= name others.
VentSprites = ventplas, ventgas
; The free emitters the chain pulsar and the Manheim effect each fire.
ChainEmitter = crpulsar
ManheimEmitter = gemini
; A SOD name as the engine writes it; the extension is dropped for the asset cache.
SodExt = .sod
