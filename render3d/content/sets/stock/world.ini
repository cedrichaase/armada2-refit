; The world module's table in the stock set (render3d/README.md, "Content sets"). The
; recipes are the ones render3d/install.sh copies into the game directory's Surfaces\
; and Nebulae\ (a copy there wins), built in so the look needs nothing installed.
; Names are lower case: a lookup that misses tries the lower-cased name.

[World]
; The engine's material for the dilithium moons' glow shell.
MoonGlowMaterial = glowdmoon

; A texture's surface recipe, by lower-cased texture name: name = file under
; render3d/content/.
[Surfaces]
master1 = surfaces/Master1.ini
master2 = surfaces/Master2.ini
mdmoon = surfaces/Mdmoon.ini
pb_clssd = surfaces/PB_CLSSD.ini
pb_clssh = surfaces/PB_CLSSH.ini
pb_clssj = surfaces/PB_CLSSJ.ini
pb_clssk = surfaces/PB_CLSSK.ini
pb_clssl = surfaces/PB_CLSSL.ini
pb_clssm = surfaces/PB_CLSSM.ini

; A nebula class's gas recipe, by lower-cased ODF name: name = file under
; render3d/content/.
[Nebulae]
fluidicnebula = nebulae/fluidicnebula.ini
generatednebula = nebulae/generatednebula.ini
latinum = nebulae/latinum.ini
mnebula10 = nebulae/mnebula10.ini
mnebula12 = nebulae/mnebula12.ini
mnebula6 = nebulae/mnebula6.ini
mnebula7 = nebulae/mnebula7.ini
mnebula8 = nebulae/mnebula8.ini
mnebula9 = nebulae/mnebula9.ini
