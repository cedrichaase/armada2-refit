; The hulls module's table in the stock set (render3d/README.md, "Content sets"):
; names of the game's data (SOD nodes, sprites) and stock's own numbers it reproduces.

[Hulls]
; The Evolver's cocoon: the SOD of the class the engine keeps.
CocoonSod = 8472_cocoon
; A class's ODF name ends in this; the SOD is named after the stem.
OdfExt = .odf
; The node a SOD's hardpoints hang from: hidden when a model is shown clean.
HardpointsNode = hardpoints
; The node of a SOD's running lights (either spelling).
LightsNodes = lights, light
; The nodes of a model with no class behind it (the menu scene) whose children are the
; systems' damage effects and the crew fires.
DamageParentNodes = life, engines, weapons, shield, shields, sensors, crew, damage
; The Borg node of such a model, hidden too.
BorgNode = borg
; A freighter's cargo markings hang from this node.
OreNode = ore
; The sprite node of a scrap object's glow (the dilithium moons).
ScrapGlowSprite = glowdmoon
; The [Hulls] key prefix of the bump-mapped hulls' profile (BorgAmbient, BorgSun, ...).
BumpProfile = Borg

; ResourceComponent::s_ResourceColor as stock initialises it, by resource kind in
; order (R, G, B in 0..1), for when InitResourceComponents has not run.
[ResourceColours]
Crew = 0, 1, 0
Officers = 1, 1, 1
Dilithium = 0.6, 0.9, 1
Latinum = 1, 1, 0
Metal = 0.8, 0.8, 0.8
Biomatter = 1, 0, 0
