; ---- Waves ----
;
; [Ordnance] Waves=0 leaves them stock. Each section [Wave.<odf>] is a recipe for the
; shockwaves of one ODF (classLabel shockwavexplode) that a special weapon sets off;
; the death shockwave (xshock) and the self-destruct's are not this module's. A wave is
; drawn in its own plane, as stock's disc is, as far out as the engine has run it and
; fading as stock fades it: Colour (the band), CoreColour (its leading edge),
; Brightness, Band (its half width, of the radius), RayCount and RayShare (rays
; reaching in from the band), Fill (behind it), Turbulence (0..1, how broken up the
; band is), Flicker, and Light (lighting the hulls it passes, LightColour).
; The colours are the stock textures' own.

