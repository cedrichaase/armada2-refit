; render3d's ordnance module: the special weapons' recipes and the warp flash, ported
; from Specials.asi (render3d/README.md "ordnance" and "specials"). This file is
; built into Render3D.asi; a section or key of the same name in Render3D.ini overrides
; it ([Ordnance.tracbm] Width=20, say). The module's own settings are [Ordnance] in
; Render3D.ini (README).

; The flash where a craft goes to warp, in place of stock's warp_sprite (Mwarp).
[Warp]
; 1: drawn by the plugin; 0: the stock sprite.
Enable=1
; Overall brightness, and size (1: stock's, 2.5 bounding radii at its fullest), never
; under MinPixels across.
Brightness=1.3
Size=1.0
MinPixels=8
; The flash: how sharp its white core and its glow are, the share and sharpness of the
; four-pointed star, the glow's colour (0..255).
Core=40
Glow=4
Star=0.8
StarSharpness=18
Colour=130,175,255
; The horizontal streak: its share, its length (in the flash's size, to either side),
; how thin, its colour.
Streak=0.9
StreakLength=4
StreakSharpness=26
StreakColour=110,160,255
; Timing: brightness goes as closeness^Rise while the craft closes on the point; when
; it gets there a burst of Burst times over, and an afterglow fading over Afterglow
; seconds.
Rise=2
Burst=1.8
Afterglow=0.45
; The ring that runs out from the point as the craft goes: brightness (0: none), speed
; (bounding radii a second), width (of its radius), how long it lasts (s), colour.
Ring=1.0
RingSpeed=6
RingWidth=0.06
RingTime=0.6
RingColour=150,195,255
; The light the flash casts on the hulls about it (0: none): colour times this, full to
; LightReach bounding radii (a light registered with the engine).
Light=3.0
LightColour=160,195,255
LightReach=3.0

; ---- The special weapons -------------------------------------------------------
;
; [Ordnance] Specials=0 leaves every special weapon stock. Each section
; [Ordnance.<odf>] is a recipe for the shots of one ordnance ODF (odf/special_weapons;
; the weapon's ordName, without .odf, any case); a shot without one stays stock.
;
; Every kind: Colour (0..255, the glow), CoreColour (its hot core), Brightness,
; Flicker (0..1, how far it dips) and FlickerRate (a second), FadeIn (s); the light it
; casts on the hulls about it (0: none) at its impact, its head or its centre:
; Light, LightColour (default: Colour), LightReach (world units).
;
; Kind=beam, from the ship to its target: Width (world units, never under MinPixels),
; CoreWidth (of the half width), Taper (the width at the target over the width at the
; ship: above 1 a cone), Flow=share,frequency,speed (pulses along it: share 0..1,
; frequency per half width, speed in radians a second; negative runs back towards the
; ship), Helix=amplitude,frequency,speed (two strands twisting about it; amplitude of
; the half width), Crackle (the core thrown about, of the half width), Emitter and
; Impact (flares at the ship and at the target, in half widths), Star (their
; four-pointed star's share).
;
; Kind=bolt, a projectile: Size (its radius, world units), Tail (its length behind it,
; in radii), Rays (the share of four rays that turn at Spin radians a second),
; Pulse=share and PulseRate (radians a second).
;
; Kind=field, a bubble about a ship: On=target or owner, Radius (of the ship's bounding
; radius), Rim (how sharp the rim is), Swirl=share,count,speed (bands over it), Fill.
;
; Kind=cone, a beam of light through vapour (the tractor, holding and assimilation
; beams; ART-DIRECTION.md): from a point on the ship, Width wide (never under
; MinPixels), to Spread of its target's half width across the beam (its meshes as
; seen from here) about the beam's end, and on for Beyond of its bounding radius as
; it fades; its wide end drawn Pull target radii towards
; the camera so it lies over the hull. Fans=count,interior,rate (the beams in it:
; up to four wedges from the emitter, hard edged and brightest along their edges,
; `interior` the light between the edges against theirs, each fading in and out
; `rate` times a second and coming back at another angle and width),
; Sprinkle=R,G,B and SprinkleShare (a second colour: two fans of it of their own, at
; that share of the brightness; 0 for none), EdgePixels (the fans' hard edges), Vapour=depth,scale,speed (0..1, blobs per
; wide-end half width, half widths a second towards the target; negative runs back
; towards the ship), Fall (its brightness at
; the target against the emitter's), Emitter (the bright point at the ship, in start
; half widths), Star. No core, no impact flare: CoreColour, CoreWidth, Flow, Helix,
; Crackle, Taper and Impact are a beam's. Light is the wash on the target: a soft light
; WashBack target radii from its centre towards the ship, full out to WashReach radii,
; so the side the cone falls on takes it (LightReach is unused when there is a target).


