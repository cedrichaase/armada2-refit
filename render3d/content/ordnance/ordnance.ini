; ---- Models ----
;
; The shots that draw a model (mines, pods, the commando team, the myotron, the black
; hole and flux wave weapons, the stasis field, the transwarp drive) are drawn by
; render3d from their SOD (shotGeometry), lit by the scene's lights, with the emitters
; on it (rocket trails, contrails, the rift's clouds) kept going; [Ordnance] Models=0
; leaves them to the engine. A section [Model.<odf>] gives one a glow at its heart:
; Glow (brightness, 0: none), GlowColour, GlowSize (half size, of the model's radius),
; Pulse (0..1, how far it swells and dims) at PulseRate (radians a second), Star (the
; four-pointed star's share), MinPixels, and Light (its light on the hulls about it,
; 0: none) full to LightReach world units. Ambient and SelfIllumination light the model
; itself. [Model] holds the defaults for every model without a section.

[Model]
Glow=0
Ambient=0.18

