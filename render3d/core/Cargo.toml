[package]
name = "r3d-core"
version = "0.45.0"
edition = "2024"
publish = false
description = "render3d's renderer core: frame, gfx, scene, assets, the shared engine glue, the menu scene, the module interface, registry, hooks, services and recipes"
license = "MIT"

[lib]
name = "r3d_core"
path = "src/lib.rs"

[dependencies]
libm = "0.2"
a2fmt = { path = "../../crates/a2fmt" }
a2rt = { path = "../../crates/a2rt", features = ["dump"] }
gpu = { path = "../../gpu" }
a2ini = { path = "../../crates/a2ini" }
a2engine = { path = "../../crates/a2engine" }
