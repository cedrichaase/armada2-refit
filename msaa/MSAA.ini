; MSAA.asi -- multisample anti-aliasing for Armada II.  See msaa/README.md.
;
; Read once at startup; relaunch the game to change it.
[MSAA]
; Samples per pixel: 8, 4, 2 -- or 0 to switch the plugin off (nothing is
; patched).  If the device refuses a count, the plugin halves it until one is
; accepted for both the back buffer and the depth buffer, and logs the result.
Samples=8
; 1 writes MSAA.log beside Armada2.exe: one line at startup, one per device
; creation, stating what the engine asked for and what was set.
Log=1
