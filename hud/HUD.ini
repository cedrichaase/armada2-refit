; HUD.asi -- the in-game HUD layout, font and cursors, undistorted at any
; display aspect.  See hud/README.md.
;
; Read once at startup; relaunch the game to change it.  Each part stands
; down by itself if the file-based fix it replaces is still installed
; (hud/install.sh reverts those), and says so in HUD.log.
[HUD]
; Layout canvas re-declared as 1200*W/H wide, anchored panels and the
; command palette moved to match.  Applied when a mission loads, and again
; after a display mode change in one (Relayout=).
Canvas=1
; Font condensed horizontally by 1.25*H/W.  Follows every display change.
Font=1
; Cursors drawn at H/600 on both axes instead of W/800 by H/600.
Cursor=1
; Lay the HUD out again when the display mode is changed in a mission
; (Graphics Settings); with 0 it follows at the next mission.  Needs Canvas=1.
Relayout=1
; Tiled panels (the briefing, the HUD's pieced frames) drawn edge to edge:
; no 1-2 px gaps where the UI scale is not a whole number.
Seams=1
; 1 writes HUD.log beside Armada2.exe.
Log=1
