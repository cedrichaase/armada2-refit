; Shields.asi -- shield hits drawn by a shader (shields/shields.c, shields/README.md)
[Shields]
; 1: the ordinary shield hits are drawn by the plugin; 0: the stock shell everywhere.
Enable=1
; 1: re-read this file within half a second of an edit.
Reload=1
; 1: log every hit (its weapon, damage, strength, where); 0: only the first dozen.
LogHits=0
Log=1

; Overall brightness of the hits.
Brightness=1.0
; The colour: faction (by the struck ship's ODF: the keys below), stock (green to red
; by the shields left, as the stock shell is tinted), or fixed (Colour=).
ColourMode=faction
Federation=90,170,255
Klingon=255,140,60
Romulan=90,255,130
Borg=110,255,120
Cardassian=255,200,80
Species8472=210,120,255
Other=140,200,255
Colour=120,190,255
; As the shields run out the colour moves this far (0..1) towards LowColour.
LowColour=255,70,40
LowShift=0.6

; The hot spot where a weapon strikes: brightness, size (in shield radii), how white its
; core goes, and a flash at the blow (its extra brightness and how fast it goes, s).
Spot=1.0
SpotSize=0.18
Core=0.35
Flash=1.5
FlashTime=0.08
; How long a blow's spot takes to fade (s, to 1/e); a beam's spot holds at Sustain of
; full for as long as the beam plays on the shield, then fades over FadeOut (s).
Duration=0.45
Sustain=0.55
FadeOut=0.25

; The ring that runs out across the shield from a hit: brightness, speed (shield radii a
; second), width (shield radii), how long it lasts (s); a beam sends one every RingPeriod
; (s). RingLattice: how much the ring shows the lattice (0: a smooth ring).
Ring=1.1
RingSpeed=2.4
RingWidth=0.09
RingTime=0.55
RingPeriod=0.4
RingLattice=0

; The shield lit about a hit: the lattice and the rim (where the shield is seen edge on),
; how far from the hit (shield radii, to 1/e) and how long (s).
Lattice=0.25
Rim=0.8
RimPower=3.0
GlowReach=0.35
GlowTime=0.6
; a beam's glow holds at this much of full while it plays
GlowSustain=0.3
; The lattice: hex, cells (of noise) or none; cells across a shield radius, line width
; (of a cell), how much the cells crackle (0..1; more as the shields run out).
Pattern=none
HexCells=7
HexLine=0.06
Crackle=0.5

; Strength by the weapon's damage (its ODF's damageBase): sqrt(damage / DamageRef),
; within StrengthMin..StrengthMax.
DamageRef=60
StrengthMin=0.6
StrengthMax=1.8

; Weaker as the shields run out: brightness at none left (of full), and below
; FlickerBelow (of full) a flicker this deep, this many times a second.
WeakLevel=0.45
Flicker=0.6
FlickerBelow=0.5
FlickerRate=18

; For looking at the effect frame by frame: its clock runs at this speed (1: real time).
; Changing it while the game runs makes the hits on screen jump.
TimeScale=1

; ---- Shields down ----------------------------------------------------------------
; A ship whose shields are down (stock: a band of lightning texture circling it):
; arcs of lightning crackling over its shield ellipsoid instead. Down=0 leaves the
; stock ring.
Down=1
DownBrightness=2.5
; The arcs' white-hot core and the glow about them (0..255, above 255 for more), and a faint haze over the
; shell, brightest at its rim.
DownArc=215,230,255
DownGlow=140,210,510
DownHaze=0.02
; The arcs: how many cells of noise across the shield (more: shorter, busier arcs),
; how jagged, the core's width in pixels (the same at every distance), the glow's width,
; how much they fork (0 none), and how much of each line is lit (-1..1: only stretches
; of it, so the arcs read as separate bolts).
DownScale=2.6
DownWarp=0.55
DownCore=2.0
DownGlowWidth=0.08
DownBranches=0.6
DownLit=-0.2
; How many times a second the arcs strike afresh (two fields, half a step apart: they
; jump from place to place, nothing turns).
DownRate=7
; The arcs show in discharges, up to six at once: each a patch of the shell (its size
; in shield radii, to 1/e), mostly about the equator, flaring for DownStrikeMin..Max
; seconds and striking again elsewhere after up to twice DownStrikeGap.
DownStrikes=5
DownStrikeSize=0.7
DownStrikeMin=0.12
DownStrikeMax=0.45
DownStrikeGap=0.15
; Faint arcs all round the equator between discharges, and the band's half width (in
; the unit sphere's height, to 1/e).
DownCrackle=0.2
DownBand=0.35
; A flash over the whole shell as the shields collapse, fading over DownFlashTime (s);
; the arcs fade over DownFadeOut (s) once the shields are back.
DownFlash=1.2
DownFlashTime=0.35
DownFadeOut=0.4
; How bright the far side of the shell is, seen through it; the haze's rim exponent.
DownFarSide=0.45
DownRimPower=2.5
; The light the discharges cast on the ship's own hull (0: none): its colour (0..255)
; times this, from the brightest discharge, full to DownLightReach of the ship's
; bounding radius. Reaches
; GPU-drawn hulls through Lighting.asi.
DownLight=3.0
DownLightColour=150,180,255
DownLightReach=1.2

; ---- The special weapons' shells ----
;
; Shells=0 leaves them all stock. A special weapon's shell (the shield effect its ODF
; names in shieldGeometryName) is drawn by the plugin when it has a section
; [Shell.<its model's name>] with On=1: as a hit of its own Colour (0..255) and
; Brightness, Spot, Ring and Lattice (as above), held for as long as the engine keeps
; it and sending a ring out every RingPeriod, as a beam's hit does. Shields.log names
; the models ("special weapons' shells: ...").
Shells=1

; Federation corbomite reflector: a bright gold-white mirror, its lattice standing out.
[Shell.wcorbrfr]
On=1
Colour=255,215,120
Brightness=1.8
Spot=1.3
Ring=1.3
Lattice=0.8

; Shield recharge (the shield emitter, the energy recharger): soft blue-white.
[Shell.wshldadd]
On=1
Colour=120,180,255
Brightness=1.0
Spot=0.8
Ring=1.0
Lattice=0.4

; Shield drain: red, sinking.
[Shell.wshldsub]
On=1
Colour=255,70,50
Brightness=1.0
Spot=1.0
Ring=0.8
Lattice=0.3

; Shield remodulation: violet.
[Shell.wshldrmd]
On=1
Colour=190,110,255
Brightness=1.0
Spot=0.9
Ring=1.0
Lattice=0.5

; Gemini effect: orange.
[Shell.wmanhiem]
On=1
Colour=255,150,50
Brightness=1.1
Spot=1.0
Ring=1.0
Lattice=0.3

; Species 8472 clairvoyant link: gold.
[Shell.WEclairlink1]
On=1
Colour=255,190,60
Brightness=1.0
Spot=0.9
Ring=1.0
Lattice=0.3
