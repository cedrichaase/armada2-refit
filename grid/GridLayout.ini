; GridLayout.asi -- the button bar as a 5x3 grid with one key per cell (grid/README.md)
;
;     Q W E R | T     T  cancel, in every build menu
;     A S D F | G     G  back, in every submenu
;     Z X C V | B     B  the 13th item of a construction ship's build list
;
; Keys are positions, not letters: on a QWERTZ keyboard the bottom-left key is Y.
; The bar's stock keys (F1-F12 for build items, C/V/B/N/F/X for the menus, the command
; letters) do nothing while the grid is on. Delete GridLayout.asi to get them back.

[GridLayout]
Enabled=1
; the key in each button's corner
Labels=1
; their size, in percent of the HUD's own text (50-150)
LabelSize=87
; beside: the grid between the minimap and the info panel, which moves right to make
; room, wherever there is that room (16:9 and wider); above: always above the info
; panel, where stock's bar is
Place=beside
; GridLayout.log: what each menu put where, and each key pressed
Log=1

[Cells]
; Move one button to another key: <name>=<key>, with the names GridLayout.log prints.
; A key already taken goes to whoever claims it first; the button that loses falls
; back to the free cells.
; bmining=Q
