# Every push and pull request: check that the new commits are publishable, build the
# release zip (publish/package.sh) kept as a workflow artifact, and run its installers
# against a mock game on Linux and Windows (publish/installer/test.sh, test.ps1), and the
# GUI installer's (gui-installer/test.sh), which is also built as an AppImage on
# ubuntu-24.04, the oldest system it is meant to run on, and tested the same way. The GUI
# installer is also frozen with PyInstaller (gui-installer/pyinstaller/build.py) into a
# portable .exe on Windows and a universal2 .app on macOS, each tested against a mock game
# (gui-installer/test-windows.ps1, test-macos.sh); install.sh is run on macOS too.
# A push to main whose root CHANGELOG.md version has no release yet also tags vX.Y.Z and
# publishes a GitHub Release with that zip and the three installers. publish/README.md,
# "Release packages". On main and on dispatch, every program in the release is also
# scanned on VirusTotal, report only, and the reports attached to the release
# (publish/README.md, "VirusTotal").
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every new commit is publishable (publish/check.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # New commits only: those since the push's old tip or the PR's base. A new
          # branch has no old tip; it is checked from where it leaves main, as a PR
          # would be, since what main holds is published already. (Checking
          # all of history failed every new branch on 24cbcd0, which committed build
          # output that da4a4a6 took out again.) With no main to compare against,
          # everything is checked.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          elif mb=$(git merge-base origin/main HEAD 2>/dev/null); then
            range="$mb..HEAD"
          else
            range=HEAD
          fi
          fail=0
          for c in $(git rev-list "$range"); do
            publish/check.sh "$c" || fail=1
          done
          exit $fail

  # render3d builds Render3D.asi from Rust (no_std, i686-pc-windows-msvc, lld-link) and
  # tests its asset readers on the host (the tests that need a game install skip).
  # The shaders are committed with a stamp, so no HLSL compiler is needed here.
  render3d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install lld-link, llvm-dlltool and llvm-rc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld llvm
          bin=$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -1)
          # llvm-rc compiles each plugin's version resource (platform/versioninfo/).
          test -x "$bin/llvm-rc" && test -x "$bin/llvm-dlltool"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Rust with the 32-bit Windows target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add i686-pc-windows-msvc
          # lld-link is the toolchain's own lld (rust-lld, named lld-link so it links
          # COFF), first on PATH: rustc writes /export lines with EXPORTAS for the 32-bit
          # stdcall DllMain, which Ubuntu's lld-link 18 refuses ("invalid /export"). The C
          # plugins link with it too.
          lld="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          mkdir -p "$RUNNER_TEMP/lld"
          ln -s "$lld" "$RUNNER_TEMP/lld/lld-link"
          echo "$RUNNER_TEMP/lld" >> "$GITHUB_PATH"
      - name: Build Render3D.asi
        run: CARGO="$(command -v cargo)" render3d/build.sh
      - name: a2fmt on the host
        run: cargo test --release --target x86_64-unknown-linux-gnu --manifest-path render3d/a2fmt/Cargo.toml

  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install clang, lld-link, llvm-dlltool, llvm-rc and llvm-readobj
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm zip
          bin=$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -1)
          # llvm-rc compiles each plugin's version resource (platform/versioninfo/), and
          # package.sh checks it with llvm-readobj.
          test -x "$bin/llvm-rc" && test -x "$bin/llvm-readobj" && test -x "$bin/llvm-dlltool"
          echo "$bin" >> "$GITHUB_PATH"
      # Render3D.asi and UI.asi are no_std Rust (render3d/build.sh, ui/build.sh).
      - name: Rust with the 32-bit Windows target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add i686-pc-windows-msvc
          # lld-link is the toolchain's own lld (rust-lld, named lld-link so it links
          # COFF), first on PATH: rustc writes /export lines with EXPORTAS for the 32-bit
          # stdcall DllMain, which Ubuntu's lld-link 18 refuses ("invalid /export"). The C
          # plugins link with it too.
          lld="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          mkdir -p "$RUNNER_TEMP/lld"
          ln -s "$lld" "$RUNNER_TEMP/lld/lld-link"
          echo "$RUNNER_TEMP/lld" >> "$GITHUB_PATH"
      - name: Build and package
        id: pkg
        run: |
          export CARGO="$(command -v cargo)"
          zip=$(publish/package.sh dist)
          echo "version=$(basename "$zip" | sed 's/^armada2-refit-\(.*\)\.zip$/\1/')" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"
      - name: install.sh against a mock game
        run: publish/installer/test.sh dist/*.zip
      - name: the GUI installer's logic against a mock game and a mock Heroic
        run: gui-installer/test.sh dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: armada2-refit-${{ github.sha }}
          path: |
            dist/*.zip
            dist/armada2-refit-installer.py
          if-no-files-found: error

  appimage:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: What the AppImage bundles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-1 libadwaita-1-0 adwaita-icon-theme librsvg2-common libglib2.0-bin \
            libgdk-pixbuf2.0-bin
      - name: Build the AppImage
        run: gui-installer/appimage/build.sh dist
      - name: the GUI installer's logic, through the AppImage
        env:
          A2_INSTALLER_APPIMAGE: dist/armada2-refit-installer-x86_64.AppImage
        run: gui-installer/test.sh dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: armada2-refit-installer-${{ github.sha }}
          path: dist/armada2-refit-installer-x86_64.AppImage
          if-no-files-found: error

  windows-installer:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: install.ps1 against a mock game
        shell: powershell
        run: publish/installer/test.ps1 (Get-Item dist/*.zip).FullName

  # The GUI installer as one windowed .exe, which needs no Python on the machine: it also
  # runs the package's Python scripts (A2_PYTHON). PyInstaller is pinned in
  # gui-installer/pyinstaller/requirements.txt. 64-bit: the installer need not match the
  # 32-bit game.
  windows-gui:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: Build armada2-refit-installer-windows.exe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r gui-installer/pyinstaller/requirements.txt
          python gui-installer/pyinstaller/build.py --out dist
      - name: the frozen installer against a mock game
        shell: powershell
        run: gui-installer/test-windows.ps1 (Get-Item dist/armada2-refit-[0-9]*.zip).FullName dist/armada2-refit-installer-windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: armada2-refit-installer-windows-${{ github.sha }}
          path: dist/armada2-refit-installer-windows.exe
          if-no-files-found: error

  # The GUI installer as an .app, universal2 (Apple Silicon and Intel): setup-python's
  # macOS builds are python.org's universal2 framework, with Tk. Signed ad hoc, not
  # notarised. The game runs in a Wine prefix (CrossOver and the like), so install.sh is
  # what installs there: it is tested here on macOS's own bash 3.2 and BSD tools as well.
  macos-gui:
    needs: package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: Build armada2-refit-installer-macos.zip
        run: |
          python -m pip install --disable-pip-version-check -r gui-installer/pyinstaller/requirements.txt
          python gui-installer/pyinstaller/build.py --out dist --arch universal2
      - name: install.sh against a mock game, on macOS
        run: publish/installer/test.sh dist/armada2-refit-[0-9]*.zip
      - name: the frozen installer against a mock game in a mock CrossOver bottle
        run: gui-installer/test-macos.sh dist/armada2-refit-[0-9]*.zip dist/armada2-refit-installer-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: armada2-refit-installer-macos-${{ github.sha }}
          path: dist/armada2-refit-installer-macos.zip
          if-no-files-found: error

  # Every PE in the release zip and the Windows installer, scanned on VirusTotal
  # (publish/virustotal.py): report only. On pushes to main and on dispatch, never on every
  # branch push: the public API allows 4 requests a minute and 500 a day. Without the
  # VT_API_KEY secret (forks) it is skipped with a notice. It does not hold the release
  # back; virustotal-release attaches its reports to the release afterwards. The
  # repository variable VT_FAIL_ABOVE (unset) makes it fail on more detections than that.
  virustotal:
    needs: [package, windows-gui]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One scan at a time: they share the key's quota.
    concurrency:
      group: virustotal
      cancel-in-progress: false
    outputs:
      reports: ${{ steps.scan.outputs.reports }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-installer-windows-${{ github.sha }}
          path: dist
      - name: Scan on VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_FAIL_ABOVE: ${{ vars.VT_FAIL_ABOVE }}
        run: |
          rc=0
          python3 publish/virustotal.py scan --zip "$(ls dist/armada2-refit-[0-9]*.zip)" \
            --extra dist/armada2-refit-installer-windows.exe --out vt --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || rc=$?
          # Reports are written even when VT_FAIL_ABOVE fails the scan (exit 3).
          [ -f vt/virustotal.json ] && echo "reports=1" >> "$GITHUB_OUTPUT"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: virustotal-${{ github.sha }}
          path: |
            vt/virustotal.json
            vt/virustotal.md
          if-no-files-found: ignore

  release:
    needs: [publishable, package, appimage, windows-installer, windows-gui, macos-gui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-installer-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-installer-windows-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-installer-macos-${{ github.sha }}
          path: dist
      - name: Release vX.Y.Z if it does not exist yet
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"; exit 0
          fi
          # Notes: the root changelog's newest entry, without its heading.
          awk '/^## /{if (f) exit; f=1; next} f' CHANGELOG.md > notes.md
          {
            printf '\n---\n**Installing**, with the GOG release of the game:\n\n'
            printf -- '- **Windows**: download `armada2-refit-installer-windows.exe` and run it. It is not signed, so SmartScreen may hold it the first time: *More info* → *Run anyway*.\n'
            printf -- '- **macOS**: needs CrossOver (or another Wine) with the game installed in it. Download `armada2-refit-installer-macos.zip` and unzip it. The app is not notarised, so the first time macOS refuses to open it: on macOS 15 and later, go to System Settings → Privacy & Security and click *Open Anyway*; on older macOS, right-click the app → *Open*.\n'
            printf -- '- **Linux**: download `armada2-refit-installer-x86_64.AppImage`, make it executable (`chmod +x`) and run it.\n'
            printf -- '- **By hand**: README.txt in the zip, and [Installing by hand](%s/%s/blob/%s/README.md#installing-by-hand-layer-by-layer).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag"
          } >> notes.md
          # An entry nobody has seen working in game yet ships as a pre-release, and so
          # does one with a line starting "Pre-release" (seen, but not everywhere yet).
          pre=()
          grep -qiE 'not yet seen in game|^pre-release' notes.md && pre=(--prerelease)
          gh release create "$tag" "dist/armada2-refit-$VERSION.zip" dist/armada2-refit-installer.py \
            dist/armada2-refit-installer-x86_64.AppImage dist/armada2-refit-installer-windows.exe \
            dist/armada2-refit-installer-macos.zip --target "$GITHUB_SHA" \
            --title "Armada II Refit $VERSION" --notes-file notes.md "${pre[@]}"
      - name: Keep only the newest ten releases
        run: |
          # Older releases are deleted; their tags stay, so changelogs and links that
          # name a version still resolve. publish/README.md, "Release packages".
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:][] | .tagName' |
          while read -r tag; do
            echo "deleting release $tag (tag kept)"
            gh release delete "$tag" --yes
          done

  # The scan's reports onto the release, once both exist: virustotal.json and
  # virustotal.md as assets, and a VirusTotal line in the notes (replaced on a re-scan).
  # Only onto vX.Y.Z made from this very commit, so a push that releases nothing, or a
  # dispatch on a branch, attaches nothing. A failed or skipped release, or no report (no
  # key, or a scan that broke), leaves the release as it is.
  virustotal-release:
    needs: [package, virustotal, release]
    if: always() && needs.virustotal.outputs.reports == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: virustotal-${{ github.sha }}
          path: vt
      - name: Attach the reports to vX.Y.Z
        run: |
          tag="v$VERSION"
          target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null) \
            || { echo "$tag is not released"; exit 0; }
          [ "$target" = "$GITHUB_SHA" ] || { echo "$tag is $target's, not this commit's"; exit 0; }
          gh release upload "$tag" vt/virustotal.json vt/virustotal.md --clobber
          gh release view "$tag" --json body --jq .body > notes.md
          python3 publish/virustotal.py notes vt/virustotal.json --splice notes.md \
            --assets "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag" > notes-vt.md
          gh release edit "$tag" --notes-file notes-vt.md
