# Every push and pull request: check that the new commits are publishable, build the
# release zip (publish/package.sh) kept as a workflow artifact, and run its installers
# against a mock game on Linux and Windows (publish/installer/test.sh, test.ps1), and the
# GUI installer's (gui-installer/test.sh).
# A push to main whose root CHANGELOG.md version has no release yet also tags vX.Y.Z and
# publishes a GitHub Release with that zip. publish/README.md, "Release packages".
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every new commit is publishable (publish/check.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # New commits only: those since the push's old tip or the PR's base. A new
          # branch has no old tip; it is checked from where it leaves main, as a PR
          # would be, since what main holds is published already. (Checking
          # all of history failed every new branch on 24cbcd0, which committed build
          # output that da4a4a6 took out again.) With no main to compare against,
          # everything is checked.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          elif mb=$(git merge-base origin/main HEAD 2>/dev/null); then
            range="$mb..HEAD"
          else
            range=HEAD
          fi
          fail=0
          for c in $(git rev-list "$range"); do
            publish/check.sh "$c" || fail=1
          done
          exit $fail

  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install clang, lld-link and llvm-dlltool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm zip
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Build and package
        id: pkg
        run: |
          zip=$(publish/package.sh dist)
          echo "version=$(basename "$zip" | sed 's/^armada2-refit-\(.*\)\.zip$/\1/')" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"
      - name: install.sh against a mock game
        run: publish/installer/test.sh dist/*.zip
      - name: the GUI installer's logic against a mock game and a mock Heroic
        run: gui-installer/test.sh dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: armada2-refit-${{ github.sha }}
          path: |
            dist/*.zip
            dist/armada2-refit-installer.py
          if-no-files-found: error

  windows-installer:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: install.ps1 against a mock game
        shell: powershell
        run: publish/installer/test.ps1 (Get-Item dist/*.zip).FullName

  # The vkBasalt instructions the installers show (armada2-refit-installer.py
  # --vkbasalt-howto), run as written on each distribution, and a 32-bit layer checked
  # for afterwards. Only "sudo" and the confirmation prompts are adapted. Not a gate for
  # the release: a distribution changing its packaging fails this, and the fix is the
  # instructions, not the mod.
  vkbasalt-howto:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: debian, image: 'debian:trixie' }
          - { family: fedora, image: 'fedora:latest' }
          - { family: arch, image: 'archlinux:latest' }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Python, file, and no confirmation prompts
        run: |
          if command -v apt-get >/dev/null; then
            echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90yes
            apt-get update -qq && apt-get install -qq python3 file sudo
          elif command -v dnf >/dev/null; then
            echo 'assumeyes=True' >> /etc/dnf/dnf.conf
            dnf install -q -y python3 file sudo
          else
            # [multilib], which the instructions ask for: uncommented, or added.
            sed -i '/^#\[multilib\]/,/^#Include/ s/^#//' /etc/pacman.conf
            grep -q '^\[multilib\]' /etc/pacman.conf ||
              printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
            grep -A1 '^\[multilib\]' /etc/pacman.conf
            pacman -Syu --noconfirm --needed python file sudo base-devel git
          fi
      - name: The instructions, as written
        run: |
          gui=gui-installer/armada2-refit-installer.py
          python3 "$gui" --vkbasalt-howto ${{ matrix.family }}
          cmd=$(python3 "$gui" --vkbasalt-howto ${{ matrix.family }} --command 1)
          if [ ${{ matrix.family }} = arch ]; then
            # yay refuses to run as root: a user, with yay itself from the AUR.
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            sudo -u builder bash -c 'cd ~ && git clone -q https://aur.archlinux.org/yay-bin.git &&
                cd yay-bin && makepkg -si --noconfirm'
            sudo -u builder bash -c "$cmd --noconfirm"
          else
            bash -c "$cmd"
          fi
      - name: A 32-bit vkBasalt layer is there
        run: |
          ls /usr/share/vulkan/implicit_layer.d/ | grep -i basalt
          find / -xdev -name 'libvkbasalt.so*' -type f -exec file {} + | tee /tmp/libs
          grep -q 'ELF 32-bit' /tmp/libs

  vkbasalt-howto-ubuntu:
    # Ubuntu has no 32-bit package: its instructions build one with
    # postfx/vkbasalt/build.sh, here this checkout's, into the runner's home.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The build's prerequisites, as written
        run: |
          echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90yes
          gui=gui-installer/armada2-refit-installer.py
          python3 "$gui" --vkbasalt-howto ubuntu
          bash -c "$(python3 "$gui" --vkbasalt-howto ubuntu --command 1)"
          bash -n -c "$(python3 "$gui" --vkbasalt-howto ubuntu --command 2)"
      - name: The build, and a 32-bit layer in ~/.local
        run: |
          postfx/vkbasalt/build.sh
          ls ~/.local/share/vulkan/implicit_layer.d/ | grep -i basalt
          file ~/.local/lib/a2-vkbasalt/libvkbasalt.so | grep 'ELF 32-bit'

  release:
    needs: [publishable, package, windows-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: armada2-refit-${{ github.sha }}
          path: dist
      - name: Release vX.Y.Z if it does not exist yet
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"; exit 0
          fi
          # Notes: the root changelog's newest entry, without its heading.
          awk '/^## /{if (f) exit; f=1; next} f' CHANGELOG.md > notes.md
          printf '\n---\nInstalling: on Linux, download armada2-refit-installer.py and run it (python3 armada2-refit-installer.py); otherwise README.txt in the zip, and [Installing by hand](%s/%s/blob/%s/README.md#installing-by-hand-layer-by-layer).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> notes.md
          # An entry nobody has seen working in game yet ships as a pre-release.
          pre=()
          grep -qi 'not yet seen in game' notes.md && pre=(--prerelease)
          gh release create "$tag" dist/*.zip dist/armada2-refit-installer.py --target "$GITHUB_SHA" \
            --title "Armada II Refit $VERSION" --notes-file notes.md "${pre[@]}"
      - name: Keep only the newest three releases
        run: |
          # Older releases are deleted; their tags stay, so changelogs and links that
          # name a version still resolve. publish/README.md, "Release packages".
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' |
          while read -r tag; do
            echo "deleting release $tag (tag kept)"
            gh release delete "$tag" --yes
          done
