# Every push and pull request: check that the new commits are publishable, and build
# the plugins into a zip (publish/package.sh) kept as a workflow artifact.
# A push to main whose root CHANGELOG.md version has no release yet also tags vX.Y.Z and
# publishes a GitHub Release with that zip. publish/README.md, "Release packages".
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every new commit is publishable (publish/check.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # New commits only: those since the push's old tip or the PR's base. A new
          # branch has no old tip, so everything on it is checked.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          else
            range=HEAD
          fi
          fail=0
          for c in $(git rev-list "$range"); do
            publish/check.sh "$c" || fail=1
          done
          exit $fail

  plugins:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld-link and llvm-dlltool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm zip
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Build and package
        id: pkg
        run: |
          zip=$(publish/package.sh dist)
          echo "version=$(basename "$zip" | sed 's/^armada2-refit-\(.*\)-plugins\.zip$/\1/')" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: armada2-refit-plugins-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [publishable, plugins]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plugins.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: armada2-refit-plugins-${{ github.sha }}
          path: dist
      - name: Release vX.Y.Z if it does not exist yet
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"; exit 0
          fi
          # Notes: the root changelog's newest entry, without its heading.
          awk '/^## /{if (f) exit; f=1; next} f' CHANGELOG.md > notes.md
          printf '\n---\nInstalling: README.txt in the zip, and [Installing by hand](%s/%s/blob/%s/README.md#installing-by-hand-layer-by-layer).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> notes.md
          # An entry nobody has seen working in game yet ships as a pre-release.
          pre=()
          grep -qi 'not yet seen in game' notes.md && pre=(--prerelease)
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" \
            --title "Armada II Refit $VERSION" --notes-file notes.md "${pre[@]}"
