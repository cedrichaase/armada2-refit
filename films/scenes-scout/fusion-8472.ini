; A Species 8472 mothership firing its pulse cannons at a Borg Fusion Cube, for the promo's
; 8472 beat. The mothership stands on the cube's -z side, heading 0 (towards +z), 340 off:
; the Key comes from the -x, -z side, so the cube's -z face, the one the pulses hit, is lit.
; The camera is behind and above the mothership, looking over it at that face. The cube is
; healed, immortal and unarmed and takes every hit on its shields; ShieldFx=0 removes the
; shield flash, so what lights the plating is the impact light. Escorts for scale, healed,
; immortal, weapons and engines off, no orders, all team 1 (team 2 ones drew the mothership's
; fire, bench 2026-10-17): three bioships round the mothership, two Borg spheres by the cube,
; all off the line of fire. Keys: testbench/scene/README.md.
