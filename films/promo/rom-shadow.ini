; A Romulan fleet in the shadow of a class M planet, for planet shadows (render3d's
; hulls, `PlanetShadows`, lighting 1.15.0): the fleet starts cloaked inside the
; shadow, decloaks, and flies out of it into the Key light. Keys: testbench/scene/README.md.
;
; The Key travels along 0.50 -0.50 0.71 on a2_borg01 (Render3D.log, "scene lights"):
; it comes from heading -145 (yaw 215), 30 degrees above the plane. A planet shadows a
; cylinder of its own radius back along that line, so the planet sits 600 units
; towards the Key from the fleet's centre (2400,0,2400) and 300 above it. The shadow
; cuts the ships' plane in an ellipse, one radius across the fleet's course (heading 125,
; across the Key) and two along the Key. The fleet is a wide echelon of six (three
; warbirds, two Griffins, a Shrike) facing 125, spread so that no hull comes near
; another (the first echelon, 140 apart, bumped and jittered): the lead on the line
; through the fleet's centre, the warbirds 320 to each side and 220 behind it, the
; Griffins 170 to each side and 480 behind, the Shrike 700 behind. The lead starts 450
; back along the course from the centre, and the film's `goto` is given while the fleet
; is still cloaked, so it is under way (about 95 units a second) at the decloak, and
; the lead leaves the shadow, across its narrow side, at the time the first echelon did
; (10.5 to 12.5 s into the action). Team 2, so cloaked means unseen. The goto point is
; 1500 along the course from the fleet's centre. The board parks the pointer off screen
; (`ptr`): over the planet it draws the planet's height post, a green line.
