; A Federation fleet inside the Mutara nebula (mnebula8, purple), flying towards the
; Key light, for the promo's nebula shot: the hulls' shadows run back through the gas
; (nebulae/README.md, "Ships' shadows in the gas"). Keys: testbench/scene/README.md.
;
; The Key (Lighting.ini KeyAxis 0.50 -0.50 0.71, the direction its light travels) comes
; from -x,+y,-z, about 30 degrees above the plane. Seen from above it lies at heading
; -145 (0 faces +z, 90 faces +x), so the fleet faces -145 and a `goto` along that line
; flies it at the Key; a camera at yaw ~35 looks after it, towards the Key.
;
; Seven overlapping mnebula8 along that line make one long field (each nebula a dome of
; its own, blended where they overlap). The shafts run back along the path and down,
; so the fleet starts in the middle, with ~700 units of gas behind it for them to cross
; and as much ahead to fly into: a wedge of seven led by the Enterprise-E, engines on,
; healed so that no damage effect shows.
