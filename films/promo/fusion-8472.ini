; A Species 8472 mothership firing its pulse cannons at a Borg Fusion Cube, for the promo's
; 8472 beat (c03), restaged on the user's notes on rough cut 5. Keys: testbench/scene/README.md.
;
; The Key: render3d's scene lights travel along 0.50 -0.50 0.71 on every map (Render3D.log,
; "scene lights"), so it comes from heading -145 (215), 30 degrees up. The cube stands 520
; from the mothership towards it (along -0.576 0 -0.818), and the camera looks past the
; mothership from yaw 54 to 61: the Key is behind the cube, the mothership is back and side
; lit, and its own pulses light its bow (render3d's muzzle light, 0.15.0).
;
; Everyone is healed, immortal and has its engines off; the cube is unarmed. The mothership
; fires at the nearest enemy whatever its Attack order (bench 2026-10-17: Borg spheres 440
; from it drew all its fire), so the escorts' fight is off to the side beyond the cube with
; both spheres more than 800 (the pulses' range) from the mothership: two bioships (team 1)
; against two spheres (team 2), each ordered onto one. bs1 is blown up by the board's action.
