; Online.asi -- see online/README.md in the armada2-refit repository.
;
; This version puts "Internet - Online" on the Multiplayer Connection screen,
; in the IPX button's place, and runs a game started there on its own UDP
; transport.  A blank field hosts: with a server set below, the host gets a
; join code (shown in GAME SETUP's chat) and players type that code to join,
; directly where their routers allow it and through the server's relay where
; not.  Typing the host's address joins without the server, as on a LAN.
; Every other connection type keeps the game's DirectPlay; its traffic is
; logged to Online.log without being changed.
[Online]
; 1 = the IPX button is "Internet - Online"; 0 = the screen stays stock.
Entry=1
; The rendezvous and relay server, host:port (port 2399 if left out); c20e.de
; is the project's public one.  Empty: no join codes, players join by address.
; online/server/ has the program, to run your own.
Server=c20e.de
; UDP port an Internet - Online host listens on; joiners use any free one.
Port=2302
; 1 = write Online.log next to the game (recreated at every launch).
Log=1
; Bytes of each packet's payload shown in the log (0-64).
Payload=16
; Testing only: percent of the datagrams this game sends that are dropped on
; purpose (0-50).  0 for play.
Loss=0
; Testing only: 0 = never try to reach the other player directly; everything
; goes through the server's relay.  1 for play.
Direct=1
