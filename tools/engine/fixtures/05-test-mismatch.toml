# Stock with an A2EngineTest.ini: the hooks it names stand down as a failed check would.
set = "basic"
test_ini = """
; the bench's fault injection
[Test]
Mismatch = p.fnhook, s.*
"""
addr = ["f1"]
note_for = ["Graphics.Thing"]

[image]
timestamp = 0x5eed0001
image_base = 0x400000
image_size = 0x6000
section = [
  { name = ".text", va = 0x1000, vsize = 0x2000, raw = 0x2000, flags = "code" },
  { name = ".rdata", va = 0x3000, vsize = 0x1000, raw = 0x1000, flags = "data" },
  { name = ".data", va = 0x4000, vsize = 0x2000, raw = 0x200, flags = "data" },
]
bytes = [
  { at = 0x401000, hex = "55 8b ec 83 ec 10" },     # One::f1
  { at = 0x401100, hex = "55 8b ec" },              # One::f2 (the profile checks 55 89 e5)
  { at = 0x401300, hex = "90 90 90 90 90" },        # One::patched
  { at = 0x401800, hex = "de ad be ef" },           # the scan that finds one
  { at = 0x401900, hex = "ca fe ba be" },           # the scan that finds two
  { at = 0x401a00, hex = "ca fe ba be" },
]
call = [
  { at = 0x401200, to = 0x401000 },                 # One::caller -> f1
  { at = 0x401210, to = 0x7ff00000 },               # One::chainer -> outside the exe
  { at = 0x401220, to = 0x401100 },                 # One::caller -> f2, the profile says f1
]
word = [
  { at = 0x403000, value = 0x401100 },              # One::vftable[0]
  { at = 0x403004, value = 0x401000 },              # [1] = f1
  { at = 0x403008, value = 0x401100 },              # [2] = f2, the profile says f1
]

[expect]
p = [
  "engine: Test.exe timestamp 0x5eed0001, image size 0x6000, sections 0x777d215e",
  "engine: build test/b1",
  "engine: symbols: 13/15 resolved; 0 hooks blocked",
  "engine: TEST: A2EngineTest.ini forces a mismatch for p.fnhook, s.*",
  "engine: p.fnhook stands down: One::f1 test mismatch (A2EngineTest.ini)",
  "ready p.fnhook fail",
  "engine: p.chained: One::chainer at 0x401210 calls 0x7ff00000 (chained)",
  "ready p.chained ok",
  "engine: p.wrongcall stands down: One::caller calls something else",
  "ready p.wrongcall fail",
  "ready p.slothook ok",
  "engine: p.wrongslot stands down: One::vftable calls something else",
  "ready p.wrongslot fail",
  "engine: p.badcheck stands down: One::f2 is not stock (bytes differ)",
  "ready p.badcheck fail",
  "engine: p.fieldhook stands down: One has no address in b1",
  "ready p.fieldhook fail",
  "engine: f1 read before its hook was ready",
  "addr f1 0x0",
  "note p.fnhook Stands down: One::f1: test mismatch (A2EngineTest.ini)",
  "note p.wrongcall Stands down: One::caller is not stock in this Test.exe",
  "note p.wrongslot Stands down: One::vftable is not stock in this Test.exe",
  "note p.badcheck Stands down: One::f2 is not stock in this Test.exe",
  "note p.fieldhook Stands down: One is not stock in this Test.exe",
  "note_for Graphics.Thing Stands down: One::f2 is not stock in this Test.exe",
  "note_plugin -",
]
s = [
  "engine: Test.exe timestamp 0x5eed0001, image size 0x6000, sections 0x777d215e",
  "engine: build test/b1",
  "engine: symbols: 3/3 resolved; 0 hooks blocked",
  "engine: TEST: A2EngineTest.ini forces a mismatch for p.fnhook, s.*",
  "engine: s.scan1 stands down: Two::scanned test mismatch (A2EngineTest.ini)",
  "ready s.scan1 fail",
  "engine: s.scan0 stands down: Two::missing test mismatch (A2EngineTest.ini)",
  "ready s.scan0 fail",
  "engine: s.scan2 stands down: Two::twice test mismatch (A2EngineTest.ini)",
  "ready s.scan2 fail",
  "note s.scan1 Stands down: Two::scanned: test mismatch (A2EngineTest.ini)",
  "note s.scan0 Stands down: Two::missing: test mismatch (A2EngineTest.ini)",
  "note s.scan2 Stands down: Two::twice: test mismatch (A2EngineTest.ini)",
  "note_for Graphics.Thing -",
  "note_plugin -",
]
