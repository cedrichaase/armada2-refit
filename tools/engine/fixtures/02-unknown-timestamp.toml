# The timestamp of no build: every hook is "unknown build" but the scans that run.
set = "basic"
note_for = ["Graphics.Thing"]

[image]
timestamp = 0x5eed0099
image_base = 0x400000
image_size = 0x6000
section = [
  { name = ".text", va = 0x1000, vsize = 0x2000, raw = 0x2000, flags = "code" },
  { name = ".rdata", va = 0x3000, vsize = 0x1000, raw = 0x1000, flags = "data" },
  { name = ".data", va = 0x4000, vsize = 0x2000, raw = 0x200, flags = "data" },
]
bytes = [
  { at = 0x401000, hex = "55 8b ec 83 ec 10" },     # One::f1
  { at = 0x401100, hex = "55 8b ec" },              # One::f2 (the profile checks 55 89 e5)
  { at = 0x401300, hex = "90 90 90 90 90" },        # One::patched
  { at = 0x401800, hex = "de ad be ef" },           # the scan that finds one
  { at = 0x401900, hex = "ca fe ba be" },           # the scan that finds two
  { at = 0x401a00, hex = "ca fe ba be" },
]
call = [
  { at = 0x401200, to = 0x401000 },                 # One::caller -> f1
  { at = 0x401210, to = 0x7ff00000 },               # One::chainer -> outside the exe
  { at = 0x401220, to = 0x401100 },                 # One::caller -> f2, the profile says f1
]
word = [
  { at = 0x403000, value = 0x401100 },              # One::vftable[0]
  { at = 0x403004, value = 0x401000 },              # [1] = f1
  { at = 0x403008, value = 0x401100 },              # [2] = f2, the profile says f1
]

[content]
p = "none"
s = "none"

[expect]
p = [
  "engine: Armada2.exe timestamp 0x5eed0099, image size 0x6000, sections 0x777d215e",
  "engine: unknown build",
  "engine: symbols: 0/14 resolved; 0 hooks blocked",
  "engine: p.fnhook stands down: One::f1 unknown build",
  "ready p.fnhook fail",
  "engine: p.chained stands down: One::chainer unknown build",
  "ready p.chained fail",
  "engine: p.wrongcall stands down: One::chainer unknown build",
  "ready p.wrongcall fail",
  "engine: p.slothook stands down: One::vftable unknown build",
  "ready p.slothook fail",
  "engine: p.wrongslot stands down: One::vftable unknown build",
  "ready p.wrongslot fail",
  "engine: p.badcheck stands down: One::f2 unknown build",
  "ready p.badcheck fail",
  "note p.fnhook This Armada2.exe is a build Refit does not know: it runs stock",
  "note p.chained This Armada2.exe is a build Refit does not know: it runs stock",
  "note p.wrongcall This Armada2.exe is a build Refit does not know: it runs stock",
  "note p.slothook This Armada2.exe is a build Refit does not know: it runs stock",
  "note p.wrongslot This Armada2.exe is a build Refit does not know: it runs stock",
  "note p.badcheck This Armada2.exe is a build Refit does not know: it runs stock",
  "note_for Graphics.Thing This Armada2.exe is a build Refit does not know: it runs stock",
  "note_plugin This Armada2.exe is a build Refit does not know: it runs stock",
]
s = [
  "engine: Armada2.exe timestamp 0x5eed0099, image size 0x6000, sections 0x777d215e",
  "engine: unknown build",
  "engine: symbols: 3/3 resolved; 0 hooks blocked",
  "ready s.scan1 ok",
  "engine: s.scan0 stands down: Two::missing is found 0 times, not 1",
  "ready s.scan0 fail",
  "engine: s.scan2 stands down: Two::twice is found 2 times, not 1",
  "ready s.scan2 fail",
  "note s.scan0 Stands down: Two::missing is not stock in this Armada2.exe",
  "note s.scan2 Stands down: Two::twice is not stock in this Armada2.exe",
  "note_for Graphics.Thing This Armada2.exe is a build Refit does not know: it runs stock",
  "note_plugin This Armada2.exe is a build Refit does not know: it runs stock",
]
