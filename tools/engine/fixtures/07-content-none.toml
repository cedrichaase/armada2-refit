# The child build b3: a content set none for p and "alt" for s (content.toml), with the
# same hooks resolved as in b1 -- the image is b1's with one more section.
set = "basic"
addr = ["f2"]
note_for = ["Graphics.Thing"]

[image]
timestamp = 0x5eed0001
image_base = 0x400000
image_size = 0x8000
section = [
  { name = ".text", va = 0x1000, vsize = 0x2000, raw = 0x2000, flags = "code" },
  { name = ".rdata", va = 0x3000, vsize = 0x1000, raw = 0x1000, flags = "data" },
  { name = ".data", va = 0x4000, vsize = 0x2000, raw = 0x200, flags = "data" },
  { name = ".test", va = 0x6000, vsize = 0x2000, raw = 0x200, flags = "data" },
]
bytes = [
  { at = 0x401000, hex = "55 8b ec 83 ec 10" },     # One::f1
  { at = 0x401100, hex = "55 8b ec" },              # One::f2 (the profile checks 55 89 e5)
  { at = 0x401300, hex = "90 90 90 90 90" },        # One::patched
  { at = 0x401800, hex = "de ad be ef" },           # the scan that finds one
  { at = 0x401900, hex = "ca fe ba be" },           # the scan that finds two
  { at = 0x401a00, hex = "ca fe ba be" },
]
call = [
  { at = 0x401200, to = 0x401000 },                 # One::caller -> f1
  { at = 0x401210, to = 0x7ff00000 },               # One::chainer -> outside the exe
  { at = 0x401220, to = 0x401100 },                 # One::caller -> f2, the profile says f1
]
word = [
  { at = 0x403000, value = 0x401100 },              # One::vftable[0]
  { at = 0x403004, value = 0x401000 },              # [1] = f1
  { at = 0x403008, value = 0x401100 },              # [2] = f2, the profile says f1
]

[content]
p = "none"
s = "alt"

[expect]
p = [
  "engine: Armada2.exe timestamp 0x5eed0001, image size 0x8000, sections 0x756db512",
  "engine: build test/b3",
  "engine: symbols: 13/14 resolved; 0 hooks blocked",
  "ready p.fnhook ok",
  "engine: p.chained: One::chainer at 0x401210 calls 0x7ff00000 (chained)",
  "ready p.chained ok",
  "engine: p.wrongcall stands down: One::caller calls something else",
  "ready p.wrongcall fail",
  "ready p.slothook ok",
  "engine: p.wrongslot stands down: One::vftable calls something else",
  "ready p.wrongslot fail",
  "engine: p.badcheck stands down: One::f2 is not stock (bytes differ)",
  "ready p.badcheck fail",
  "engine: f2 read before its hook was ready",
  "addr f2 0x0",
  "note p.wrongcall Stands down: One::caller is not stock in this Armada2.exe",
  "note p.wrongslot Stands down: One::vftable is not stock in this Armada2.exe",
  "note p.badcheck Stands down: One::f2 is not stock in this Armada2.exe",
  "note_for Graphics.Thing Stands down: One::f2 is not stock in this Armada2.exe",
  "note_plugin -",
]
s = [
  "engine: Armada2.exe timestamp 0x5eed0001, image size 0x8000, sections 0x756db512",
  "engine: build test/b3",
  "engine: symbols: 3/3 resolved; 0 hooks blocked",
  "ready s.scan1 ok",
  "engine: s.scan0 stands down: Two::missing is found 0 times, not 1",
  "ready s.scan0 fail",
  "engine: s.scan2 stands down: Two::twice is found 2 times, not 1",
  "ready s.scan2 fail",
  "note s.scan0 Stands down: Two::missing is not stock in this Armada2.exe",
  "note s.scan2 Stands down: Two::twice is not stock in this Armada2.exe",
  "note_for Graphics.Thing -",
  "note_plugin -",
]
