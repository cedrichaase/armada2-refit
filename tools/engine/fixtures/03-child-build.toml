# The Roots shape: stock's timestamp, another image size and an extra section, so
# the child build b2: its [[changed]] (verified for one hook), its [[disable]], an
# entry it overrides and one it adds.
set = "basic"
addr = ["n1", "f2"]
note_for = ["Graphics.Thing"]

[image]
timestamp = 0x5eed0001
image_base = 0x400000
image_size = 0x7000
section = [
  { name = ".text", va = 0x1000, vsize = 0x2000, raw = 0x2000, flags = "code" },
  { name = ".rdata", va = 0x3000, vsize = 0x1000, raw = 0x1000, flags = "data" },
  { name = ".data", va = 0x4000, vsize = 0x2000, raw = 0x200, flags = "data" },
  { name = ".test", va = 0x6000, vsize = 0x1000, raw = 0x200, flags = "data" },
]
bytes = [
  { at = 0x401000, hex = "55 8b ec 83 ec 10" },     # One::f1
  { at = 0x401100, hex = "55 8b ec" },              # One::f2 (the profile checks 55 89 e5)
  { at = 0x401300, hex = "90 90 90 90 90" },        # One::patched
  { at = 0x401800, hex = "de ad be ef" },           # the scan that finds one
  { at = 0x401900, hex = "ca fe ba be" },           # the scan that finds two
  { at = 0x401a00, hex = "ca fe ba be" },
]
call = [
  { at = 0x401200, to = 0x401000 },                 # One::caller -> f1
  { at = 0x401210, to = 0x7ff00000 },               # One::chainer -> outside the exe
  { at = 0x401220, to = 0x401100 },                 # One::caller -> f2, the profile says f1
]
word = [
  { at = 0x403000, value = 0x401100 },              # One::vftable[0]
  { at = 0x403004, value = 0x401000 },              # [1] = f1
  { at = 0x403008, value = 0x401100 },              # [2] = f2, the profile says f1
]

[content]
p = "stock"
s = "stock"

[expect]
p = [
  "engine: Test.exe timestamp 0x5eed0001, image size 0x7000, sections 0xa56c4602",
  "engine: build test/b2",
  "engine: symbols: 7/14 resolved; 2 hooks blocked",
  "engine: p.fnhook stands down: One::caller is changed by b2 (not yet verified)",
  "ready p.fnhook fail",
  "engine: p.chained stands down: One::chainer is off in b2: b2 has its own",
  "ready p.chained fail",
  "engine: p.wrongcall stands down: One::caller calls something else",
  "ready p.wrongcall fail",
  "ready p.slothook ok",
  "engine: p.wrongslot stands down: One::vftable calls something else",
  "ready p.wrongslot fail",
  "ready p.badcheck ok",
  "addr n1 0x406000",
  "addr f2 0x401100",
  "note p.fnhook Stands down: One::caller is changed by b2, not yet verified",
  "note p.chained Stands down: off in b2: b2 has its own",
  "note p.wrongcall Stands down: One::caller is not stock in this Test.exe",
  "note p.wrongslot Stands down: One::vftable is not stock in this Test.exe",
  "note_for Graphics.Thing -",
  "note_plugin -",
]
s = [
  "engine: Test.exe timestamp 0x5eed0001, image size 0x7000, sections 0xa56c4602",
  "engine: build test/b2",
  "engine: symbols: 3/3 resolved; 0 hooks blocked",
  "ready s.scan1 ok",
  "engine: s.scan0 stands down: Two::missing is found 0 times, not 1",
  "ready s.scan0 fail",
  "engine: s.scan2 stands down: Two::twice is found 2 times, not 1",
  "ready s.scan2 fail",
  "note s.scan0 Stands down: Two::missing is not stock in this Test.exe",
  "note s.scan2 Stands down: Two::twice is not stock in this Test.exe",
  "note_for Graphics.Thing -",
  "note_plugin -",
]
