; Fog.asi -- the fog of war and the shroud drawn with smooth edges (fog/README.md).
; Read at start, and again whenever this file changes while the game runs (Reload=1).
[Fog]
; 0: the stock fog and shroud, as without the plugin
Enable=1
; 1: Fog.log beside the game
Log=1
; 1: pick up changes to this file while the game runs
Reload=1

; Each layer on its own: 0 leaves that one stock.
Fog=1
Shroud=1

; How the cells are joined into an edge.
;   bspline      the smoothest: a circle of cells reads as a circle; a gap or a patch
;                one cell wide closes up
;   catmull-rom  closer to the cells: corners stay sharper, and a single cell keeps a
;                small round patch of its own
Filter=bspline

; Where the edge sits, as a fraction of the way from seen (0) to hidden (1): 0.5 is
; where stock's edge is. Lower grows the layer, higher shrinks it.
FogThreshold=0.5
ShroudThreshold=0.5
; How soft the edge is, in the same units: 0 is as sharp as a pixel allows, 0.5 a
; gradient across about two cells. Stock's fog is a gradient, its shroud hard.
FogSoftness=0.2
ShroudSoftness=0.1

; The least width of an edge, in pixels: what keeps it from stepping when zoomed out.
; 0 turns it off (the edge then aliases where Softness is 0).
Antialias=1.0
