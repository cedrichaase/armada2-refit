; QOLRules.asi -- changes to the rules of the game.  See qol/README.md, QOL-7.
;
; Read once at startup; relaunch the game to change it.
;
; Unlike QOL.asi, this changes what every node of a network game simulates, so
; it applies only in a game against the computer (a campaign mission, or
; skirmish) and stands down in any network game.
[Rules]
; 1: an item is paid for the moment it is queued, not when it starts.  An order
; the bank cannot cover (dilithium, metal, latinum, biomatter, crew, officers) is
; dropped, so a queue only holds what is paid; cancelling a queued item gives its
; whole cost back, and so does losing the building to destruction, capture or
; assimilation.  Saves keep which items are paid.  0 leaves the rules stock.
PayOnQueue=1
; 1 writes QOLRules.log beside Armada2.exe: what was read and patched, and every
; payment and refund.
Log=1
