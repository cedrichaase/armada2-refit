; QOL.asi -- gameplay quality of life for Armada II.  See qol/README.md.
;
; Read once at startup; relaunch the game to change it.
[QOL]
; Right-click-drag pan speed, as a multiple of what RTS_CFG.h sets
; (FASTSCROLL_COEFFICIENT).  1 leaves it alone; 0.25 to 10.  Applied in memory,
; so RTS_CFG.h stays stock and network games still accept you.
PanSpeed=2.5
; 1: Shift+number adds the selection to that control group and keeps what is
; in it (as Ctrl+Shift+number does in stock), and Shift's stock meaning --
; select the group and centre the camera on it -- moves to Alt+number.
; Ctrl+number still replaces the group.  0 leaves the number keys stock.
ShiftAddsToGroup=1
; How many objects a selection, and so a control group, can hold.  Stock is
; 16; 17 to 120 raises it, 16 or less leaves it stock.  The selection panel
; still shows the first 16 icons.  Orders for a bigger selection reach stock
; players like any other.
MaxSelection=40
; 1 writes QOL.log beside Armada2.exe: what was read and what was patched.
Log=1
