; QOL.asi -- gameplay quality of life for Armada II.  See qol/README.md.
;
; Read once at startup; relaunch the game to change it.
[QOL]
; Right-click-drag pan speed, as a multiple of what RTS_CFG.h sets
; (FASTSCROLL_COEFFICIENT).  1 leaves it alone; 0.25 to 10.  Applied in memory,
; so RTS_CFG.h stays stock and network games still accept you.
PanSpeed=2.5
; 1: Shift+number adds the selection to that control group and keeps what is
; in it (as Ctrl+Shift+number does in stock), and Shift's stock meaning --
; select the group and centre the camera on it -- moves to Alt+number.
; Ctrl+number still replaces the group.  0 leaves the number keys stock.
ShiftAddsToGroup=1
; 1: stations of one kind (three shipyards, say) can be selected together and
; kept in one control group, and the second press of its number centres the
; camera on them, as it does for ships.  A group holds ships or one kind of
; station: Shift+number refuses anything else, and Ctrl+number replaces the
; group whatever was in it.  0 leaves stations as in stock (one at a time).
StationGroups=1
; A move ordered on the map goes to warp, as one on the minimap does, when the
; selected ships are on average farther than this from where you click (the
; cursor turns into the blue warp ring).  1100 is the distance the computer
; players warp from (RTS_CFG.h); zoomed all the way out, the side of the
; screen is about 1700 from its middle.  Each ship still warps only if warp is
; allowed in the game and it is more than 800 from where it is going.  Alt+click
; warps at any distance, as in stock.  0 leaves moves as in stock.  Other
; players need nothing: it is the minimap's own order.
WarpDistance=1100
; How many objects a selection, and so a control group, can hold.  Stock is
; 16; 17 to 120 raises it, 16 or less leaves it stock.  The selection panel
; still shows the first 16 icons.  Orders for a bigger selection reach stock
; players like any other.
MaxSelection=40
; 1 writes QOL.log beside Armada2.exe: what was read and what was patched.
Log=1
