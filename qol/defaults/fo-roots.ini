; QOL.ini's values on Fleet Operations: Roots (PLAN-FLEETOPS.md, FO-7, decisions 100-110),
; applied over qol/QOL.ini by qol/install.sh for `./install --game fo-roots`
; (ui/apply-defaults.py: only the keys that differ, each in its section; a key QOL.ini
; lacks fails the install). The right-drag pan speed and Shift+number (ShiftAddsToGroup, its
; line deleted: QOL.ini's 1 stands) are on, each verified; every other part is off until it has
; been measured beside Roots' own behaviour, and its row in PLAN-FLEETOPS.md, FO-7, says it is
; verified. Most of them also stand down on their own (the profile marks the functions they
; hook as changed by Roots and not yet verified); the key is what keeps one off after its hook
; is verified and before it is wanted. MaxSelection stays 16 for a reason of its own: Roots
; already holds 30 selected in an array of its own, which QOL's must not replace (decision 109).
[QOL]
StationGroups=0
WarpDistance=0
PathStartsAtOnce=0
RigIgnoresSelf=0
MaxSelection=16
BarKeys=0
