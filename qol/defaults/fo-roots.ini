; QOL.ini's values on Fleet Operations: Roots (PLAN-FLEETOPS.md, FO-7, decisions 100-115),
; applied over qol/QOL.ini by qol/install.sh for `./install --game fo-roots`
; (ui/apply-defaults.py: only the keys that differ, each in its section; a key QOL.ini
; lacks fails the install). On, each verified beside Roots' own code: the right-drag pan
; speed, Shift+number (ShiftAddsToGroup) and move queues (PathStartsAtOnce, decision 114);
; their lines are deleted, QOL.ini's values stand. Off, with the reason in the row of the
; decision: StationGroups (Roots replaces Select and the bar's update, decision 111),
; WarpDistance (Roots has no warp in its games, decision 112), RigIgnoresSelf (Roots' ghost
; already stands on its construction ship, decision 113), MaxSelection (stays 16: Roots
; already holds 30 selected in an array of its own, decision 109) and BarKeys (off by default,
; decision 103; verified with the UI's grid of Roots' bar, decision 335, and turned on in the Refit screen).
[QOL]
StationGroups=0
WarpDistance=0
RigIgnoresSelf=0
MaxSelection=16
BarKeys=0

[BarKeys]
; Roots gives plain W to select_next_ship (the damaged ships of the selection): with the grid's
; keys on it moves to M, free in Roots' key map, and W is the bar's (decision 349).
Rebind=select_next_ship:W>M
