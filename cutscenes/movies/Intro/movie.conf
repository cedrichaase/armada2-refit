# The launch intro.  Stock: animations/Intro.bik in the game directory -- read, never
# written.  640x480, 15 fps, 2019 frames, 134.6 s, Bink 1 ('BIKi').
bik=animations/Intro.bik

# --- stage 1: upscale (paid -> ai/upscale/p<N>.mp4) ---------------------------------
# bria/video-increase-resolution at 2x.  It takes at most 30 s per job, not the 60 its
# description says (422 "Video length is too long"), so the source goes up in pieces.
upscale=bria
upscale_factor=2
# Source frame ranges, start-end, end exclusive.  Every boundary is a scene cut EXCEPT
# the first: there is none in the first 39 s, so p0 and p1 overlap 8 frames either side
# of frame 420 -- the stillest in the stretch -- and the join switches there.  Measured:
# the 419->420 difference in the joined master is 0.0083, inside its neighbours'
# 0.0075-0.0081, i.e. the switch is no bigger than ordinary motion.
pieces=0-428 412-584 584-932 932-1344 1344-1748 1748-2019
joins=420 584 932 1344 1748

# --- stage 2: interpolate 15 -> 30 fps ------------------------------------------------
# minterpolate: free, local, deterministic.  Accepted by the user: on this footage --
# mostly Picard at his table -- it was hard to tell from Topaz Apollo.
# apollo: topaz/frame-interpolation (paid -> ai/interp/p<N>.mp4, over the same pieces
# of src/upscaled.mkv).  Apollo blends across hard cuts, so the build replaces the
# one invented frame at each cut in `cuts` with its predecessor.  minterpolate does
# not need that (scd=fdiff detects cuts itself).
interp=minterpolate
fps=30
minterpolate=mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1:scd=fdiff
apollo_model=apollo
# Hard cuts, source frame numbers (15 fps): scene score > 0.12, plus 1748.
cuts=584 664 677 887 932 1037 1104 1115 1157 1195 1344 1414 1459 1479 1539 1748

# --- stage 3: encode (what cutscenes/binkproxy plays) -----------------------------------
# AV1 + a 16-bit PCM WAV: H.264, VP9 and AAC do not decode under Proton outside Steam.
crf=28
