; cutscenes/binkproxy -- the binkw32.dll replacement.  Read once, at game start.
[BinkProxy]
; Play animations/<Name>.mp4 (+ <Name>.wav) instead of <Name>.bik when present.
ReplaceMovies=1
; Scale the launch reels to fill the screen, centred, bars black.
FitIntro=1
; With UI.asi loaded, hand each full-screen frame to it to draw (its [UI] Movies);
; 0 copies it into the locked back buffer as without the UI.
UseUI=1
; BinkProxy.log beside Armada2.exe.
Log=1
