; Specials.asi -- the warp flash and the special weapons drawn by shaders
; (specials/specials.c, specials/README.md)
[Specials]
; 1: the plugin draws what it has a recipe for; 0: all stock.
Enable=1
; 1: re-read this file within half a second of an edit.
Reload=1
Log=1

; The flash where a craft goes to warp, in place of stock's warp_sprite (Mwarp).
[Warp]
; 1: drawn by the plugin; 0: the stock sprite.
Enable=1
; Overall brightness, and size (1: stock's, 2.5 bounding radii at its fullest), never
; under MinPixels across.
Brightness=1.3
Size=1.0
MinPixels=40
; The flash: how sharp its white core and its glow are, the share and sharpness of the
; four-pointed star, the glow's colour (0..255).
Core=40
Glow=4
Star=0.8
StarSharpness=18
Colour=130,175,255
; The horizontal streak: its share, its length (in the flash's size, to either side),
; how thin, its colour.
Streak=0.9
StreakLength=4
StreakSharpness=26
StreakColour=110,160,255
; Timing: brightness goes as closeness^Rise while the craft closes on the point; when
; it gets there a burst of Burst times over, and an afterglow fading over Afterglow
; seconds.
Rise=2
Burst=1.8
Afterglow=0.45
; The ring that runs out from the point as the craft goes: brightness (0: none), speed
; (bounding radii a second), width (of its radius), how long it lasts (s), colour.
Ring=1.0
RingSpeed=6
RingWidth=0.06
RingTime=0.6
RingColour=150,195,255
; The light the flash casts on the hulls about it (0: none): colour times this, full to
; LightReach bounding radii. Reaches GPU-drawn hulls through Lighting.asi.
Light=3.0
LightColour=160,195,255
LightReach=3.0
