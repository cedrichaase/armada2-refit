; Sky.asi -- the procedural sky (sky/README.md)
[Sky]
; 1: a map whose sky has a recipe in Sky\<name>.ini gets the procedural sky.
; 0: the stock sky everywhere. Read again while the game runs (Reload=1).
Enable=1
; 1: watch this file and the recipe of the sky on screen, and take up an edit
; within half a second, so a recipe can be tuned with the game running.
Reload=1
; The edge of the cube the sky is baked into, once per map, in texels. 1536 holds
; every octave of the noise with room to spare at 4K (sky/README.md, "Cost"); 0
; computes the sky at every pixel, every frame instead: the reference, and costly.
Face=1536
; 1: log the frame time and the sky draw's GPU time every 600 frames.
Timing=0
Log=1
