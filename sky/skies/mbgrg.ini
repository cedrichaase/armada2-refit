; mbgrg -- the red-green sky (prefix mbgrg): five maps.
; Very dim green gas in soft, broken cloud, with rust-brown in places.
; Stock's faces average R, G, B 2.8, 4.8, 2.0 (out of 255); this recipe aims there,
; a little under rather than over. Toned down on request (sky 1.2.3): the clumps
; read too bright and too hard-edged in a2_kling01, so the gas is softer and dimmer
; than stock's crisp clumps -- don't lift it back.
; Every key is documented in sky/README.md, "Recipes".
[Sky]
Seed=44
Scale=3.0
Warp=0.35
Detail=0.5
Coverage=2.1
Softness=2.6
Patchiness=1.0
Ridge=0
Gamma=1.3
HueScale=3.0
HueMix=0.2
Brightness=0.25
Dither=1
Deep=0,1,0
GasA=32,62,24
GasB=58,40,20
Glow=44,72,32
Core1=0,0,10,0
Core1Colour=0,0,0
Core2=0,0,10,0
Core2Colour=0,0,0
Band=0,90,20,0
Stretch=0,90,1
; detail: grain, dust, haze and stars (sky/README.md, "Detail")
Grain=0.6,4,0.5
Haze=0.5,1.6
; the grade, fitted to the stock faces by sky/grade.py (sky/README.md, "The grade")
GradeGain=0.683,1.018,1.051
GradeCurve=1.000,1.000,1.000
