; Repair.asi -- the welding on a ship under repair drawn by shaders (repair/repair.c,
; repair/README.md)
[Repair]
; 1: the repair sparks are drawn by the plugin; 0: the stock sparks.
Enable=1
; 1: re-read this file within half a second of an edit.
Reload=1
; 1: log every weld (its ship, size, life); 0: only the first eight.
LogWelds=0
Log=1

; Overall brightness of the welding.
Brightness=1.5

; The arc: it burns for the first ArcTime of the stock spark's life (0..1; stock's is a
; second), flickering FlickerRate times a second, and stutters out for a beat about
; Stutter of the time (0..0.95).
ArcTime=0.7
FlickerRate=24
Stutter=0.2
; Its flare: its size (1: the stock spark's), never under FlareMinPixels across, its
; colour (0..255; the core is white), how sharp the core and the glow are, how bright
; and how thin the rays.
Flare=2.2
FlareMinPixels=26
ArcColour=120,165,255
FlareCore=60
FlareGlow=3.5
FlareRays=1.4
FlareRaySharpness=30

; The sparks: how many a weld throws off while its arc burns (0..48), how fast (in the
; ship's bounding radii a second), how far from the hull's outward direction they
; scatter (0: straight out), how long each lives (min, max seconds), how much they slow
; (0..1.9), how thick (bounding radii, never under SparkMinPixels), the length of the
; streak (seconds of flight it covers) and their brightness. They cool from white to red.
Sparks=20
SparkSpeed=0.9
SparkSpread=0.9
SparkLife=0.25,0.8
SparkDrag=0.8
SparkWidth=0.004
SparkMinPixels=1.6
StreakTime=0.035
SparkBrightness=2.5

; The hot spot the arc leaves on the hull: brightness (0: none), size (of the stock
; spark), colour, and how long it takes to cool once the arc is out (s).
HotSpot=1.0
HotSize=0.5
HotColour=255,120,30
HotTime=0.35

; The light the arc casts on the hull about it (0: none): its colour (0..255) times this,
; LightLift bounding radii off the hull, full to LightReach radii. Reaches GPU-drawn
; hulls through Lighting.asi.
Light=2.5
LightColour=150,185,255
LightReach=0.5
LightLift=0.06

; How far the flare and the hot spot are drawn towards the camera (of their size): a
; ship's hardpoints sit a little inside its hull, which hid them at less.
Pull=2.0
