; Nebulae.asi -- nebulae as volumes of gas (nebulae/nebulae.c)
[Nebulae]
; 1: a nebula class with a recipe in Nebulae\<odf>.ini is drawn as gas; 0: stock everywhere.
Enable=1
; 1: re-read this file and the recipes within half a second of an edit.
Reload=1
; Slices through the deepest field on screen, and their closest spacing (world units).
Slices=40
MinStep=6
; 1: bake each class's gas into a volume texture when its nebulae change, and draw
; the slices from it; 0: compute the gas at every slice pixel (the reference; costly).
Bake=1
; 2: draw the gas at half size and add it to the frame (a quarter of the cost; needs
; the INTZ depth texture, which DXVK has); 1: at full size. Falls back to 1 by itself.
Resolution=2
; Reads of the baked gas per slice pixel: 2 halves the grain the slicing leaves, for
; about an eighth more GPU time; 1 is grainier and cheaper.
Samples=2
; Half size only. 1: at depth edges (hull silhouettes in or before the gas) the gas is
; drawn again at full size, so the edges are exact and not in two-pixel steps; costs by
; the edge pixels. 0: half size everywhere. 2: full size everywhere (a reference; slow).
EdgeRefine=1
; How much of what is behind the gas (stars, the sky, ships deeper in) the gas hides,
; where a recipe gives it an Opacity=: 0 nothing, 1 as much as it absorbs. Half size only.
Obscure=0.5
; The gas lit by the Key (Lighting.asi's; without it, the gas is its own light only).
; KeyShare: the Key's share of the gas's light seen side on to the Key, the rest its own
; glow (0..1; 0 as before). Scatter: how much brighter the Key's share is looking towards
; the Key and dimmer with the Key behind you (0: alike every way; at 0.2, x1.9 and x0.6).
; A recipe's KeyShare= and Scatter= override both.
KeyShare=0.8
Scatter=0.2
; Ships' shadows in the gas: they take the Key's share. Shadows: 1 on, 0 off.
; ShadowSoftness: how much a shadow's edge widens per unit of gas behind the ship
; (0: sharp all the way).
Shadows=1
ShadowSoftness=0.02
; The baked volume's most texels across (VolumeSize) and up (VolumeHeight), and its
; finest texel in world units (VolumeTexel).
VolumeSize=256
VolumeHeight=160
VolumeTexel=3
; The tiling noise volume's edge in texels: 32, 64 or 128.
NoiseSize=128
; 1: log the frame time and the gas's GPU time every 600 frames.
Timing=0
Log=1
