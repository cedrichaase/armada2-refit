; Nebulae.asi -- nebulae as volumes of gas (nebulae/nebulae.c)
[Nebulae]
; 1: a nebula class with a recipe in Nebulae\<odf>.ini is drawn as gas; 0: stock everywhere.
Enable=1
; 1: re-read this file and the recipes within half a second of an edit.
Reload=1
; Slices through the deepest field on screen, and their closest spacing (world units).
Slices=48
MinStep=6
; The tiling noise volume's edge in texels: 32, 64 or 128.
NoiseSize=128
; 1: log the frame time and the gas's GPU time every 600 frames.
Timing=0
Log=1
