; Explosions.asi -- fireballs as volumes of gas, shockwaves as rings (explosions/explosions.c)
[Explosions]
; 1: every ship's and station's fireball drawn as gas; 0: stock everywhere.
Enable=1
; 1: shockwaves drawn as rings of light in place of stock's textured disc.
Rings=1
; 1: re-read this file within half a second of an edit.
Reload=1
; The fireball's light.
Brightness=1.0
; Its full radius, times the dead craft's bounding radius.
Size=1.0
; ... and never smaller than this, in world units (a destroyer is about 20 across its bounding radius).
MinRadius=25
; The part of its life over which it reaches full size (it keeps swelling a little after).
Growth=0.4
; How fast it cools from white to dark, times its life: higher is sooner smoke.
Cooling=1.0
; How much dark smoke it leaves as it cools (0: none).
Smoke=1.0
; How much the noise breaks up its outline and billows.
Turbulence=1.0
; How much the hot gas hides what is behind it.
Opacity=0.3
; The white flash at the start, and the halo of the fireball's light about it.
Flash=1.0
Glow=0.25
; Billows across the fireball: higher is finer.
Detail=1.6
; The shock ring: its light, its width (of its radius), how much the noise breaks it up.
RingBrightness=1.0
RingWidth=0.03
RingBreakup=1.0
; The tiling noise volume's edge in texels: 32, 64 or 128.
NoiseSize=64
; Bench: every fireball drawn at this fraction of its life (-1: off).
Age=-1
; 1: log the frame time and the explosions' GPU time every 600 frames.
Timing=0
Log=1
