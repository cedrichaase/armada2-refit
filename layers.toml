# The layer registry: every layer of this project, once. tools/layers.py is its only
# reader; ./install, a2mod and the test bench (--layers, `Layers:`) take the layer list
# from it, and `tools/layers.py --check` (CI) fails when the release scripts' ::step ids,
# publish/package.sh's steps or the GUI installer's STATUS keys disagree with it.
#
# One [[layer]] per layer, in install order (./install runs them top to bottom):
#
#   id, name, dir   the id the tools use, a name for people, the folder it lives in
#   install         the command ./install runs (a string, or a list run in order), from
#                   the repository root; remove takes the layer out again
#   files           what a2mod files under this layer: files ./install ADDS to the game
#                   directory (relative to it; globs allowed, the name matched without
#                   regard to case)
#   replaces        stock files the layer changes in place, beside a .a2neb-backup: a2mod
#                   finds them by the backup and files each under the layer whose pattern
#                   is most specific (Textures/RGB/Curs_* before Textures/RGB/*)
#   backups         backup suffixes of the layer's own: every file with one is its
#   select          core     always installed, not offered (platform, display)
#                   on       offered, on by default
#                   off      offered, off by default
#                   retired  never installed; only recognised (a2mod files a stale copy
#                            under it, and retire/retire.sh and the installers take it
#                            out). dir = 'retire' for the layers whose folder is gone
#   requires        ids this layer needs; ./install --only adds them, --without refuses
#                   to take one out from under a layer that needs it
#   scope           local    stays on this player's machine
#                   match    every player of a network game must run it
#   games           the games it is for (PLAN-ARMADA1.md, PLAN-FLEETOPS.md)
#   steps           the release scripts' ::step ids it installs under (publish/installer)
#   summary         one sentence, for the installers
#
# A selectable layer (on or off) that a run of ./install does not select is taken out
# with its remove. ./install keeps no memory of the selection.

schema = 1

[release]
# The ::step ids publish/installer/install.sh and install.ps1 print, in order, and
# publish/package.sh's manifest `steps`. `own` are the steps of no layer; `extra` the
# ones printed outside that order (--uninstall).
steps = ['verify', 'prereqs', 'display', 'retire', 'render3d', 'ui', 'qol', 'rules', 'models',
         'online', 'cutscenes', 'bloom', 'done']
own = ['verify', 'retire', 'done']
extra = ['uninstall']

# ---------------------------------------------------------------- core

[[layer]]
id = 'platform'
name = 'Platform'
dir = 'platform'
install = 'python3 platform/d3d8-chain.py --retire'
remove = 'python3 platform/d3d8-chain.py --revert'
files = []
select = 'core'
requires = []
scope = 'local'
games = ['armada2']
steps = ['prereqs']
summary = "the widescreen patch and the ASI loader, and taking the retired Direct3D chain (d3d8to9, DXVK) out of the game; a2mod never switches it"

[[layer]]
id = 'display'
name = 'Display8'
dir = 'display'
install = 'display/install'
remove = 'display/install --remove'
files = ['d3d8.dll', 'Display8.ini']   # d3d8.dll only where it is Display8's (a2mod checks by content)
backups = ['.a2display-backup']
select = 'core'
requires = ['platform']
scope = 'local'
games = ['armada2', 'fo-roots']
steps = ['display']
summary = "the game's Direct3D 8, ours: Vulkan or Direct3D 12 for the plugins, the system's own d3d8.dll when neither starts"

# The ASI loader of the games that ship none (Fleet Operations: Roots; Armada II's is the
# platform layer's, which a2mod never switches, so this layer is not Armada II's and a2mod
# files no winmm.dll there). It goes with Display8 and requires it: beside DxWrapper the
# loader kills Roots at start (asiloader/README.md).
[[layer]]
id = 'asiloader'
name = 'ASI loader'
dir = 'asiloader'
install = 'asiloader/install'
remove = 'asiloader/install --remove'
files = ['winmm.dll']   # only where it is the loader's (a2mod checks by content)
backups = ['.a2asi-backup']
select = 'core'
requires = ['display']
scope = 'local'
games = ['fo-roots']
steps = []
summary = "the Ultimate ASI Loader as winmm.dll, for the games that ship none, so that their .asi plugins load; not part of any release"

# ---------------------------------------------------------------- selectable

[[layer]]
id = 'qol'
name = 'Quality of life'
dir = 'qol'
install = 'qol/install.sh'
remove = 'qol/install.sh --remove'
files = ['QOL.asi', 'QOL.ini']
select = 'on'
requires = []
scope = 'local'
games = ['armada2', 'fo-roots']
steps = ['qol']
summary = 'right-drag pan speed, bigger selections and control groups; plays against stock players'

[[layer]]
id = 'rules'
name = 'Rules'
dir = 'rules'
install = 'rules/install.sh'
remove = 'rules/install.sh --remove'
files = ['QOLRules.asi', 'QOLRules.ini']
select = 'on'
requires = []
scope = 'match'
games = ['armada2']
steps = ['rules']
summary = 'pay for an item when it is queued; every player of a network game needs it, and a game with anyone lacking it plays stock rules'

[[layer]]
id = 'online'
name = 'Online'
dir = 'online'
install = 'online/install.sh'
remove = 'online/install.sh --remove'
files = ['Online.asi', 'Online.ini']
select = 'on'
requires = []
scope = 'match'
games = ['armada2']
steps = ['online']
summary = 'online multiplayer that works under Wine/Proton: the Internet - Online entry, join codes, no port forwarding'

[[layer]]
id = 'textures'
name = 'Textures'
dir = 'textures'
install = './a2tex install'
remove = './a2tex revert all'
files = []
replaces = ['Textures/RGB/*']
select = 'on'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'remastered textures built from your own game files with ./a2tex; a release cannot carry them'

[[layer]]
id = 'models'
name = 'Models'
dir = 'models'
install = 'models/install.sh'
remove = 'models/install.sh --remove'
files = []
replaces = ['SOD/*']
select = 'on'
requires = []
scope = 'local'
games = ['armada2']
steps = ['models']
summary = 'moons, asteroids, selection bubble and hulls smoothed from your own files'

[[layer]]
id = 'cutscenes'
name = 'Cutscene player'
dir = 'cutscenes'
install = 'cutscenes/binkproxy/install.sh'
remove = 'cutscenes/binkproxy/install.sh --remove'
# Movies count only beside a <Name>.bik of the same name (a2mod).
files = ['binkw32_orig.dll', 'BinkProxy.ini', 'animations/*.mp4', 'animations/*.wav']
replaces = ['binkw32.dll']
select = 'on'
requires = []
scope = 'local'
games = ['armada2']
steps = ['cutscenes']
summary = 'launch reels full screen and AV1 movie replacements; the stock binkw32.dll is kept'

[[layer]]
id = 'render3d'
name = '3D view'
dir = 'render3d'
install = 'render3d/install.sh'
remove = 'render3d/install.sh --remove'
files = ['Render3D.asi', 'Render3D.ini', 'Surfaces/*.ini', 'Nebulae/*.ini']
select = 'on'
requires = ['display']
scope = 'local'
games = ['armada2', 'fo-roots']
steps = ['render3d']
summary = 'the 3D view through a renderer of our own: HDR, anti-aliasing, bloom, lit hulls with shadows, skies, effects, planets and nebulae'

# The menu backdrop plates are built by ui/backdrops/backdrop.sh, go in with the UI, which
# draws them behind the main menu, and are filed under it (a2mod).
[[layer]]
id = 'ui'
name = 'HUD and menus'
dir = 'ui'
install = ['ui/backdrops/install-plates.sh', 'ui/install.sh']
remove = ['ui/install.sh --remove', 'ui/backdrops/install-plates.sh --remove']
files = ['UI.asi', 'UI.ini', 'Menus/*.bmp']
select = 'on'
requires = ['display']
scope = 'local'
games = ['armada2', 'fo-roots']
steps = ['ui']
summary = 'the HUD, the menus, the loading screen and the cursor redrawn at any aspect ratio'

# ---------------------------------------------------------------- retired: recognised only

# HUD.asi, GridLayout.asi and Menus.asi, which UI.asi's parts replaced; their folders are
# gone (hud 3.0.0, grid 2.0.0, menus 5.0.0; their changelogs are in retire/history/).
# retire/retire.sh takes them out, and puts the file-based HUD fixes of hud 2.x back from
# their backups (hud-files.py); a2mod still files them, so an old snapshot restores.
[[layer]]
id = 'hud'
name = 'HUD (retired)'
dir = 'retire'
files = ['HUD.asi', 'HUD.ini']
# Before hud 2.0.0 the file-based fixes (ui-widescreen, ui-font-condense, cursor-aspect).
replaces = ['misc/*', 'Textures/RGB/Curs_*']
backups = ['.a2font-backup']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'the in-game HUD plugin and the file-based HUD fixes, before UI.asi'

[[layer]]
id = 'menus'
name = 'Menus (retired)'
dir = 'retire'
files = ['Menus.asi', 'Menus.ini']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'the shell menus plugin, before UI.asi hosted them'

[[layer]]
id = 'grid'
name = 'Grid keys (retired)'
dir = 'retire'
files = ['GridLayout.asi', 'GridLayout.ini']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'the button bar as a 5x3 grid of position keys, before UI.asi'

# The per-part plugins render3d replaced (render3d 0.2.0; Planets in models 5.0.0), and
# Sky.asi's recipes. retire/retire.sh and the release scripts take them out.
[[layer]]
id = 'parts'
name = 'Per-part plugins (retired)'
dir = 'retire'
files = ['MSAA.asi', 'MSAA.ini', 'Lighting.asi', 'Lighting.ini', 'Sky.asi', 'Sky.ini',
         'Nebulae.asi', 'Nebulae.ini', 'Surfaces.asi', 'Surfaces.ini',
         'Explosions.asi', 'Explosions.ini', 'Shields.asi', 'Shields.ini',
         'Repair.asi', 'Repair.ini', 'Venting.asi', 'Venting.ini',
         'Specials.asi', 'Specials.ini', 'Fog.asi', 'Fog.ini', 'Planets.asi', 'Planets.ini',
         'Sky/*.ini']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'the plugins that drew parts of the 3D view one at a time, before Render3D.asi'

# Menus.asi before menus 2.0.0. retire/retire.sh and the release scripts take it out.
[[layer]]
id = 'menuscale'
name = 'MenuScale (retired)'
dir = 'retire'
files = ['MenuScale.asi', 'MenuScale.ini', 'MenuScale/*.bmp']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'the menus plugin before it was Menus.asi'

# The vkBasalt bloom before 13.0.0, outside the game directory: retire/retire.sh and the
# release scripts (step bloom) take it out.
[[layer]]
id = 'vkbasalt'
name = 'vkBasalt bloom (retired)'
dir = 'retire'
files = []
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = ['bloom']
summary = 'the per-user vkBasalt bloom, replaced by Render3D.asi'

# dxvk.conf, DXVK's settings, and the d3d8_real.dll that Display8 stood in front of: nothing
# reads them since display 1.0.0 (the samplers are Display8.ini [Samplers]). renderer's
# folder is gone (renderer 3.0.0; its changelog is in retire/history/); retire/retire.sh
# --chain and the release scripts take both out, and a2mod still files a stale copy.
[[layer]]
id = 'renderer'
name = 'Renderer (retired)'
dir = 'retire'
files = ['dxvk.conf', 'd3d8_real.dll']
select = 'retired'
requires = []
scope = 'local'
games = ['armada2']
steps = []
summary = 'dxvk.conf, the filtering settings DXVK read, before Display8.ini [Samplers]'
