; The UI's table in the fleetops set (ui/README.md, "Content sets"): Fleet Operations:
; Roots' names for what the stock set (../stock/ui.ini) names for the game of GOG 1.1.
; Names only, never addresses, and no Roots art: the UI draws its own looks, and a race it
; has no look for (Theme empty or unknown) gets the shell's (PLAN-FLEETOPS.md, FO-6,
; decision 70).

; One section per race, in the order of the set (the Race index of the themes). Aliases
; are the names [UI] Theme= and the game spell it, lower case, the full name first: Roots'
; race ODFs name their races unitedfederation, klingonempire, romulanempire, cardassian,
; species8472, freeborg and dominion (federation is the observer's).
; Each race wears its Roots look (ui/STYLE.md, "Starfleet" and "The other factions on
; Roots"): metal and glass in that race's colours, as Roots' own HUD is, drawn in code;
; Armada II's set keeps its looks (LCARS, blade, wing, arch, cube, organic).
[Race.Federation]
Name = Federation
Theme = starfleet
Aliases = unitedfederation, federation, fed, observer

[Race.Klingon]
Name = Klingon
Theme = redline
Aliases = klingonempire, klingon, kli, kling

[Race.Romulan]
Name = Romulan
Theme = jade
Aliases = romulanempire, romulan, rom

[Race.Cardassian]
Name = Cardassian
Theme = bronze
Aliases = cardassian, card, car

[Race.Borg]
Name = Borg
Theme = circuit
Aliases = borg, bor

[Race.Species8472]
Name = Species 8472
Theme = bone
Aliases = species8472, species 8472, 8472, species

; The Free Borg: the Borg's frame in Roots' teal.
[Race.FreeBorg]
Name = Free Borg
Theme = circuit-teal
Aliases = freeborg, free borg

[Race.Dominion]
Name = Dominion
Theme = violet
Aliases = dominion, dom

; eResource, as g_eResourceToString names them, in order, with the words Roots' own string
; table gives them (the long tooltips, GUI_RD_*_VTOOLTIP: Tritanium for the metal, Supply
; for the biomatter, Connection Nodes for the Borg's latinum; the Species 8472 read
; "Biomatter", the table's alternative). Only a fallback: the panel reads the word from the
; component's own tooltip when Roots' table answers one, so a race or a build that names a
; resource otherwise is followed. Roots shows one to three of them, by race.
; Placement = corner: the strip sits flush in the top left corner of the screen (decision 520),
; not at the top centre, where Roots draws its own HUD (decision 153). `component` would put it
; over the game's own resource panel's rectangle, a little way in from the corner.
[Resources]
Names = Crew, Officers, Dilithium, Connection Nodes, Tritanium, Supply
Placement = corner

; Each resource's picture is the glyph Roots' own font draws for it (the codes [Glyphs] names
; below), cut from the font's texture in the player's install at run time (Files IconFont): the
; name as Roots' string table gives it (the Species 8472's Biomatter has no picture in this
; font, so it keeps the coloured bar) = the code in hex. Officers have none: the clock is the
; build time.
[ResourceIcons]
Dilithium = 85
Tritanium = 86
Supply = 87
Crew = 89
Connection Nodes = 99

; The codes Roots' fonts draw as a picture or as a figure of their own (the resource icons,
; the unit classes and the red figures of its tooltips: Roots' own tables in Sprites\Font*.spr
; name the pictures), each as a code in hex = the word or the figure the UI writes in its
; place (text::game; PLAN-FLEETOPS.md, FO-6, decision 160). A word is set apart by a space
; from a figure beside it. Any other code is Windows-1252, as on stock. The resources are
; named as Roots' own string table names them (GUI_RD_*_VTOOLTIP: Tritanium, Supply,
; Biomatter, Connections Nodes; FontMedium.spr calls 0x99 a "metal icon"). Words only:
; no picture of Roots' is copied or drawn.
[Glyphs]
; The cost lines set their icons apart with "$" ("250$<dilithium>$/$125$<tritanium>$"), a
; spacer in the fonts the larger screens use (FontFinal4_13 and _10 draw it as "$", and
; 0x80 as "€": Roots' own tooltips show both at 1280x960).
24 = " "
; The red figures.
7F = 0
81 = 1
8D = 2
8F = 3
90 = 4
9D = 5
A0 = 6
AD = 7
BE = 8
D7 = 9
BB = +
BC = -
BD = .
; The resource icons.
; 0x80 is a clock in the fonts the larger screens use (FontMedium: "officer/clock icon"),
; after a build cost's crew: its build time in seconds.
80 = s
85 = Dilithium
86 = Tritanium
87 = Supply
89 = Crew
8C = Biomatter
99 = Connection Nodes
; The unit classes.
A1 = Support Vessel
A2 = Cruiser
A3 = Battleship
A4 = Scout
A5 = Dreadnought
A8 = Berserker
A9 = Artillery
AA = Construction Ship
AE = Mining Ship
D8 = Destroyer
F8 = Station

; Roots' four campaigns, as its Single Player screen (adopted, with its spec of ours:
; ui/src/menus/roots_dialogs/single_player.rs; PLAN-FLEETOPS.md, decisions 250 onwards)
; orders its cards: the names are only a fallback, the screen's own hover labels are what
; shows, matched by Key (a word of the label). Scene: the fleetops map's view behind each
; (render3d/content/sets/fleetops/menu/map.ini). Emblem: the faction's logo, a TGA of Roots'
; own Textures folder read at run time and never copied; `[Menus] Emblem<Id>=` in UI.ini names
; another, `none` keeps the cut of the card's own art, which also stands when the file is
; missing (decision 530). No Map or Requires: the loading
; screen's line stays "Mission" and nothing is shown locked (Roots' progress is not read).
[Campaign.Allied]
Name = Allied Campaign
Key = allied
Scene = federation
Emblem = textures\federation_logo.tga

[Campaign.Dominion]
Name = Dominion Campaign
Key = dominion
Scene = dominion
Emblem = textures\dominion_logo.tga

[Campaign.Species8472]
Name = Species 8472 vs Borg War
Key = 8472
Scene = species8472
Emblem = textures\logospecies8472.tga

[Campaign.FreeBorg]
Name = Free Borg Campaign
Key = free borg
Scene = freeborg
Emblem = textures\free_borg_logo.tga

; No credits tour of the UI's: Roots' credits stay its own (decisions 68 and 70), and the
; files the stock set names are not read there. The menu scene is render3d's own map
; (render3d/content/sets/fleetops/menu/map.ini), not Roots' art: behind Roots' forms drawn
; as ours ([Menus] Forms=1) every screen stands over its main view (decision 201), and
; the campaign selection over the view of the campaign pointed at, the Allied first.
[Scenes]
Main = main
FirstCampaign = federation

; The widget gallery's sample lists (the shell demo, [Demo]; gallery.rs).
[Gallery]
Factions = Federation, Klingon, Romulan, Borg, Cardassian, Species 8472, Free Borg, Dominion

[Files]
; The main menu's title lettering: a PNG in Roots' Data folder, read at run time and never
; copied (ui/MENUS.md, "Roots' main menu title"). [Menus] TitleImage= in UI.ini overrides it.
MenuTitle = bitmaps\main\transparant.png
; The HUD sprites every race shares, looked in after the race's gui_<race>.spr when a sprite the
; engine has not drawn takes its art from its .spr line (FO-6, decision 343).
GuiSprites = gui_global.spr
; The bitmap font whose pictures are the resources' icons ([ResourceIcons]): FontFinal4_16, whose
; texture (1024x256, 1:1 with its reference size) holds the largest of them.
IconFont = FontFinal4_16.spr

; The main menu column (ui/MENUS.md, "The main menu's layout file"; decisions 410 to 419):
; the defaults for Roots, which a Menu\mainmenu.ini in Roots' Data folder overrides key by
; key. The picture is Files.MenuTitle's. TitleGap is the space, in units, from the bottom
; of the lettering to the first entry: 80 is about one and a half entries (54 each), where
; the column used to start 1 unit under ROOTS.
[MainMenu]
TitleGap = 80

; The info panel on Roots (ui/HUD.md, "The info panel on Fleet Operations: Roots"; PLAN-FLEETOPS.md,
; FO-6, decisions 440 to 459): FleetOpsHook's ShipDisplay drawn by the UI in Roots' own layout. Every
; place is Roots' (its misc\gui_interface.cfg keys, read for their numbers and checked against the
; panel's own children on the bench: UI.log "info: Roots' panel"), in the units of Roots' layout
; files, local to the panel's top left; the panel is Size wide and high there (infoPanelArea_1).
; Fonts, bars and the frame are the UI's; the pictures (the ship image <class>_si, the icons, the
; queue's plates and pictures) are Roots' own sprites, drawn from the player's install at run time.
;
; An element is: anchor, x, y, w, h. The anchor says where it goes when the panel is wider or
; narrower than Size (HUD.InfoWidth, or the bottom row giving it less room): left stays at its x,
; right moves with the right edge, centre half as far, flex stays at its x and takes the change in
; its width. When the right-anchored elements would run into the left ones, they are scaled down
; together about the right edge; MinWidth is the narrowest panel drawn.
[InfoPanel]
Size = 1249, 163
MinWidth = 640
