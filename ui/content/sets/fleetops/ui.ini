; The UI's table in the fleetops set (ui/README.md, "Content sets"): Fleet Operations:
; Roots' names for what the stock set (../stock/ui.ini) names for the game of GOG 1.1.
; Names only, never addresses, and no Roots art: the UI draws its own looks, and a race it
; has no look for (Theme empty or unknown) gets the shell's (PLAN-FLEETOPS.md, FO-6,
; decision 70). The Dominion is the Roots developer's to give a look.

; One section per race, in the order of the set (the Race index of the themes). Aliases
; are the names [UI] Theme= and the game spell it, lower case, the full name first: Roots'
; race ODFs name their races unitedfederation, klingonempire, romulanempire, cardassian,
; species8472, freeborg and dominion (federation is the observer's).
[Race.Federation]
Name = Federation
Theme = lcars
Aliases = unitedfederation, federation, fed, observer

[Race.Klingon]
Name = Klingon
Theme = blade
Aliases = klingonempire, klingon, kli, kling

[Race.Romulan]
Name = Romulan
Theme = wing
Aliases = romulanempire, romulan, rom

[Race.Cardassian]
Name = Cardassian
Theme = arch
Aliases = cardassian, card, car

[Race.Borg]
Name = Borg
Theme = cube
Aliases = borg, bor

[Race.Species8472]
Name = Species 8472
Theme = organic
Aliases = species8472, species 8472, 8472, species

; The Free Borg wear the Borg's look.
[Race.FreeBorg]
Name = Free Borg
Theme = cube
Aliases = freeborg, free borg

; No look of its own: the shell's.
[Race.Dominion]
Name = Dominion
Theme =
Aliases = dominion, dom

; eResource, as g_eResourceToString names them, in order, with the words Roots' own string
; table gives them (the long tooltips, GUI_RD_*_VTOOLTIP: Tritanium for the metal, Supply
; for the biomatter, Connection Nodes for the Borg's latinum; the Species 8472 read
; "Biomatter", the table's alternative). Only a fallback: the panel reads the word from the
; component's own tooltip when Roots' table answers one, so a race or a build that names a
; resource otherwise is followed. Roots shows one to three of them, by race.
; Placement = component: the strip sits over the game's own resource panel's rectangle
; (top left on Roots), not at the top centre, where Roots draws its own HUD (decision 153).
[Resources]
Names = Crew, Officers, Dilithium, Connection Nodes, Tritanium, Supply
Placement = component

; Roots has no campaign cards, credits tour or scenes of the UI's: the single player
; screen, the credits and the menu scene stay Roots' own (decisions 68 and 70), and the
; files the stock set names are not read there.

; The widget gallery's sample lists (the shell demo, [Demo]; gallery.rs).
[Gallery]
Factions = Federation, Klingon, Romulan, Borg, Cardassian, Species 8472, Free Borg, Dominion
