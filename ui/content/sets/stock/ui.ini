; The UI's table in the stock set (ui/README.md, "Content sets"): the names of the
; game's races, resources, campaigns and files the screens and panels show or match.
; Names only, never addresses. A set without this file gives the UI no names: the
; screens that need them stand down to the engine's own.

; One section per race, in the game's order. Name is shown; Theme is the theme's look
; for it (lcars, blade, wing, arch, cube, organic: ui/STYLE.md, "Forms"); Aliases are
; the names [UI] Theme= and the game spell it, lower case, the full name first.
[Race.Federation]
Name = Federation
Theme = lcars
Aliases = federation, fed

[Race.Klingon]
Name = Klingon
Theme = blade
Aliases = klingon, kli, kling

[Race.Romulan]
Name = Romulan
Theme = wing
Aliases = romulan, rom

[Race.Cardassian]
Name = Cardassian
Theme = arch
Aliases = cardassian, card, car

[Race.Borg]
Name = Borg
Theme = cube
Aliases = borg, bor

[Race.Species8472]
Name = Species 8472
Theme = organic
Aliases = species8472, species 8472, 8472, species

; eResource, as g_eResourceToString names them, in order.
[Resources]
Names = Crew, Officers, Dilithium, Latinum, Metal, Biomatter

; The single player screen's campaign cards, in card order. Name is the card's when the
; stock labels give none; Key a word the stock label of the campaign contains (lower
; case); Scene the view of render3d's map behind the card; Emblem the race icon's cell
; in RaceIcons (x, y in 84 px cells of 256; empty for none). Map is the prefix of the
; campaign's map names and Kicker the loading screen's line for them, with the
; mission's number after it when Numbered = 1.
[Campaign.Tutorials]
Name = Tutorials
Key = tutorial
Scene = tutorials
Emblem =
Map = a2_tutorial
Kicker = Tutorial
Numbered = 0

[Campaign.Federation]
Name = Federation Campaign
Key = federation
Scene = federation
Emblem = 0, 0
Map = a2_fed
Kicker = Federation campaign
Numbered = 1

[Campaign.Klingon]
Name = Klingon Campaign
Key = klingon
Scene = klingon
Emblem = 84, 0
Map = a2_kling
Kicker = Klingon campaign
Numbered = 1

[Campaign.Borg]
Name = Borg Campaign
Key = borg
Scene = borg
Emblem = 84, 84
Map = a2_borg
Kicker = Borg campaign
Numbered = 1

; The views of render3d's map: behind the main menu, the single player screen's first,
; and the credits' tour.
[Scenes]
Main = main
FirstCampaign = federation
Tour = main, federation, klingon, tutorials, borg

; The game's files the UI reads, by their path in its file system (files.rs): a
; texture as textures\<file>, wherever the game keeps it; the rest under the game directory.
[Files]
; The race icons of the campaign cards.
RaceIcons = textures\allrace.tga
; The credits' text and logos.
Credits = Credits.txt
CreditsLogos = textures\logos.tga
; The cursor sprites (their textures are named inside).
CursorSprites = Sprites/cursor.spr

; The widget gallery's sample lists (the shell demo, [Demo]; gallery.rs).
[Gallery]
Ships = Galaxy, Sovereign, Defiant, Akira, Steamrunner, Intrepid, Nova, Saber, Norway, Prometheus, Excelsior, Constitution, D'Deridex, Valdore, Scimitar, Hawk, Falcon, Venture, Negh'Var, Vor'cha, Bird of Prey, Raptor, Cube, Sphere, Diamond, Scout, Assimilator, Queen, Probe, Tactical
Factions = Federation, Klingon, Romulan, Borg, Cardassian, Species 8472
