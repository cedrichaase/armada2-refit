plugin = "UI"
file = "UI.ini"
shipped = "ui/UI.ini"

[[row]]
name = "hud_enable"
section = "HUD"
key = "Enable"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Refit HUD"
help = "The whole in-mission HUD drawn by the UI. Off gives every panel back to the game."

[[row]]
name = "hud_minimap"
section = "HUD"
key = "Minimap"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Minimap"
help = "The minimap drawn sharp by the UI. Off gives the game's minimap back."

[[row]]
name = "hud_info"
section = "HUD"
key = "Info"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Info panel"
help = "The panel that says what the selection is. Off gives the game's back."

[[row]]
name = "hud_selection"
section = "HUD"
key = "Selection"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Selection overlay"
help = "Brackets, gauges and group numbers over the units. Off gives the game's overlay back."

[[row]]
name = "hud_unitview"
section = "HUD"
key = "UnitView"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Unit view"
help = "The unit view placed beside the info panel. Off gives the game's place back."

[[row]]
name = "hud_tooltips"
section = "HUD"
key = "Tooltips"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Tooltips"
help = "The tooltips at the pointer drawn by the UI. Off gives the game's back."

[[row]]
name = "hud_bar"
section = "HUD"
key = "Bar"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Command bar"
help = "The button bar as a grid with a key per cell. Off gives the game's bar back."

[[row]]
name = "hud_barlabels"
section = "HUD"
key = "BarLabels"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Key labels"
help = "The key shown in each button's corner."

[[row]]
name = "hud_icons"
section = "HUD"
key = "Icons"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Flat icons"
help = "The UI's own icons on the buttons. Off shows the game's button art."

[[row]]
name = "hud_selectiongauges"
section = "HUD"
key = "SelectionGauges"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Gauges"
help = "Selected units always show their gauges. Off shows them only under the pointer."

[[row]]
name = "hud_infocamera"
section = "HUD"
key = "InfoCamera"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Info camera"
help = "A single selected unit shown live, close up, in the info panel (needs Render3D)."

[[row]]
name = "ui_cursor"
section = "UI"
key = "Cursor"
kind = "bool"
default = "1"
apply = "live"
scope = "local"
tab = "interface"
label = "Cursor"
help = "The mouse cursor drawn sharp by the UI. Off gives the game's cursor back."

[[row]]
name = "ui_theme"
section = "UI"
key = "Theme"
kind = "enum"
default = "auto"
apply = "live"
scope = "local"
tab = "interface"
label = "Theme"
help = "auto takes your race in a mission and the shell's look in the menus; or one look everywhere. Starfleet is the Federation's look on Fleet Operations: Roots."
values = ["auto", "shell", "federation", "klingon", "romulan", "cardassian", "borg", "species8472", "starfleet"]
labels = ["Auto", "Shell", "Federation", "Klingon", "Romulan", "Cardassian", "Borg", "Species 8472", "Starfleet"]

[[row]]
name = "menus_enable"
section = "Menus"
key = "Enable"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Redrawn menus"
help = "The shell's menus hosted and drawn by the UI, and this screen with them. Off gives the game's menus back."
flags = ["advanced"]

[[row]]
name = "menus_scene"
section = "Menus"
key = "Scene"
kind = "bool"
default = "1"
apply = "mission"
scope = "local"
tab = "interface"
label = "Menu backdrop"
help = "The main menu stands over a 3D scene (needs Render3D). Off shows the game's art."

[[row]]
name = "menus_credits"
section = "Menus"
key = "Credits"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Credits"
help = "The Credits drawn by the UI over the 3D scene. Off gives the game's Credits back."

[[row]]
name = "menus_forms"
section = "Menus"
key = "Forms"
kind = "bool"
default = "0"
apply = "restart"
scope = "local"
tab = "interface"
flags = ["advanced"]
label = "Redrawn front-end forms"
help = "The front end's own forms (main menu, Options and more) drawn by the UI. Off gives the game's forms back."

[[row]]
name = "loading_enable"
section = "Loading"
key = "Enable"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "interface"
label = "Loading screen"
help = "The loading screen drawn by the UI. Off gives the game's logo and bar back."

[[row]]
name = "hud_barhidden"
section = "HUD"
key = "BarHidden"
kind = "bool"
default = "0"
