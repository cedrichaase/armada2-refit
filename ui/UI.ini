; UI.asi -- the UI runtime (ui/README.md). Nothing here changes what the game shows
; unless a [Demo] key is on: the runtime only draws for the parts that use it.
[UI]
; 0: the plugin stands down and patches nothing.
Enable=1
; UI.log in the game directory.
Log=1
; Size the UI is laid out at, as a multiple of a 1080-pixel-tall screen.
Scale=1.0

[Demo]
; The runtime's demonstration overlay, per drawing context: a panel, text and a
; button, to see the runtime working there.
Mission=0
Shell=0
Loading=0

[Menus]
; 1: the UI hosts the shell's menus: every stock dialog runs hidden and the UI draws
; and drives it (ui/MENUS.md). Stands down while Menus.asi is loaded.
Enable=0
; A screen without a layout of our own: mirror (as the game paints it) or widgets
; (its controls as the UI's widgets).
Generic=mirror
; 0: no screen spec (the main menu's), every screen generic.
Specs=1
; Esc in the in-mission menu is Return to Game.
EscapeReturns=1
; UI.log: each hosted dialog's messages, the actions sent to it, and its surfaces as
; UI-dlg<depth>-*.bmp every 5 s. Host=0 with it: the dialogs run stock, only traced.
Trace=0
Host=1
