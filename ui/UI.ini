; UI.asi -- the UI runtime (ui/README.md): the HUD, the menus, the loading screen and
; the cursor, drawn by the UI. Every part is on; a part's key at 0 gives that part
; back to the engine, as stock draws it (ui/README.md, "A part switched back to
; stock").
[UI]
; 0: the plugin stands down and patches nothing.
Enable=1
; Which defaults this file was last brought up to by ui/install.sh: 2 is the one
; where every part of the UI is on (ini-merge.py). Not read by UI.asi.
Defaults=2
; UI.log in the game directory.
Log=1
; Size the UI is laid out at, as a multiple of a 1080-pixel-tall screen.
Scale=1.0
; 1: draw the mouse cursor ourselves, sharp at the screen's resolution, from the
; game's own cursor art (the engine's shape in a mission, the arrow elsewhere); the
; engine's is hidden. 0: the engine's cursor (kept square at any aspect).
Cursor=1
; The look (ui/STYLE.md): auto takes the player's race in a mission and the shell's
; theme in the menus; or one theme everywhere: shell, federation, klingon, romulan,
; cardassian, borg, species8472.
Theme=auto
; The cursor's size in units (32: the art's own size at 1080 lines).
CursorSize=32
; 1: while the game's display mode is still a stock one (800x600 with no ARMADA.PRF,
; 1024x768 as GOG ships it), it runs at the desktop's instead, so the menus, the loading
; screen and the missions share one mode from the first launch. A mode chosen in
; Graphics Settings is kept. The intro's 640x480 becomes the desktop's too, as the
; cutscene proxy makes it (Display8's stub offers no other mode). 0: the game's mode as set.
Native=1
; 1: each frame of the launch reels and the intro is drawn by the UI, fitted to the
; screen between black bars: handed over by the cutscene proxy (binkw32.dll), or,
; without it, taken from the engine's own copy. 0: copied into the game's back
; buffer, as without the UI (scaled by the proxy, 640x480 without it).
Movies=1
; 1: UI.log says when the game's window gains or loses the foreground, the focus or
; activation (with the engine's mouse buttons and whether a pan holds the pointer),
; and every jump of the pointer between two frames that the engine's own pan did not
; make. For a cursor that jumps about after the game lost the focus. 0: nothing logged.
PointerLog=0
; In a mission under Wine (Proton), ask Wine for its full-screen pointer clip again,
; every half second at most while the pointer moves and the game is the foreground
; window, as Wine itself does when the keyboard comes back to the game. After a
; screenshot's overlay Wine does not always clip again, and an unclipped pointer can
; move onto a desktop bar at the top of the screen (Omarchy's, waybar): the game's
; cursor then stops and the desktop's shows. Nothing is clipped while another window
; has the keyboard. 0: Wine's clip as Wine leaves it. Without Wine, nothing is done.
KeepClip=1

[Demo]
; The runtime's demonstration overlay, per drawing context: a panel, text and a
; button, to see the runtime working there.
Mission=0
Shell=0
Loading=0
; The style gallery: every theme and every widget state, in the Credits' place in
; the front end and over a mission.
Style=0

[HUD]
; The in-mission HUD drawn by the UI, a panel at a time (HUD.md). Each panel key
; replaces that stock panel with ours; the stock panel keeps running underneath,
; and is neither drawn nor given the mouse. A panel at 0 is the stock one, on the
; stock 1600x1200 canvas (stretched on a wide screen). Enable=0: the whole HUD stock.
Enable=1
; The button bar as a 5x3 grid with a key per cell (QWERT / ASDFG / ZXCVB, by
; position). Stands down while GridLayout.asi is loaded.
Bar=1
; 1: the bar's keys are the grid's, and stock's bar keys (F-keys, command letters,
; menu toggles) do nothing. 0: stock's keys.
BarKeys=1
; The key in each button's corner.
BarLabels=1
; 1: the buttons (the bar, the top-right buttons) show our own flat icons, drawn
; sharp in the theme's colours; 0: the game's button art.
Icons=1
; The info panel: what the selection is (one unit, a builder and its queue, a
; group), at the bottom centre in the player's race's theme.
Info=1
; A single unit shown live in the info panel, close up from a camera of its own, in
; place of its wireframe. Needs Render3D.asi; without it the wireframe shows.
InfoCamera=1
; The info panel's size: 1 as it was, 1.3 a third bigger (for the close-up).
InfoScale=1.3
; The minimap, ours: the map, fog and shroud, blips, pings and the camera's outline,
; drawn sharp at the bottom left; left click/drag moves the camera, right click
; orders the selection there. MinimapSize: its side in units (1080-line pixels).
Minimap=1
MinimapSize=300
; The selection overlay, ours: brackets, gauges and group numbers over the units.
; SelectionGauges=1: the selected units always show their gauges; 0: as stock, only
; while the pointer is on one of them (or its team).
Selection=1
SelectionGauges=1
; 1: the engine's 3D selection bubbles (an ellipsoid about each selected unit) as
; well as the brackets; 0 (with Selection=1): the brackets alone.
SelectionBubbles=0
; The unit view placed by us (bottom right, square, beside the info panel) in our
; frame; the engine still draws the view itself. UnitViewSize: its side in units.
UnitView=1
UnitViewSize=260
; The resources across the top, in the race's own set.
Resources=1
; The top-right buttons (menu, comm, idle unit, view, objectives, help, palette,
; more).
Buttons=1
; The mission message box and the briefing/objectives box, with their OK.
Messages=1
; The pause box and its continue button.
Pause=1
; The replay controls (restart, pause, slow, normal, fast), in a replay.
Replay=1
; The timed messages in the middle of the screen.
Overlay=1
; The chat lines and the text-entry line (the keys stay the engine's).
Chat=1
; The texts some missions' scripts show: the resources sent to another team ("Sent
; to Team 2", under the top-right buttons) and the team message.
TeamTexts=1
; The tooltips at the pointer (an object's name and description over the 3D view),
; in the theme at the screen's resolution; 0: the engine's, on the stock canvas.
Tooltips=1
; The multiplayer boxes: the comm panel (players, chat targets, alliances, giving
; units and resources), the dropped-player box, the wait for the others' loads.
Comm=1
DropPlayer=1
LoadWait=1
; The engine's last draws in a mission, drawn by the UI as the engine drew them
; (HUD.md, "The engine's last draws"): Overview, the drag box, the height posts, the
; ring at a move order's destination and a placement's footprint; Fade, the scripts'
; fade to and from black;
; UnitVideo, the unit view's video. 0: the engine's.
Overview=1
; With Overview=1, how a placement's markers are drawn (HUD.md, "The placement
; markers"): 1, in the theme: the footprint green with corner brackets where the place
; is clear, red and hatched where it is not, the cells taken by other objects as amber
; tiles fading with distance, and those under the footprint red and crossed; 0, with
; the engine's sprites (the red or green brackets over a yellow grid).
Placement=1
Fade=1
UnitVideo=1
; For the test bench: 1 writes every panel's rectangle to UI.log each time the HUD's
; layout changes ("layout: WxH | info x,y,w,h | bar ..."; HUD.md, "The layout log"),
; for testbench/scenarios/ui-hud-layout.md. 0 (always, in play): nothing written.
LayoutLog=0

[Menus]
; 1: the UI hosts the shell's menus: every stock dialog runs hidden and the UI draws
; and drives it (ui/MENUS.md). Stands down while Menus.asi is loaded. 0: the stock
; GDI menus, 800x600, each in a window of its own (menus/install.sh puts Menus.asi
; back for them).
Enable=1
; A screen without a layout of our own: mirror (as the game paints it) or widgets
; (its controls as the UI's widgets).
Generic=mirror
; 0: no screen spec (the main menu's), every screen generic.
Specs=1
; Esc in the in-mission menu is Return to Game.
EscapeReturns=1
; 1: the main menu and the campaign selection stand over render3d's 3D map (a fleet
; over a planet; on the campaign selection the scene of the campaign pointed at),
; render3d/README.md, "The menu scene". Without Render3D.asi, or 0: the stock screen's
; art behind them.
Scene=1
; 1: the Credits are the UI's: Credits.txt page by page over render3d's map (the
; camera touring its views), the logos in the corners; Esc returns to the main menu,
; Space turns the page. 0: the game's own Credits.
Credits=1
; UI.log: each hosted dialog's messages, the actions sent to it, and its surfaces as
; UI-dlg<depth>-*.bmp every 5 s. Host=0 with it: the dialogs run stock, only traced.
Trace=0
Host=1

[Loading]
; 1: the loading screen is the UI's (ui/README.md, "The loading screen"): the map's
; sky, the mission's title, briefing and objectives, the players, and the load's
; progress, animated between the engine's frames. 0: the engine's logo and bar.
Enable=1
; For the test bench: seconds the load waits half-way, the screen still drawn and
; animated, so it can be looked at. 0 (always, in play): no wait.
Hold=0

; The test bench (README.md, "The animation clock"). Clock=wall (in play): animations
; run on the wall clock. Clock=bench: on the simulation's time, so a paused game stands
; still, and transitions (hover fades, a panel opening, a tooltip's delay) are settled
; at once. `a2test --clock bench` sets it in a bench clone.
[Bench]
Clock=wall
