; UI.ini's values on Fleet Operations: Roots (PLAN-FLEETOPS.md, FO-6, decision 63),
; applied over ui/UI.ini by ui/install.sh for `./install --game fo-roots` (apply-defaults.py:
; only the keys that differ, each in its section; a key UI.ini lacks fails the install).
; The loading screen and the plugin itself are on; every other part is Roots' own until
; it has been shown to keep Roots' gameplay: the HUD's panels (the stock components keep
; running, and the info panel, the bar and the resources are not the ones the profile
; describes), the menus (a 1200x900 shell with its own bitmaps), the Credits, the menu
; scene and the engine's cursor. A part is switched on here once its row in
; PLAN-FLEETOPS.md, "FO-6", says it is verified.
[UI]
Cursor=0
; Roots plays its intro on a Direct3D 9 device of its own.
