; UI.ini's values on Fleet Operations: Roots (PLAN-FLEETOPS.md, FO-6, decision 63),
; applied over ui/UI.ini by ui/install.sh for `./install --game fo-roots` (apply-defaults.py:
; only the keys that differ, each in its section; a key UI.ini lacks fails the install).
; The loading screen and the plugin itself are on, and the HUD panels that Roots changes
; least (FO-6 step 4: the resources, the top-right buttons, the pause box, the chat, the
; selection overlay, the frame-rate panel and the 3D view's order ring, height posts and
; placement footprint); every other part is Roots' own until it has been shown to keep
; Roots' gameplay: the info panel, the bar and the minimap (not the objects the profile
; describes), the message, objectives, replay and overlay-text boxes (no trigger in a
; skirmish yet), the menus (a 1200x900 shell with its own bitmaps), the Credits, the menu
; scene and the engine's cursor. A part is switched on here once its row in
; PLAN-FLEETOPS.md, "FO-6", says it is verified. The UI plays no button sound on Roots
; (every audio class is FleetOpsHook's FMOD; decision 126). The bar (`Bar=1` in the Refit screen) is
; a skin over Roots' own buttons that keeps its range rings and tooltips (decisions 128 and 129); it
; ships off until the look is judged.
[UI]
Cursor=0
; Roots plays its intro on a Direct3D 9 device of its own.
Movies=0
; The Refit screen over a mission with Ctrl+F12 (FO-6, decision 86): the menu host does not
; reach Roots' Options.
RefitKey=123

[HUD]
Enable=1
Bar=0
BarLabels=0
