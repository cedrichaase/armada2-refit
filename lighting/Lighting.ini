; Lighting.asi -- scene lighting, and ships on the GPU.  See lighting/lighting.c.
;
; Read once at startup; relaunch the game to change it.
[Lighting]
; 1 draws ships and stations through the engine's static vertex buffers (the
; GPU path stock uses only for asteroids); 0 leaves them on the CPU.
GPU=1
; 1 replaces each map's own lights with the two below; 0 keeps the map's.
Lights=1
; Colours are linear RGB, 1 = full. An axis is the light matrix's third axis,
; the engine's own convention (the log shows each map's for comparison).
KeyColour=1.00 0.96 0.90
KeyAxis=0.50 -0.50 0.71
FillColour=0.06 0.08 0.18
FillAxis=-0.50 0.50 -0.71
; Light every GPU-drawn surface gets regardless of direction (so no side is black).
Ambient=0.05 0.05 0.07
; 1 lights GPU-drawn ships per pixel, in shaders, when the d3d8 slot holds crosire's
; d3d8to9 (platform/d3d8-chain.py --use d3d8to9): the same lights and material as the
; fixed-function path, computed per pixel. With any other d3d8, or 0, ships are lit
; per vertex by Direct3D as before. Lighting.log says which.
Shaders=1
; With Shaders: how strongly a self-illuminating hull's night lights (its texture's
; alpha: windows, deflector, nacelle and bussard glow) show through unlit. 1 is what
; the CPU path draws in stock; 0 leaves them dark, as the GPU path did before.
SelfIllumination=1.0
; 1 lights the meshes a model mirrors back with its node matrix (the Akira's
; distant one) the right way round; 0 leaves them dark from the key light's side.
FixMirrored=1
; 1 gives planets (and their cloud shells) a night side: their material's constant
; term becomes PlanetAmbient and their diffuse PlanetDiffuse. Stock is 0.5 and 0.75
; white, which leaves the night side half lit. 0 leaves planets as stock.
Planets=1
; Left out, PlanetAmbient is Ambient. Lower than Ambient so a planet's night side
; reads as night, and later light sources stand out against it.
PlanetAmbient=0.02 0.02 0.03
PlanetDiffuse=1.00 1.00 1.00
; Point lights (nebulae, planets, explosions, torpedoes) on the GPU path: at most this
; many per draw, the strongest first: up to 16 with Shaders, 6 without. 0 gives
; GPU-drawn ships none, as stock.
PointLights=12
; 1 lets nebulae light their surroundings in their glow colour (the ODF's red_glow..),
; times NebulaBrightness, with the falloff (stock 60 + 60 units) times NebulaRange.
Nebulae=1
NebulaBrightness=2.0
NebulaRange=8.0
; A nebula is drawn, and lights its surroundings, while its bounding sphere times this
; is in view. The sphere is smaller than the cloud and its light: at 1 (stock) a nebula
; beside a ship vanished, light and all, once the camera zoomed in far enough to lose
; it. 3 covers the light's reach at NebulaRange=8.
NebulaCull=3.0
; 1 lets a planet's day side light what is near it: Key colour x the mean colour of the
; planet's ground texture x PlanetGlow, from the planet's centre, full at its surface and
; gone at PlanetGlowRange radii, times how much of the day side faces the object.
PlanetGlows=1
PlanetGlow=1.5
PlanetGlowRange=6.0
; A third, faint directional light in the colour the skybox shows most of, from the side
; that shows it: its strongest channel. 0 leaves it dark.
SkyLight=0.35
; 1 lights the surroundings of a ship's or station's explosion: ExplosionColour x
; ExplosionBrightness at the flash, fading over the explosion; full over its radius (at
; least 40 units), gone at ExplosionRange radii.
Explosions=1
ExplosionColour=1.00 0.62 0.28
ExplosionBrightness=4.0
ExplosionRange=10.0
; 1 writes Lighting.log beside Armada2.exe.
Log=1
