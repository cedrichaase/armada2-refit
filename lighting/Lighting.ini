; Lighting.asi -- scene lighting, and ships on the GPU.  See lighting/lighting.c.
;
; Read once at startup; relaunch the game to change it.
[Lighting]
; 1 draws ships and stations through the engine's static vertex buffers (the
; GPU path stock uses only for asteroids); 0 leaves them on the CPU.
GPU=1
; 1 replaces each map's own lights with the two below; 0 keeps the map's.
Lights=1
; Colours are linear RGB, 1 = full. An axis is the light matrix's third axis,
; the engine's own convention (the log shows each map's for comparison).
KeyColour=1.00 0.96 0.90
KeyAxis=0.50 -0.50 0.71
FillColour=0.06 0.08 0.18
FillAxis=-0.50 0.50 -0.71
; Light every GPU-drawn surface gets regardless of direction (so no side is black).
Ambient=0.05 0.05 0.07
; 1 lights the meshes a model mirrors back with its node matrix (the Akira's
; distant one) the right way round; 0 leaves them dark from the key light's side.
FixMirrored=1
; 1 gives planets (and their cloud shells) a night side: their material's constant
; term becomes PlanetAmbient and their diffuse PlanetDiffuse. Stock is 0.5 and 0.75
; white, which leaves the night side half lit. 0 leaves planets as stock.
Planets=1
; Left out, PlanetAmbient is Ambient. Lower than Ambient so a planet's night side
; reads as night, and later light sources stand out against it.
PlanetAmbient=0.02 0.02 0.03
PlanetDiffuse=1.00 1.00 1.00
; 1 writes Lighting.log beside Armada2.exe.
Log=1
