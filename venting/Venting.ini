; Venting.asi -- the plasma and gas a damaged ship vents, drawn by shaders
; (venting/venting.c, venting/README.md)
[Venting]
; 1: the vents are drawn by the plugin; 0: the stock sprites.
Enable=1
; 1: re-read this file within half a second of an edit.
Reload=1
Log=1
; 1: log one vent's puffs (their ages and spacing) every 120 frames, for tuning.
LogPuffs=0

; Each kind on its own (1: drawn by the plugin; 0: left stock): Plasma, the engines'
; flame-coloured plume (the sprite node ventplas); Gas, the vapour other systems vent
; (ventgas). PlasmaSprite and GasSprite name the sprite nodes in Sprites/emitter.spr.
Plasma=1
Gas=1
PlasmaSprite=ventplas
GasSprite=ventgas

; The puffs, one per particle of the engine's: brightness, size (1: the stock sprite's,
; growing as stock's do), how much longer than wide along their flight (0: round), and
; never under MinPixels across, dimmed by how much that enlarged them.
PlasmaBrightness=1.0
PlasmaSize=1.0
PlasmaStretch=0.8
PlasmaMinPixels=3
GasBrightness=0.55
GasSize=1.1
GasStretch=0.6
GasMinPixels=3

; The plasma's colours as it cools: hottest (where it leaves the vent, in the dense
; billows), middle, coolest (0..255). The gas: bright, cold. Cooling: how fast each
; goes from the one to the other over a puff's life (1: evenly; more: sooner).
PlasmaHot=255,215,110
PlasmaMid=255,140,35
PlasmaCool=150,25,8
GasBright=170,200,255
GasCold=55,80,220
PlasmaCooling=3
GasCooling=2.0

; The billows: their size (more: smaller billows), how fast they roll (per second of a
; puff's life), their contrast, and how far into a puff its edge is broken into wisps
; (0: a round edge, 1: half way).
BillowScale=2.4
BillowFlow=0.6
BillowContrast=2.5
EdgeSoftness=0.3

; At each vent spraying: the glow where the stream leaves the hull (brightness, size of
; the stock sprite, never under GlowMinPixels across, colour) and the jet core along the
; stream's first stretch (brightness, length in seconds of the particles' flight, width
; of the stock sprite). Both flicker by Flicker (0 steady, 1 down to dark).
PlasmaGlow=1.4
PlasmaGlowSize=1.6
PlasmaGlowMinPixels=10
PlasmaGlowColour=255,190,90
PlasmaJet=1.2
PlasmaJetLength=0.5
PlasmaJetWidth=0.55
PlasmaFlicker=0.35
GasGlow=0.35
GasGlowSize=1.0
GasGlowMinPixels=6
GasGlowColour=170,200,255
GasJet=0.4
GasJetLength=0.35
GasJetWidth=0.5
GasFlicker=0.15

; The light each vent casts on the hull about it (0: none): its colour (0..255) times
; this, LightLift bounding radii out along the stream, full to LightReach radii of the
; ship. Reaches GPU-drawn hulls through Lighting.asi.
PlasmaLight=1.6
PlasmaLightColour=255,130,45
PlasmaLightReach=0.35
PlasmaLightLift=0.05
GasLight=0.4
GasLightColour=150,185,255
GasLightReach=0.25
GasLightLift=0.05

; A moving ship leaves its puffs apart: each is stretched back to the next younger one
; (the youngest to the vent) so the stream stays whole, unless that is over MaxLink
; times its width (at warp, say).
MaxLink=8

; How far the glow is drawn towards the camera (of its size): the vents sit at or a
; little inside the hull.
Pull=1.5
