; Scene.asi -- the scene built into a mission once it is running (test bench only).
; Keys and commands: testbench/scene/README.md. Other scenes: scenes/*.ini.
[Scene]
Enable=1
; mission ticks to wait before building
Delay=30
; 0: fog and shroud off for good (the map fully explored); 1: as the map has them
Fog=0
; 1 keeps the HUD; 0 hides all of it.  1 keeps the map grid; 0 hides it
Hud=0
Grid=0
; camera: object positions are offsets from the RTS camera's interest point; world: absolute
Anchor=camera
; centre the RTS camera on this object
Center=ship
; a camera or orbit command for the free camera, as in Scene.cmd (empty: the RTS camera)
Camera=

; one section per object, [Object.<name>], built in file order
[Object.ship]
Odf=fgalaxy
Team=1
X=0
Y=0
Z=0
Heading=30
