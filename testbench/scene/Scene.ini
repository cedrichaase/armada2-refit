; Scene.asi -- the scene built into a mission once it is running (test bench only)
[Scene]
Enable=1
; mission ticks to wait before building
Delay=30
; 0: fog and shroud off for good (the map fully explored); 1: as the map has them
Fog=0
; the object: an ODF name from odf/ (fgalaxy = Galaxy class), and its team
Odf=fgalaxy
Team=1
; camera: X/Y/Z are an offset from the RTS camera's interest point; world: absolute
Anchor=camera
X=0
Y=0
Z=0
; degrees about the up axis; 0 faces +z
Heading=30
Immortal=1
; centre the RTS camera on the object afterwards
Center=1
; 1 keeps the HUD; 0 hides all of it (the last of Ctrl+I's four interface modes)
Hud=0
; 1 keeps the map grid; 0 hides it
Grid=0
