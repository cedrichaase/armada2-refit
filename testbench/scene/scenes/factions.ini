; One torpedo or pulse ship of each playable faction, each firing at its own Borg cube
; (bbattle1) for as long as the session runs, for the colour of the weapons' lights
; (lighting, OrdnanceColours=). As SCENE=firing: shooters' engines off, targets
; immortal, healed every tick, weapons off. Shooter <name>, its target <name>_t;
; pairs 800 apart in x and z.  SCENE=factions
