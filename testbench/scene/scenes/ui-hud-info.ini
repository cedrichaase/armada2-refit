; The info panel (UI.asi, [HUD] Info=1; ui/HUD.md, "The info panel"): one of each
; thing the panel describes, about the camera's start. The player's Galaxy class
; (`mine`), a Sovereign (`hurt`) under fire from two enemy Klingon battleships (`foe`,
; `foe2`, immortal and healed) so its hull and systems take damage while it
; cannot die, three destroyers for a group (`d1`..`d3`), a starbase (`base`) to queue
; ships at, a construction ship (`rig`: `build rig ...` tops the team's resources
; up), and a dilithium moon (`moon`). Select with `select <name>`.
