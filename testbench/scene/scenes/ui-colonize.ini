; Colonising a planet through the HUD (UI.asi; scenarios/ui-hud-colonize.md): the
; player's Federation colony ship (`colony`, `fcolony`) and a Galaxy class (`mine`)
; beside an unclaimed class M planet (`planet`), with the HUD, cursor, tooltips and
; hover on, as in play. A left click on the planet selects it; with the colony ship
; selected, a right click on the planet orders it to colonise.  SCENE=ui-colonize
