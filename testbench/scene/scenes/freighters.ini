; Freighters and their cargo: the Federation, Klingon, Romulan, Cardassian and Borg
; freighters parked in a row, 120 apart, healed and immortal, engines off. `cargo <name>
; latinum full` fills a hold as mining does (`cargo <name> dilithium 75`, `... empty`):
; a hold of latinum trails the golden latinum spray (none on the Borg's, whose ODF names
; no hardpoint for it), and every resource lights the hull's cargo markings in its
; colour. `goto` one to see the trail behind a moving ship. For render3d's particles
; (render3d/README.md, "particles"; scenarios/render3d-freighter-trail.md).  SCENE=freighters
