; The harness only, on whatever map the game loaded -- a skirmish, a mission, Roots'
; Instant Action: no objects of its own, and the game as a player has it (fog, HUD, grid,
; cursor, notices, tooltips and hover on), so that `objects`, `select #<id>`,
; `camera on #<id>`, the orders, `pause` and `seed` work in an ordinary game.
; SCENE=game; keys and commands: ../README.md.
[Scene]
Delay=5
Fog=1
Hud=1
Grid=1
Cursor=1
Notices=1
Tooltips=1
Hover=1
Anchor=world
