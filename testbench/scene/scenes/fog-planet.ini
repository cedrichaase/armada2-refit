; A planet left under the fog of war: the map's fog and shroud on, a scout parked
; beside a class M planet so the player sees it, the player's Galaxy far off. Send the
; scout away (`goto scout ship`) and the planet is left as a ghost under the fog.
; For Render3D.asi's planet ghosts (render3d/README.md, overlays; scenarios/
; render3d-planet-ghost.md).  SCENE=fog-planet
