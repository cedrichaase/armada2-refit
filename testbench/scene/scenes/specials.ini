; Special weapons: an enemy Sovereign (`tgt`) that cannot die, has its weapons and
; engines off and is not healed (so a weapon that works on shields shows), and a Galaxy
; class (`warper`) off to one side, for the warp flash (`goto warper ... warp`).
; Shooters come with `spawn` and fire with `special <ship> <weapon> [target]`, with
; `energy <ship> on` to keep their special energy full. For Render3D.asi's specials
; (render3d/README.md).  SCENE=specials
