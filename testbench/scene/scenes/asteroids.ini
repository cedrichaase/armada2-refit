; An asteroid field (mafield, 4-8 rocks) and a big one (mafield2, 3-6 larger rocks)
; beside a Galaxy class for scale.  SCENE=asteroids; keys: ../README.md
; The fields are built with no rocks of their own named: orbit the field's name, or
; `query` for where each rock is. For the asteroids' surfaces and smoothing
; (surfaces/README.md, models/README.md).
[Scene]
Fog=0
Hud=0
Grid=0
Anchor=world
Camera=orbit field 210 20 260

[Object.field]
Odf=mafield
Team=0
X=2000
Y=0
Z=2000

[Object.big]
Odf=mafield2
Team=0
X=2500
Y=0
Z=2000

[Object.ship]
Odf=fgalaxy
Team=1
X=2150
Y=0
Z=1850
Heading=60
Engines=0
