; The Borg technology assimilation beam: a Borg cube (`borg`, bbattle1, the player's)
; 220 from an enemy Sovereign (`tgt`, fbattle), engines off, special energy kept full.
; The beam only lives while the target carries a special weapon that is available to
; its team and that the cube does not carry yet; a2_borg01's tech tree makes the
; Sovereign's corbomite reflector (gcorbom) impossible, so `Tech=gcorbom` makes it
; available to the Sovereign's team (`tech`, README "Commands"). The cube's weapons
; are off, or it opens up on the Sovereign with its phasers: `weapons borg on`, then a
; moment later (the special does not fire on the tick they come on)
; `special borg gTechAssimBeam tgt`. The beam holds until about 7 s after firing, when
; the cube has taken the weapon (assimilationTime 6 s); a cube takes one
; (maxExtraWeapons), so a second beam needs a new cube. Weapons off ends the beam. The
; Sovereign is healed (no shields-down ring, no plumes) and does not fire; shield
; flashes and hover gauges are off. For render3d's assimilation cone (ART-DIRECTION.md,
; "Tractor and assimilation beams").  SCENE=assimilation
