; The RTS camera's zoom (`Zoom=` and `zoom`, ../README.md, "The zoom"): the HUD on,
; a Galaxy class (`mine`) and two destroyers beside it, the camera centred on `mine`
; and zoomed to level 0.37, the view the 150 + 35 key presses reach, so a launch starts from the same view every time. Change
; `Zoom=` to frame the shot; `zoom` with no value reads what a manual setup left.
; SCENE=zoom; keys: ../README.md.
