; Nothing but the sky: no objects, the free camera at the middle of the map looking out.
; SCENE=sky; keys: ../README.md.  Turn the view with `orbit 3000 0 3000 <yaw> <pitch> 1`,
; and step through the backgrounds with Render3D.ini's [Sky] Load= (render3d/README.md, "sky").
[Scene]
Fog=0
Hud=0
Grid=0
Anchor=world
Camera=orbit 3000 0 3000 0 0 1
