; Construction: the player's Federation construction ship (`rig`, fconst) beside
; a finished starbase (`base`) for comparison, and a Galaxy class (`galaxy`) to be
; struck and repaired.  SCENE=construction; keys: ../README.md.
;   build rig fbase 2300 0 2000       the rig flies there and builds a starbase:
;                                      worker bees, welding along the new edges
;   build rig fyard 2300 0 2000       (or a shipyard, faster)
; The rig's team gets its resources topped up by `build`.
[Scene]
Fog=0
Anchor=world
Center=rig
Camera=orbit 2150 0 2000 30 25 650

[Object.rig]
Odf=fconst
X=2000
Y=0
Z=2000
Heading=90

[Object.base]
Odf=fbase
X=1600
Y=0
Z=2500
Immortal=1

[Object.galaxy]
Odf=fgalaxy
X=1700
Y=0
Z=1700
Heal=1
