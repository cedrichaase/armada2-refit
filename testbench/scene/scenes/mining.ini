; Mining beams: a dilithium moon (`moon`, mdmoon), the player's mining station
; (`station`, fmining) behind it, a Federation freighter (`freighter`, ffreight) and a
; Borg one (`borg`, bfreight) in front, and a Galaxy class (`galaxy`, engines off) by
; the moon to take the beam's light. The freighters do not mine on their own (a moon
; the scene builds has no resource to mine): fire the beam as a special weapon,
; `special freighter gmineDilithium moon` (1.25 s; `pause` to hold it). For the mining
; beams (render3d/README.md, "Ordnance").  SCENE=mining
