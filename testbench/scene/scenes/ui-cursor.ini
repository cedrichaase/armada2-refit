; The mouse cursor in a mission (UI.asi, [UI] Cursor=1): the player's Galaxy class
; (`mine`) and, 300 units to its right, an enemy Klingon battleship (`foe`) that
; cannot die and has its weapons and engines off. Select `mine`: the pointer over `foe`
; is the attack cursor, over empty space the move cursor. HUD and cursor on.
; SCENE=ui-cursor; keys: ../README.md.
[Scene]
Fog=0
Hud=1
Grid=0
Cursor=1
Anchor=world
Center=mine

[Object.mine]
Odf=fgalaxy
Team=1
X=3000
Y=0
Z=3000

[Object.foe]
Odf=kbattle
Team=2
X=3300
Y=0
Z=3000
Heading=270
Immortal=1
Weapons=0
Engines=0
