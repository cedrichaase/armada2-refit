# Fleet Operations: Roots: the modes the engine asks for, as Roots asks for them. The file
# raises the shell's request in SetActiveDisplay_Internal to 1200x900, and FleetOpsHook.dll,
# as it loads, raises its depth to 32 bits and the intro's two requests in
# Program::PlayIntroMovie to 1200x900 (display/README.md, "On Fleet Operations: Roots").
# Display8 names the front end's request by these values when it answers it, and raises
# the intro's under [Window] RaiseIntro.
schema = 1
plugin = "display"

[[sym]]
id = "front_end_width"
value = 1200

[[sym]]
id = "front_end_height"
value = 900

[[sym]]
id = "front_end_depth"
value = 32

[[sym]]
id = "intro_width"
value = 1200

[[sym]]
id = "intro_height"
value = 900
