# Fleet Operations: Roots' content sets (crates/a2engine/README.md, "Content"): render3d
# reads the fleetops set (render3d/content/sets/fleetops/, FO-5 step 6): Roots' names
# for what each module matches (races, ordnance and special-weapon ODFs, nebula classes,
# the sprite and SOD names Roots keeps), with the stock set's looks, never numbers fitted
# to Roots' art (PLAN-FLEETOPS.md, decision 7). Before it, every render3d module but the
# hulls read the stock set here, inherited from gog-1.1's content.toml (build.toml's
# `none` is only the fallback for a plugin no content.toml up the chain names). The UI
# reads the fleetops set too (ui/content/sets/fleetops/, FO-6 step 1): Roots' race names.
schema = 1

[set]
render3d = "fleetops"
ui = "fleetops"
