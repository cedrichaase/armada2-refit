# Fleet Operations: Roots: the effects module's values (FO-5 step 5).
schema = 1
plugin = "render3d"

# FleetOpsHook owns Craft::Explode's call of Fragment (it breaks a craft up only when the
# class's explosionChunks allows) and calls Fragment through a pointer of its own: the debris
# is taken at Fragment's entry, armed only while FleetOpsHook calls it (PLAN-FLEETOPS.md,
# "The rules of (c)", rule 4). The other callers (a cancelled construction, the Evolver's
# cocoon) stay the engine's.
[[sym]]
id = "ef_debris_at_callee"
value = 1

# Roots' FleetOpsHook doubles a shield hit's shell while RTS_CFG.h's SHIELD_EFFECT_RESCALE is
# 1, and colours a hit by the shields' level only while SHIELD_EFFECT_DAMAGE_COLORED is 1
# (white otherwise). render3d reads both keys from the game's RTS_CFG.h.
[[sym]]
id = "ef_shield_rescale_pct"
value = 200

[[sym]]
id = "ef_shield_damage_key"
value = 1

# FleetOpsHook replaces CreateShieldHit's pick of the hit's model (m_logical_db of the hit's
# type) with a call of its own, written as it loads (the file holds stock's bytes): a model per
# ship class and type, from the class's ODF (shieldHit, shieldHitCritical when low,
# shieldDown, ...), so no hit carries the shield database's models. The call is
# chained (the type and the object are its two arguments, the hit in ecx), and the model it
# set is noted against the type, so the shields know an ordinary hit, a shields-down ring and
# a special weapon's shell by type, not by model (render3d/README.md, "Shields on Roots").
[[sym]]
id = "site_hit_model"
symbol = "ShieldEffect::CreateShieldHit"
kind = "call"
addr = 0x47449a
target = "fn_set_logical_db"
chain = true
in = "ShieldEffect::CreateShieldHit"
used_by = ["effects.shield_models"]
