# Fleet Operations: Roots: FleetOpsHook.dll takes over this function at its entry as it
# loads (a jump to its own replacement). Our hooks only call it, and what Roots puts there
# is what Roots means, so this build checks nothing at its entry (PLAN-FLEETOPS.md,
# "FleetOpsHook.dll at run time").
schema = 1
plugin = "qol"

[[sym]]
id = "bk_operator_new"
check = ""

# Roots' Input.map gives plain W to select_next_ship (stock's is the left bracket), which the
# overview reads, not the bar: the W cell gets no position key here (FO-6 decisions 330 to 349).
[[sym]]
id = "bk_key_cells"
value = 0x7ffd
