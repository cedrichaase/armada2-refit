# ---- FleetOpsHook.dll, in memory (how = "runtime") -------------------------------
# Written by FleetOpsHook.dll as it loads (inside Win2kDisableTaskSwitch.dll's attach,
# before WinMain and before any plugin of ours starts): seen by MemDiff.asi on the bench,
# and in agreement with a reading of the DLL. Functions marked above for the file are not
# repeated. Grouped by the first of our plugins whose hooks use them.

# display

[[changed]]
fn = "GameConfiguration::InitializeGraphicsSystem"
how = "runtime"
verified = ["display.modes"]

[[changed]]
fn = "Program::PlayIntroMovie"
how = "runtime"
verified = ["display.modes"]

[[changed]]
fn = "RenderLoopAssetLoadStatusUpdate"
how = "runtime"
verified = []

# render3d

# FleetOpsHook's edit is the object loop's draw (+0x185..+0x194); the effects module reads
# only the chunks' call (+0x336), which it leaves as it is (FO-5 step 5); the ordnance
# module's warp call (+0x313) is a plain call of the untouched RenderWarpSpriteEffects,
# past the edit (FO-5 step 7).
[[changed]]
fn = "Armada_RenderAllOurStuff"
how = "runtime"
verified = ["render3d.frame.*", "render3d.effects.reads", "render3d.ordnance.warp"]

# FleetOpsHook's one edit (+0x245) takes out an edit-menu call, away from the seam's call at
# 0x59886e (FO-5 step 3).
[[changed]]
fn = "Armada_RenderFrame"
how = "runtime"
verified = ["render3d.frame.*"]

# FleetOpsHook re-points the node-particle call at +0x4f8, away from the shield-hit call the
# effects module taps (+0x345, still stock's in memory) (FO-5 step 5).
[[changed]]
fn = "Beam::Simulate"
how = "runtime"
verified = ["render3d.effects.shields"]

# FleetOpsHook edits the body (+0x10, +0x69) and gives rigs GameObject::Render in their
# vtable: the core only compares this address with a class's Render slot (FO-5 step 3).
[[changed]]
fn = "ConstructionRig::Render"
how = "runtime"
verified = ["render3d.core.reads"]

# FleetOpsHook's one call (+0x1d9d) is the last key read before the parser is freed, where
# it reads its own keys; the culling distance's load (+0xebf) is stock's, and FleetOpsHook
# names neither the far plane nor the culling distance (FO-5 step 7).
[[changed]]
fn = "RTS_Configure"
how = "runtime"
verified = ["render3d.view.distance"]

# FleetOpsHook's call inside the body (+0xea) runs as it wrote it: the effects module
# taps the weapons' calls of the function and calls what they called (FO-5 step 5), and
# chains that call to note which type each model it picks is (effects.shield_models).
[[changed]]
fn = "ShieldEffect::CreateShieldHit"
how = "runtime"
verified = ["render3d.effects.reads", "render3d.effects.shields", "render3d.effects.shield_models"]

# FleetOpsHook takes out the free of the previous background database (+0x16, after its
# destructor; Background_Close likewise), keeping its memory: the entry, the name and the
# database the sky module reads are stock's, and the module calls the function only on the
# bench (`[Sky] Load=`) (FO-5 step 7).
[[changed]]
fn = "Starfield_Load_Background_Geometry"
how = "runtime"
verified = ["render3d.sky.reads"]

# FleetOpsHook's call at +0x143 is inside the function; the terrain step calls it through its
# site whole, so Roots' change runs as Roots wrote it (FO-5 step 3).
[[changed]]
fn = "Terrain_Geometry::Render"
how = "runtime"
verified = ["render3d.frame.*"]

[[changed]]
fn = "cOverViewImp::mDrawPost"
how = "runtime"
verified = []

[[changed]]
fn = "cOverViewImp::mDrawPosts"
