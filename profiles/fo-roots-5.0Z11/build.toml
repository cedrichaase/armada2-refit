# Star Trek: Armada II -- Fleet Operations: Roots 5.0Z11 (games/fo-roots.toml): its
# Data/ArmadaL.exe is stock 1.1's image patched (PLAN-FLEETOPS.md, "The executable"), so
# this build inherits gog-1.1 and only marks what Roots changes. The timestamp is
# stock's; the image size and the section fingerprint tell it apart.
#
# [[changed]] lists only the functions Roots changes that one of our entries is (`symbol`)
# or sits in (`in`): every hook using one stands down here until it is verified beside
# Roots' change and named in `verified`. `detour`: Roots jumps or calls into its own code
# section there; `edit`: constants or branches changed in place; `runtime`: changed in
# memory by FleetOpsHook.dll, which no file diff shows (PLAN-FLEETOPS.md, FO-2).
# The file diff and the run-time diff that found them are not published (hard rule 9):
# they are re-run with the bench's MemDiff.asi (testbench/memdiff/) and the profile tools.
schema = 1
game = "armada2"
build = "fo-roots-5.0Z11"
label = "Fleet Operations: Roots 5.0Z11"
exe = ["ArmadaL.exe"]
inherits = "gog-1.1"
# No content set yet: stock's recipes are keyed by stock's ODF and model names, and
# Roots' differ. FO-5 writes Roots' own set; until then the engine's look shows.
content = "none"

[pe]
timestamp = 0x3c4c76bd
image_size = 0x405000
sections = 0xca07c55a
image_base = 0x400000
code = [0x401000, 0x6ae000]
# CRC-32 of each section's content in the file on disk (FleetOpsHook rewrites .text and
# .rdata in memory before a plugin runs, so the file is what tells a Roots build apart).
file_crc = { ".text" = 0xef690537, ".test" = 0xe7a4061b }

# The companion module the run-time marks below describe, named by the CRC-32 of its
# .text in its file: another one loaded stands down every hook that depends on its
# patches (crates/a2engine/README.md, "Identity").
[[module]]
name = "FleetOpsHook.dll"
text_crc = 0x28c90d19

[[known]]
sha256 = "4300ab71731e323f5767d8ee05457e6444401b823253aebee86c5ac23c2b00de"
note = "Fleet Operations: Roots 5.0Z11 (23 October 2026), Data/ArmadaL.exe as installed"

# ---- off in Roots -----------------------------------------------------------------

[[disable]]
hooks = ["qolrules.*"]
why = "Roots has its own rules"

# ---- display ------------------------------------------------------------------------
# display.modes verified 2026-11-06 (FO-A; display/README.md, "On Fleet Operations:
# Roots"): its six call sites and FindDisplayMode's checked entry are stock's bytes in the
# file and in memory after FleetOpsHook has patched; Roots' edits sit beside them (the
# lookup's width and height tests, the shell's and the intro's requested modes), which
# display.toml here names.

[[changed]]
fn = "ST3D_DisplayDevice::FindDisplayMode"
how = "edit"
verified = ["display.modes"]

[[changed]]
fn = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
how = "edit"
verified = ["display.modes"]

[[changed]]
fn = "WinMain"
how = "edit"
verified = []

# ---- render3d -----------------------------------------------------------------------

# Roots' cloak calls and wave-light detours sit past the entry; the hulls module only compares
# this address with a class's slot 22 and reads the cloak's stock fields (FO-5 step 3). The
# billboard effect's call (+0x19c) and its arguments are stock's in the file and in memory:
# FleetOpsHook's cloak call begins on the next instruction, which the call returns to and
# which no particles code touches (FO-5 step 7).
[[changed]]
fn = "GameObject::RenderInternal"
how = "detour"
verified = ["render3d.hulls.reads", "render3d.particles.billboard"]

[[changed]]
fn = "Craft::Explode"
how = "detour"
verified = []

[[changed]]
fn = "BuildingEffect::SafeDestroyConstruction"
how = "detour"
verified = []

# Roots' file and FleetOpsHook change how a hit's shell is scaled and coloured (the two
# RTS_CFG.h keys); the effects module calls the function whole for a hit it does not draw,
# so Roots' version runs, and its own hits follow the same keys (FO-5 step 5).
[[changed]]
fn = "ShieldHit::DrawShield"
how = "detour"
verified = ["render3d.effects.reads"]

# The hulls module calls it only for a rig whose Render is ConstructionRig::Render, which
# no Roots rig has (FleetOpsHook gives them GameObject::Render); were it called, Roots'
# detour inside it runs as Roots wrote it (FO-5 step 3).
[[changed]]
fn = "PlaceholderFeature::sRenderInternal"
how = "detour"
verified = ["render3d.hulls.reads"]

# Called for the wave light it returns, as GameObject::RenderInternal calls it: Roots' edit is
# Roots' meaning of that light (FO-5 step 3).
[[changed]]
fn = "GetSensorScramblerWaveLight"
how = "edit"
verified = ["render3d.hulls.reads"]

# Roots' edit points the lines' colour pushes at other colours (FleetOpsHook then points the
# major lines at its own): the overlays module reads the pointer the first push holds
# (site_grid_colour, checked as a push only) and draws the grid in it (FO-5 step 5).
[[changed]]
fn = "Terrain_Geometry::DrawGrid"
how = "edit"
verified = ["render3d.overlays.reads"]

