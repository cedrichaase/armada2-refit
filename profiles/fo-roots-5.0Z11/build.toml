# ---- qol ------------------------------------------------------------------------------

# Roots' file jumps out of the function at +0xde (before the loop over the ten group keys)
# into its own code, which takes the Alt+number case whole (select the group, centre on a
# second tap) and returns; with Alt not held it comes back to the stock instruction. Every
# site qol.shift_group uses (the Control test at +0x18a, the centre test, the three
# continue points) lies on the stock path, and its bytes are stock's in the file and in
# memory after FleetOpsHook has patched (FO-7 round two, decision 108). The
# selection-array sites in the same function are Roots' (0x3d0), so qol.selection stays unverified.
[[changed]]
fn = "cOverViewImp::mCheckGroupSelect"
how = "detour"
verified = ["qol.shift_group"]

# The move queue's two sites in these (the keyboard step's call in Simulate, and the waypoint
# key's handler beside it in mProcessKeyboardInput) are stock's bytes in the file and in
# memory. Roots' edits sit elsewhere in both: the key that selected the next ship now calls
# mSelectOnscreen (a jump at +0x3f in mProcessKeyboardInput), the selection array's offset, a
# camera-pan callback and two flag reads at the end of Simulate (FO-7 round three, decision 114).
[[changed]]
fn = "cOverViewImp::mProcessKeyboardInput"
how = "detour"
verified = ["qol.move_paths"]

[[changed]]
fn = "cOverViewImp::Simulate"
how = "detour"
verified = ["qol.move_paths"]

# FleetOpsHook's edits are inside the body (the stack frame's size, the technology test of the
# build items, three stack offsets); the hotkey tables' counts it reads are stock's fields
# (+0xcc, +0xd8, +0xe4). QOL's position keys only call it, through the call in Update
# (FO-6 decisions 330 to 349).
[[changed]]
fn = "PopupPaletteImp::mProcessKeyboardInput"
how = "detour"
verified = ["qol.bar_keys"]

[[changed]]
fn = "Producer::FinishBuild"
how = "detour"
verified = []

