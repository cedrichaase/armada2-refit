# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "hud" (the HUD's engine side:
# ui/src/engine/{hud,popups,palette,overlay,overlay_text,leftovers}.rs). Each entry is
# tied to the hook that uses it; the findings are in ui/HUD.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/HUD.md"
lang = "rust"
out = "ui/src/syms_hud.rs"

[hook."hud.panels"]
doc = "The panel switch: RenderAll's Render call and RefreshOwner's CursorOver call re-pointed"
rows = ["HUD.Minimap", "HUD.Info", "HUD.Bar", "HUD.UnitView"]

[hook."hud.tooltips"]
doc = "The engine's tooltips at the pointer read and hidden from CursorInterface::Render"
rows = ["HUD.Tooltips"]

[hook."hud.reads_components"]
doc = "The HUD components (bar, info panel, minimap), their rectangles, flags and render lists"

[hook."hud.reads_calls"]
doc = "TextInput_IsActive and CinematicView::IsPlayingVideo called for the keys and click sounds"

[hook."hud.reads_popups"]
doc = "The message, objectives, pause and replay boxes read and their buttons told by press function"

[hook."hud.reads_bar"]
doc = "The button bar's slots, buttons, command and mode names, icon sprites and tooltips"
rows = ["HUD.Bar", "HUD.BarLabels", "HUD.Icons"]

[hook."hud.reads_overlay"]
doc = "The selected and pointed units, their boxes, gauges and systems, as SelectionDisplay reads them"
rows = ["HUD.Selection", "HUD.SelectionGauges"]

[hook."hud.bubbles"]
doc = "RenderSelectionEffects returns at once: the engine's 3D selection bubbles off"

[hook."hud.reads_overlay_text"]
doc = "OverlayText's timed messages read from its std::map"

[hook."hud.drag_box"]
doc = "The drag box's DrawWireframeRectangle call, recorded and drawn by the UI"

[hook."hud.height_posts"]
doc = "DrawHeightPost's ClipAndRenderLine call, recorded and drawn by the UI"

[hook."hud.order_ring"]
doc = "The order ring's and the move point's DrawQuad calls, recorded and drawn by the UI"

[hook."hud.footprints"]
doc = "RenderFootprints' three DrawQuad calls, recorded and drawn by the UI"

[hook."hud.fade"]
doc = "ScreenFade::Render's two DrawClippedRectangle calls, recorded and drawn by the UI"

[hook."hud.video"]
doc = "The in-mission Bink's blit callers and three draws, recorded and drawn by the UI"

[hook."hud.frame_rate"]
doc = "Armada_RenderFrame's frame-rate prints, recorded and drawn by the UI"

