# Render3D.asi's symbols in Armada2.exe 1.1 (GOG): module "effects" (render3d/mods/effects/src).
# Each entry is tied to the hook that uses it; the findings are in render3d/README.md, "Hooks".
schema = 1
plugin = "render3d"
readme = "render3d/README.md"
lang = "rust"
out = "render3d/mods/effects/src/syms.rs"

[hook."effects.reads"]
doc = "What the effects module reads of the engine: its objects, lists, globals and calls"
rows = ["Modules.effects"]

[hook."effects.repair"]
doc = "The weld sparks: Craft::RepairSystem's AddParticle call and NodeParticleEffect::Render's sprite call"
rows = ["Modules.effects"]

[hook."effects.shields"]
doc = "The four weapon calls of CreateShieldHit, noted to know which weapon made a hit"
rows = ["Modules.effects"]

[hook."effects.shield_models"]
doc = "Roots: the call its companion writes in CreateShieldHit to pick a hit's model, chained to note each model's type"
rows = ["Modules.effects"]

[hook."effects.debris"]
doc = "The calls of Fragment (a dying craft, the Evolver's cocoon, a cancelled construction) drawn as our chunks"
rows = ["Modules.effects"]

[hook."effects.debris_callee"]
doc = "ST3D_Instance::Fragment at its entry, armed only while the companion module (Roots: FleetOpsHook) calls it"
rows = ["Modules.effects"]

