# Where the debris of a dying craft is taken: 0 at Craft::Explode's call of Fragment
# (site_explode_fragment, effects.debris), 1 at Fragment's entry, armed only while the build's
# companion module calls it (effects.debris_callee), for a build whose companion owns that
# call and decides whether a craft breaks up (Roots: FleetOpsHook, PLAN-FLEETOPS.md, "The
# rules of (c)", rule 4). Stock takes the call and installs nothing at the entry.
[[sym]]
id = "ef_debris_at_callee"
symbol = "debris claim point"
kind = "value"
value = 0
used_by = ["effects.debris_callee"]

