# Render3D.asi's core symbols in Armada2.exe 1.1 (GOG): the frame's seam and the engine reads
# every module shares (render3d/core/src/engine/**). One file per module beside it
# (render3d.<module>.toml), so a module's symbols leave with its crate. Each entry is tied to
# the hook that uses it; the findings are in render3d/README.md, "Hooks".
schema = 1
plugin = "render3d"
readme = "render3d/README.md"
lang = "rust"
out = "render3d/core/src/syms.rs"

[hook."core.reads"]
doc = "The engine state every module shares: the object, light and feature lists, instances, sprites, sound"

[hook."frame.seam"]
doc = "Armada_RenderAllOurStuff, called from two places: both re-pointed at the renderer's body"

[hook."frame.steps"]
doc = "The calls inside the stock body that the renderer's steps replace one by one"

[hook."frame.destroy"]
doc = "DestroyRenderSurfaces chained, so the renderer lets go of the device before the engine does"

[hook."view.distance"]
doc = "The far plane and object culling raised to [View] Distance, at the end of RTS_Configure's ART_CFG parse"
rows = ["View.Distance"]

