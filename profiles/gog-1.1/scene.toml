# Scene.asi's symbols in Armada2.exe 1.1 (GOG): what testbench/scene/scene.c reads, calls and
# patches of the exe, each entry tied to the hook that uses it, so that each part of the scene builder
# stands down on its own. The findings are in testbench/scene/README.md, "How it works", beside each
# hook. Scene.asi is the test bench's: it never ships.
schema = 1
plugin = "scene"
readme = "testbench/scene/README.md"
lang = "c"
out = "testbench/scene/engine_syms.h"

[hook.tick]
doc = "Simulate's call of GameObject_UpdateRange runs the scene's tick after it: the scene is built and Scene.cmd read"

[hook.camera]
doc = "s_UpdateMainCamera's virtual call of UpdateCamera, then the free camera's transform; marks polled per frame"

[hook.build]
doc = "BuildObject makes the scene file's objects and `spawn`'s at a full transform"

[hook.fog]
doc = "Scanner::ForceFogAndShroud(false) and ForceUpdate: the map explored, never re-fogged (Fog=0)"

[hook.hud]
doc = "DisplayInterface::SetInterfaceState and the profile's interface mode (Hud=, `hud`)"

[hook.grid]
doc = "GridRenderState's records, the grid hidden or shown (Grid=, `grid`)"

[hook.cursor]
doc = "RefreshDisplay's DrawScaled2D call of the cursor, skipped while the cursor is off (chained)"

[hook.notices]
doc = "The three GameEvent::TriggerEvent entries return false while notices are off"

[hook.tooltips]
doc = "AlwaysSimulate's TooltipOn call answers no object while tooltips are off"

[hook.hover]
doc = "AlwaysSimulate's and PreRender's MouseOn calls answer no object while hover is off"

[hook.shieldfx]
doc = "The four weapons' CreateShieldHit calls answer no effect while shield hits are off (chained)"

[hook.heal]
doc = "Hull, shields, crew and systems back to full every tick (Heal=, `heal`)"

[hook.damage]
doc = "CraftInstance's Update slot: a system's damage node shown or hidden (Vent=, `vent`)"

[hook.special]
doc = "Special energy filled and a special weapon fired by its ODF (`special`, `energy`, Energy=)"

[hook.attack]
doc = "ScriptInterfaceImp::Attack (Attack=, `attack`)"

[hook.switches]
doc = "ScriptInterfaceImp's DisableEngines, DisableWeapons and CraftCannotDie (`engines`, `weapons`, `immortal`)"

[hook.hit]
doc = "Craft::DamageHull and ScriptInterfaceImp::SetRealTeam: a weapon's hit on a hull and a change of team (`damage`, `team`)"

[hook.kill]
doc = "ScriptInterfaceImp::ExplodeNow: a craft dies now (`kill`)"

[hook.mission]
doc = "ScriptInterfaceImp's SucceedMission and FailMission (`succeed`, `fail`)"

[hook.move]
doc = "GameObject::SetCommand's overloads and DeQueueCommand: GO, GO_WARP, STOP, SET_FORMATION"

[hook.build_order]
doc = "A BUILD order to a construction ship, its team paid first (`build`)"

[hook.cloak]
doc = "A craft's cloaking device asked to cloak or decloak, or cloaked at once (`cloak`)"

[hook.freighter]
doc = "Freighter::LoadResource fills or empties a freighter's hold (`cargo`)"

[hook.colonize]
doc = "A planet colonised without a colony ship, or made neutral (Population=, `colonize`)"

[hook.tech]
doc = "A team's TechnologyTree item made available or not (Tech=, `tech`)"

[hook.marks]
doc = "Ordnance and explosion lists read each frame for Scene.marks; the ordnance named by its ODF"

[hook.seed]
doc = "RandomSequence's constructor on g_random, g_missionRandom and g_asyncRandom (Seed=, `seed`)"

[hook.seed_load]
doc = "GameOpenPreLoad's Starfield_Initialize call seeds the sequences first (Seed=)"

[hook.step]
doc = "GameProcess's getGameSpeedModifier call sets the tick's milliseconds first (Step=)"

[hook.race]
doc = "SetupDefaultGame's two Race::Find calls answer the race of Race="

[hook.captions]
doc = "ShowTitle's and ShowSubtitle's AddMessage calls add nothing while Captions=0"

[hook.music]
doc = "StartMusic and JukeBox::mStartNewTrack return at once (Music=0)"

[hook.pause]
doc = "ScriptInterfaceImp's PauseSimulation and UnpauseSimulation; the sim time read (`pause`, Pause=)"

[hook.center]
doc = "ScriptInterfaceImp::CenterCamera (Center=, `center`, `camera on`)"

[hook.zoom]
doc = "The camera in use's SetZoomLevel, and its zoom read in its own unit (Zoom=, `zoom`)"

[hook.locate]
doc = "ScriptInterfaceImp::GetLocation and the RTS camera's interest point (`query`, Anchor=camera)"

[hook.select]
doc = "The overview's own Select, through g_pOverView, and its selection read back (`select`, `selection`)"

[hook.groups]
doc = "The overview's ship and station control groups listed (`selection`)"

[hook.waypoint]
doc = "The overview's waypoint-key binding pointed at a state of ours while held (`waypoint-key`)"

[hook.objects]
doc = "GameObject::objectList walked read-only into Scene.objects.jsonl (`objects`)"

[hook.windowed]
doc = "Debug_SystemCleanup, as the engine's assert and exception handlers call it: a new windowed device (`windowed`)"

