# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "loading" (ui/src/engine/loading.rs).
# The findings are in ui/LOADING.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/LOADING.md"
lang = "rust"
out = "ui/src/syms_loading.rs"

[hook."loading.overlay"]
doc = "The UI drawn over the engine's loading frame, in place of its DeleteRegisteredLights call"

[hook."loading.own"]
doc = "The load's splash and status updates hooked, for the loading screen of ours and its frames"
rows = ["Loading.Enable"]

[hook."loading.inner_db"]
doc = "A frame of ours after each SOD (LoadDatabase) a loading step reads"

[hook."loading.inner_pixels"]
doc = "A frame of ours after each texture's pixels (LoadPixelData) a loading step reads"

[hook."loading.reads_progress"]
doc = "How far a load has got, read from the load bar's fraction and the loading-screen flag"

[hook."loading.reads_pump"]
doc = "The engine's message pump, called while [Loading] Hold keeps the screen up (bench only)"

