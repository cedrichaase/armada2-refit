# BinkProxy's symbols in Armada2.exe 1.1 (GOG): what cutscenes/binkproxy reads of the exe,
# each entry tied to the hook that uses it. The findings are in cutscenes/binkproxy/README.md.
schema = 1
plugin = "binkproxy"
readme = "cutscenes/binkproxy/README.md"
lang = "c"
out = "cutscenes/binkproxy/engine_syms.h"

[hook.intro_mode]
doc = "The intro movie's hard-coded 640x480 mode raised to the desktop's (two signature scans)"
unknown = "run"

[hook.intro_copy]
doc = "BinkCopyToBuffer trusts the intro's caller frame to find the back buffer's size"

# ---- binkproxy.intro_mode: both sites sit in Program::PlayIntroMovie, and each signature
# occurs exactly once in .text (the bare 640/480 push pair occurs a third time elsewhere).

[[sym]]
id = "intro_mode_a"
symbol = "Program::PlayIntroMovie"
kind = "scan"
pattern = "6a 20 68 e0 01 00 00 68 80 02 00 00 8b b8 04 01 00 00"
section = ".text"
count = 1
in = "Program::PlayIntroMovie"
used_by = ["intro_mode"]

[[sym]]
id = "intro_mode_b"
symbol = "Program::PlayIntroMovie"
kind = "scan"
pattern = "8b 4f 1c 6a 10 68 e0 01 00 00 68 80 02 00 00 e8"
section = ".text"
count = 1
in = "Program::PlayIntroMovie"
used_by = ["intro_mode"]

# ---- binkproxy.intro_copy: the one call site whose frame is read ---------------------

[[sym]]
id = "intro_copy_ret"
symbol = "NextBinkFrame"
kind = "label"
addr = 0x4638b5
check = "8b f0 8b 45 14 50 8b 08"
in = "NextBinkFrame"
used_by = ["intro_copy"]

# The back buffer's D3DSURFACE_DESC in that frame, as distances below the saved EBP.
[[sym]]
id = "intro_desc_format"
symbol = "NextBinkFrame"
kind = "field"
struct = "NextBinkFrame frame"
offset = 0x28
type = "u32"
used_by = ["intro_copy"]

[[sym]]
id = "intro_desc_width"
symbol = "NextBinkFrame"
kind = "field"
struct = "NextBinkFrame frame"
offset = 0x10
type = "u32"
used_by = ["intro_copy"]

[[sym]]
id = "intro_desc_height"
symbol = "NextBinkFrame"
kind = "field"
struct = "NextBinkFrame frame"
offset = 0x0c
type = "u32"
used_by = ["intro_copy"]
