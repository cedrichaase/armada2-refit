# Display8's symbols in Armada2.exe 1.1 (GOG): what display/src reads of the exe, each
# entry tied to the hook that uses it. The findings are in display/README.md, "Hooks".
schema = 1
plugin = "display"
readme = "display/README.md"
lang = "rust"
out = "display/src/engine_syms.rs"

[hook.modes]
doc = "The engine's own mode requests answered with the stub's one mode"

[hook.drop]
doc = "The engine's draws told apart by caller: [Drop] and the claimed scenes"

# ---- display.modes (stub/modes.rs) ------------------------------------------------

[[sym]]
id = "find_display_mode"
symbol = "ST3D_DisplayDevice::FindDisplayMode"
kind = "fn"
addr = 0x626bf0
check = "55 8b ec 8b 51 14 53 56 57 8b 0a 3b ca"
used_by = ["modes"]

[[sym]]
id = "shell_display_find"
symbol = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
kind = "call"
addr = 0x62c4e0
target = "find_display_mode"
in = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
used_by = ["modes"]

[[sym]]
id = "failed_display_find"
symbol = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
kind = "call"
addr = 0x62c643
target = "find_display_mode"
in = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
used_by = ["modes"]

[[sym]]
id = "game_mode_find"
symbol = "GameConfiguration::InitializeGraphicsSystem"
kind = "call"
addr = 0x53e7c9
target = "find_display_mode"
in = "GameConfiguration::InitializeGraphicsSystem"
used_by = ["modes"]

[[sym]]
id = "game_mode_find_again"
symbol = "GameConfiguration::InitializeGraphicsSystem"
kind = "call"
addr = 0x53e7e7
target = "find_display_mode"
in = "GameConfiguration::InitializeGraphicsSystem"
used_by = ["modes"]

[[sym]]
id = "intro_mode_find"
