in = "Program::PlayIntroMovie"
used_by = ["modes"]

[[sym]]
id = "intro_mode_find_again"
symbol = "Program::PlayIntroMovie"
kind = "call"
addr = 0x4861f2
target = "find_display_mode"
in = "Program::PlayIntroMovie"
used_by = ["modes"]

# The front end's hard-coded request (SetActiveDisplay_Internal's 800x600x16), which
# FO-4 raises: Display8 names it when it answers it.
[[sym]]
id = "front_end_width"
symbol = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
kind = "value"
value = 800
unit = "px"
used_by = ["modes"]

[[sym]]
id = "front_end_height"
symbol = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
kind = "value"
value = 600
unit = "px"
used_by = ["modes"]

[[sym]]
id = "front_end_depth"
symbol = "ST3D_GraphicsEngine::SetActiveDisplay_Internal"
kind = "value"
value = 16
unit = "bpp"
used_by = ["modes"]

