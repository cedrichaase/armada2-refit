# ---- display.crash (crash.rs) ------------------------------------------------------

# DebugCallStack_DumpFrom(file, frame pointer) walks the frames of the faulting thread from
# the frame pointer the exception left; with a damaged one it faults again, in the handler.
[[sym]]
id = "dump_from"
symbol = "DebugCallStack_DumpFrom"
kind = "fn"
addr = 0x64faf0
check = "55 8b ec 6a ff 68"
used_by = ["crash"]

# The one call of it in the exception handler (the filter of DebugException_Execute, which
# the engine's main loop runs inside): re-pointed to our record, which does not walk.
[[sym]]
id = "site_dump_from"
symbol = "DebugException_Execute"
kind = "call"
addr = 0x651f65
target = "dump_from"
in = "DebugException_Execute"
used_by = ["crash"]
