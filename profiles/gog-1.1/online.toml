# Online.asi's symbols in Armada2.exe 1.1 (GOG): what online/online.c reads and patches of
# the exe, each entry tied to the hook that uses it. The findings are in online/README.md,
# "The menu entry". peer.c (our DirectPlay) reads nothing of the exe.
schema = 1
plugin = "online"
readme = "online/README.md"
lang = "c"
out = "online/engine_syms.h"

[hook.entry]
doc = "The Internet - Online button in IPX's place on the exe's Multiplayer Connection screen"
rows = ["Online.Entry"]

[hook.labels]
doc = "The Manual IP prompt, the connect texts and the titles read as online ones while the entry is chosen"
rows = ["Online.Entry"]

[hook.chat]
doc = "The join code and the server's messages as lines in the lobby's and GAME SETUP's chat boxes"
rows = ["Online.Entry"]

[hook.kind]
doc = "Which game this build plays online, so the server never matches players of different games"
rows = ["Online.Entry"]

# ---- the game's kind ----------------------------------------------------------------

# The kind ending SV_HOST and SV_JOIN (README.md, "Which game"): the server introduces a
# joiner only to a host of the same kind. 0 is Armada II, what every client before kinds
# is taken for; a build whose network game is another game's gives its own.
[[sym]]
id = "net_kind"
symbol = "the game's online kind"
kind = "value"
value = 0
used_by = ["kind"]

# ---- the three patches of the connection screen ------------------------------------

[[sym]]
id = "read_label"
symbol = "read_text_label"
