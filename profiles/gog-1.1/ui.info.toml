# ---- hud.info_fo: Roots' info panel under ours (PLAN-FLEETOPS.md, FO-6, decisions 440-459) ----
#
# On a build whose info panel is FleetOpsHook's (`info_fo_panel`, Roots), the panel's own Render
# keeps running every frame, so FleetOpsHook's per-frame work in it stays whole (the weapon icons'
# rectangles, the subsystem icons' range rings, the buffs), but the device's 2D draws are dropped
# while it runs: the seven drawing slots of ST3D_DeviceDirectX8's vtable are wrapped (not RenderParticle: render3d's
# particles module holds that slot, and the HUD draws no particles), each checked
# to hold its function, and do nothing while the panel draws. The members below are the ones
# FleetOpsHook adds to its larger ShipDisplay and to BuildWireframe; they are read, never written.
# On Armada II (`info_fo_panel` 0) nothing of this hook is installed or read.

[[sym]]
id = "info_fo_panel"
symbol = "info panel: FleetOpsHook's ShipDisplay drawn by ours over its unseen Render"
kind = "value"
value = 0
used_by = ["hud.info_fo"]

