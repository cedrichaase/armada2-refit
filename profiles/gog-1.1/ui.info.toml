# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "info", the info panel (info.rs), the
# unit view (unitview.rs) and the close-up (closeup.rs). Each entry is tied to the hook
# that uses it; the findings are in ui/HUD.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/HUD.md"
lang = "rust"
out = "ui/src/syms_info.rs"

[hook."hud.info"]
doc = "The info panel: ShipDisplay's children asked for their answers, and the presses on the panel"
rows = ["HUD.Info"]

[hook."hud.unitview"]
doc = "The unit view: CinematicView's rectangles written, its frame left out of Render"
rows = ["HUD.UnitView"]

[hook."hud.closeup"]
doc = "The close-up: a camera of our own through the action camera's Armada_RenderAllOurStuff call"
rows = ["HUD.InfoCamera"]

