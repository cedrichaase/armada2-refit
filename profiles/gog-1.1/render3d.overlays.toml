# Render3D.asi's symbols in Armada2.exe 1.1 (GOG): module "overlays" (render3d/mods/overlays/src).
# Each entry is tied to the hook that uses it; the findings are in render3d/README.md, "Hooks".
schema = 1
plugin = "render3d"
readme = "render3d/README.md"
lang = "rust"
out = "render3d/mods/overlays/src/syms.rs"

[hook."overlays.reads"]
doc = "What the overlays module reads of the engine: its objects, lists, globals and calls"
rows = ["Modules.overlays"]

[hook."overlays.posts"]
doc = "The height posts: DrawHeightPost's five call sites re-pointed to our own anti-aliased lines"
rows = ["Modules.overlays"]

[hook."overlays.posts_callee"]
doc = "DrawHeightPost at its entry, armed only while the companion module (Roots: FleetOpsHook) calls it"
rows = ["Modules.overlays"]

[hook."overlays.paths"]
doc = "The move paths: the selection, each ship's path and next point, the sketched path, stock's sketch line re-pointed"
rows = ["Overlays.MovePaths"]


