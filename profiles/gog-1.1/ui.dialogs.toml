# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "dialogs" (engine/dialogs.rs), the dialog host.
# The findings are in ui/MENUS.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/MENUS.md"
lang = "rust"
out = "ui/src/syms_dialogs.rs"

[hook."dialogs.reads_screens"]
doc = "The shell's dialog procedures, told by address to name a hosted screen and bound the shell's code"
rows = ["Menus.Enable"]

[[sym]]
id = "dialogs_front_end_width"
symbol = "SetActiveDisplay_Internal"
kind = "value"
value = 800
unit = "px"
used_by = ["dialogs.reads_screens"]

[[sym]]
id = "dialogs_front_end_height"
symbol = "SetActiveDisplay_Internal"
kind = "value"
value = 600
unit = "px"
used_by = ["dialogs.reads_screens"]

