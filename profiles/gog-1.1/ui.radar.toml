# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "radar", the minimap (ui/src/engine/radar.rs).
# Each entry is tied to the hook that uses it; the findings are in ui/HUD.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/HUD.md"
lang = "rust"
out = "ui/src/syms_radar.rs"

[hook."hud.radar"]
doc = "The minimap: the always-step call, what the radar reads and the calls its clicks make"
rows = ["HUD.Minimap"]

[hook."hud.radar_cursor"]
doc = "The cursor over the minimap: SetCursorAiAction reads its cursor table as the panel does"
rows = ["HUD.Minimap"]

