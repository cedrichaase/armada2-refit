# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "shell" (engine/shell.rs, shellui.rs,
# shellcombo.rs, setup.rs). The findings are in ui/MENUS.md, "Hooks" (ui.shell.*).
schema = 1
plugin = "ui"
readme = "ui/MENUS.md"
lang = "rust"
out = "ui/src/syms_shell.rs"

[hook."shell.screens"]
doc = "The shell's Credits call and the display, pump and background functions a screen of ours runs between screens"
rows = ["Menus.Credits"]

[hook."shell.reads_device"]
doc = "The Storm3D device behind the shell, the pump's exit code and the Alt+Tab flag, read and its Flip slot called"

[hook."shell.cursor"]
doc = "The 3D window's WM_SETCURSOR answer re-pointed so a screen of ours or a hosted dialog has the arrow"

[hook."shell.widgets"]
doc = "Shell::Widget's constructor re-pointed so every shell button and label is remembered"
rows = ["Menus.Enable"]

[hook."shell.reads_widgets"]
doc = "The shell's button, label, scroll bar and combo box objects read by class and field"

[hook."shell.reads_combo"]
doc = "A ComboBox's pull-down count, item height, rectangle, hidden combo window and direction"

[hook."shell.reads_setup"]
doc = "The game setup and transport getters the loading screen and the Refit screen ask about the game"

