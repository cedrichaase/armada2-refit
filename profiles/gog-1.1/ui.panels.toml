# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "panels" (ui/src/engine/{buttons,selection,
# chat,resources,topbar,trade,sound,race,comm}.rs). The findings are in ui/HUD.md, "Hooks".
schema = 1
plugin = "ui"
readme = "ui/HUD.md"
lang = "rust"
out = "ui/src/syms_panels.rs"

[hook."panels.buttons"]
doc = "StandardButton's press and Localize called, its fields read: the HUD's buttons and texts"

[hook."panels.toggle_press"]
doc = "ToggleButton's press function, which the comm panel's toggles and colour buttons press"

[hook."panels.presses"]
doc = "A press of ours made at the game's simulate pass, in place of Entity::ResetVisibility's call"

[hook."panels.reads_selection"]
doc = "The overview's selection list, Entity::Get and Entity::GetUserTeam read and called"
rows = ["HUD.Info", "HUD.Selection"]

[hook."panels.reads_warp"]
doc = "Whether the selected ships can warp, from their control and the setup's warp setting (minimap cursor)"
rows = ["HUD.Minimap"]

[hook."panels.resources"]
doc = "Team::GetTeam and Team::GetResource called for the user's amounts"

[hook."panels.topbar"]
doc = "The resource panel and the top-right button panel read, their press functions recognised"

[hook."panels.chat"]
doc = "The chat lines and text-entry regions read, TextInput_Update's call in the mission frame patched"

[hook."panels.trade"]
doc = "The mission scripts' trade status and team message read, Team::RenderUserTeamData's call patched"

[hook."panels.sound"]
doc = "The button sounds played the way StandardButton::Simulate plays them"

[hook."panels.reads_race"]
doc = "The mission's race and its name, for the HUD's theme"

[hook."panels.comm"]
doc = "The comm panel, the drop box and the load wait read, their buttons recognised by press function"

