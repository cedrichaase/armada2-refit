# Render3D.asi's symbols in Armada2.exe 1.1 (GOG): module "world" (render3d/mods/world/src).
# Each entry is tied to the hook that uses it; the findings are in render3d/README.md, "Hooks".
schema = 1
plugin = "render3d"
readme = "render3d/README.md"
lang = "rust"
out = "render3d/mods/world/src/syms.rs"

[hook."world.reads"]
doc = "What the world module reads of the engine: its objects, lists, globals and calls"
rows = ["Modules.world"]

[hook."world.lights"]
doc = "Re-points Nebula::Simulate's call of its light update, so the nebulae's lights are ours"
rows = ["Modules.world"]

[hook."world.cull"]
doc = "Wraps the nebula instance's FrustumTest (vtable slot 3), the nebulae's cull"
rows = ["Modules.world"]

[hook."world.ghosts"]
doc = "Wraps GameObjectSpirit::Render (vtable slot 3), which hides a fogged nebula's billboards"
rows = ["Modules.world"]


