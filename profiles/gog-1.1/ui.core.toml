# UI.asi's symbols in Armada2.exe 1.1 (GOG): part "core" -- the Storm3D global and device
# offsets, the mission frame, the engine's cursor, the display mode, the intro, the message
# hooks, the device's coming and going, and the few engine globals read by the other parts.
# Each entry is tied to the hook that uses it; the findings are in ui/README.md, "Hooks
# (engine profile): core".
schema = 1
plugin = "ui"
readme = "ui/README.md"
lang = "rust"
out = "ui/src/syms_core.rs"

[hook."core.storm3d"]
doc = "The Storm3D global and the device it holds, which every part reads to find the engine's device"

[hook."core.mission"]
doc = "A mission's frame: the call of ChatDisplay::Render after which the UI draws"

[hook."core.cursor"]
doc = "RefreshDisplay wrapped through the device's vtable, to hide the engine's cursor for a frame"
rows = ["UI.Cursor"]

[hook."core.cursor_probe"]
doc = "RefreshDisplay's draw of the synchronous cursor watched, to see whether it is reached"
rows = ["UI.Cursor"]

[hook."core.cursor_square"]
doc = "SetCursor's hardware cursor width and the synchronous draw kept square at any aspect"
rows = ["UI.Cursor"]

[hook."core.display"]
doc = "InitializeGraphicsSystem's call: a stock profile mode becomes the desktop's"

[hook."core.intro_mode32"]
doc = "PlayIntroMovie's 32-bit 640x480 mode lookup asked for the desktop's size"

[hook."core.intro_mode16"]
doc = "PlayIntroMovie's 16-bit 640x480 mode lookup asked for the desktop's size"

[hook."core.intro_frames"]
doc = "NextBinkFrame's BinkCopyToBuffer call re-pointed, so the UI draws the movie's frames"

[hook."core.input"]
doc = "WindowProc's keyboard and mouse message calls and their PeekMessage drains"

[hook."core.window"]
doc = "GetWindowHandle called on Storm3D, for the game window"

[hook."core.device"]
doc = "DestroyRenderSurfaces chained, so the UI lets go of the device with the engine"

[hook."core.reads_mouse"]
doc = "The mouse driver's button bits and held-pointer flag, read for the focus diagnostics"

[hook."core.reads_msvc"]
doc = "The msvcp60 imports the engine's stringstream and string functions are called with"

[hook."core.reads_clock"]
doc = "Get_Time's float, read for the bench clock"

[hook."core.reads_hud_hidden"]
doc = "The HUD's ship display hidden flag, read to know when the engine hides its HUD"

