# ---- rebind: the key rebind table (qol/README.md, "Key rebinds") -----------------------
# Input.map, once parsed (InputInit: read_input_map_key, read_chord, s_FindOrAppendDiscreteMap),
# is two arrays the input thread tests each frame: the named controls (FieldDesc, the name inline
# at +0, at +0x20 the pointer to the control's state cell) and the discrete maps (DiscreteMap: at
# +0 the state cell it sets, at +4 the number of keys in its chord, from +8 the keys, 12 bytes each:
# the device's index, the key's code on that device, and a byte: 1 for a key held, 0 for a key up).
# A control is found by its name and its maps by its state cell; a rebind changes one key's code
# in one map, in memory, and puts it back.
[[sym]]
id = "rb_fields"
symbol = "DynArray<FieldDesc> data"
kind = "global"
addr = 0x761370
used_by = ["rebind"]

[[sym]]
id = "rb_n_fields"
symbol = "DynArray<FieldDesc> count"
kind = "global"
addr = 0x761378
used_by = ["rebind"]

