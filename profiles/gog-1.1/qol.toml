# QOL.asi's symbols in Armada2.exe 1.1 (GOG): what qol/qol.c reads and patches of the exe, each entry
# tied to the hook that uses it. The findings are in qol/README.md, "Hooks". Generated once from the
# exe and the developer's map (names only) by a script; edited by hand since.
schema = 1
plugin = "qol"
readme = "qol/README.md"
lang = "c"
out = "qol/engine_syms.h"

[hook.pan_speed]
doc = "The right-drag pan factor, stored over the parsed FASTSCROLL_COEFFICIENT"
rows = ["QOL.PanSpeed"]

[hook.shift_group]
doc = "Shift+number adds the selection to a group; Alt+number selects and centres"
rows = ["QOL.ShiftAddsToGroup"]

[hook.selection]
doc = "The selection array moved to ours, the three caps of 16 raised"
rows = ["QOL.MaxSelection"]

[hook.special_select]
doc = "The special-weapon button gathers into buffers of ours, not 16-entry stack arrays"
rows = ["QOL.MaxSelection"]

[hook.stations]
doc = "Stations in groups, one build menu for several of one kind"
rows = ["QOL.StationGroups"]

[hook.warp]
doc = "Long moves on the map go to warp"
rows = ["QOL.WarpDistance"]

[hook.move_paths]
doc = "The move queue: waypoint-key points kept per ship, flown as stock path orders a run at a time; player orders end it"
rows = ["QOL.PathStartsAtOnce"]

[hook.bar_keys]
doc = "The bar's keyboard step wrapped for the position keys; a button pressed with its click"
rows = ["QOL.BarKeys"]

[hook.rebind]
doc = "The key rebind table applied in the engine's parsed key map while the grid's position keys are on"
rows = ["QOL.BarKeys"]

[hook.rig_self]
doc = "The construction ship does not block its own blueprint: the ghost's check ignores the rig"
rows = ["QOL.RigIgnoresSelf"]

[hook.script_input]
doc = "A script's input monitor called only while set: the editor after a scripted mission no longer calls a cleared one"

