; Surfaces.asi -- planets' surfaces made from recipes.  See surfaces/README.md.
;
; Drawn by Lighting.asi's planet shaders (PlanetShaders=1 under d3d8to9): without them,
; or for a planet class with no recipe in Surfaces\, the stock texture.
[Surfaces]
; 0: every planet keeps its stock texture.
Enable=1
; The edge of the ground's cubes (colour and relief), in texels; 1024 holds about two
; texels per pixel on a planet half the screen high at 3440x1440. Each recipe's cubes
; take 6 x Face^2 x 4 bytes x 4/3 (the levels) twice: 67 MB at 1024.
Face=1024
; The clouds' cube; they are soft, so half the ground's is enough.
CloudFace=512
; 1: this file and the recipes are looked at twice a second, and a changed recipe
; re-bakes, so a recipe can be tuned with the game running.
Reload=1
; 1 writes Surfaces.log beside Armada2.exe.
Log=1
