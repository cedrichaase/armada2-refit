; Display8 -- the game's d3d8.dll, ours (display/README.md)
[Display8]
; the set of shipped defaults this file was written or brought up to: an install moves
; a value that still holds an older set's default to the new one (ui/ini-merge.py), and
; keeps any value changed by hand. 2: Mode=stub, Backend=auto (were forward, d3d9)
Defaults=2
; stub: the engine's Direct3D 8 draws nothing; render3d and the UI draw the whole frame
;       on a device of Display8's own, the one Backend= chooses (README.md, "Stub mode")
; forward: stand in front of the real chain and pass every call through
Mode=stub
; what the stub draws on (README.md, "Stub mode"): d3d9, a Direct3D 9 device of its own;
; vulkan (README.md, "Vulkan"; render3d and the UI draw through gpu's Vulkan backend);
; d3d12 (README.md, "Direct3D 12"; render3d and the UI draw through gpu's Direct3D 12 backend);
; auto: the first that starts of vulkan, d3d12, d3d9, on every system
; (README.md, "Choosing a backend"). A list (d3d12,vulkan) is tried in that order. Whatever
; is named, d3d9 comes last: a backend that cannot start falls back to it, with the reason
; in Display8.log
Backend=auto
; the Vulkan validation layer, or Direct3D 12's debug layer, when the system has one
; (Vulkan: its messages in Display8.log)
Validate=0
; Vulkan only: use only a device whose name contains this (the test bench: llvmpipe,
; the CPU's); empty: a discrete GPU first
Device=
; Vulkan and Direct3D 12: vulkan draws with their own pixel centres; d3d9 with Direct3D 9's, as
; DXVK does, so that a frame can be compared with Backend=d3d9's pixel for pixel
PixelCentres=vulkan
; stub mode on Vulkan: 1 draws the engine's own Direct3D 8 draws, the way Direct3D 8
; draws them, into render3d's scene or the engine's targets (README.md, "Passthrough"),
; so that what render3d or the UI does not draw (a module switched off, a model it hands
; back) shows as stock; 0 drops them, as before
Passthrough=1
; 1: wait for the vertical blank, so the frame rate is held to the display's refresh
; rate; 0: no frame limit, present as fast as frames are drawn (README.md, "VSync")
VSync=1
; the real chain's d3d8.dll: auto is d3d8_real.dll beside the exe if there is one (what
; display/install puts there), else the system's own; or a file name in the game
; directory, or a full path
Real=auto
; count every call by context, method and caller into Display8.inventory.tsv, and log
; the answers, locks and read-backs (README.md, "The inventory"). auto: on in a test
; bench clone (a game directory under a2test\sessions\), off anywhere else
Trace=auto
Log=1

[Drop]
; the engine's draws, accepted and not passed on, by category (README.md, "Drop
; switches"): with the refit installed, every switch on must look the same
Drop2D=0
Drop3D=0
DropLoading=0
; draws with any of these return addresses into Armada2.exe on their call chain
Callers=

[Trace]
; frames Display8.go captures in detail
Frames=3
