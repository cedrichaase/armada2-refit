# The Display8 settings the Refit screen lists (A2SET_ABI 1.1; tools/settings/README.md).
# Edit here, then run tools/settings/gen.py: it writes src/settings_table.rs.
# Display8 has no row on the screen yet (the renderer is an open decision): every row is
# NO_ROW, so the table is the keys' declaration, the defaults the code reads through,
# and the `moved_from` of the two keys that came from UI.ini.
plugin = "Display8"
file = "Display8.ini"
shipped = "display/Display8.ini"

[[row]]
name = "window_native"
section = "Window"
key = "Native"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "none"
label = "Desktop resolution"
help = "While the game's display mode is still a stock one it runs at the desktop's instead."
flags = ["no_row"]
moved_from = "UI.UI.Native"

[[row]]
name = "window_keepclip"
section = "Window"
key = "KeepClip"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "none"
label = "Keep the pointer clip"
help = "Under Wine, put the pointer clip back while the pointer moves in the game."
flags = ["no_row"]
moved_from = "UI.UI.KeepClip"

[[row]]
name = "window_raiseintro"
section = "Window"
key = "RaiseIntro"
kind = "bool"
default = "1"
apply = "restart"
scope = "local"
tab = "none"
label = "Intro at the desktop's resolution"
help = "The launch reels and the intro run at the desktop's mode instead of 640x480."
flags = ["no_row"]

[[row]]
name = "samplers_anisotropy"
section = "Samplers"
key = "Anisotropy"
kind = "enum"
default = "auto"
values = ["auto", "1", "2", "4", "8", "16"]
labels = ["As dxvk.conf", "1x", "2x", "4x", "8x", "16x"]
apply = "restart"
scope = "local"
tab = "none"
label = "Anisotropic filtering"
help = "Anisotropy of the plugins' samplers on Vulkan and Direct3D 12. auto: as dxvk.conf has DXVK make them."
flags = ["no_row", "advanced"]

[[row]]
name = "samplers_lodbias"
section = "Samplers"
key = "LodBias"
kind = "enum"
default = "auto"
values = ["auto", "0", "-0.25", "-0.5", "-0.75", "-1"]
labels = ["As dxvk.conf", "0", "-0.25", "-0.5", "-0.75", "-1"]
apply = "restart"
scope = "local"
tab = "none"
label = "Mip LOD bias"
help = "Mip level bias of the plugins' samplers. auto: as dxvk.conf. A negative value counts only when the clamp is off."
flags = ["no_row", "advanced"]

[[row]]
name = "samplers_clamp"
section = "Samplers"
key = "ClampNegativeLodBias"
kind = "enum"
default = "auto"
values = ["auto", "1", "0"]
labels = ["As dxvk.conf", "On", "Off"]
apply = "restart"
scope = "local"
tab = "none"
label = "Clamp negative LOD bias"
help = "1 holds a negative LOD bias at 0, as DXVK does by default. auto: as dxvk.conf."
flags = ["no_row", "advanced"]
