[package]
name = "a2rt"
version = "0.1.0"
edition = "2024"
publish = false
description = "The plugins' runtime (Display8, Render3D.asi, UI.asi): allocator, Win32, log, ini (with the settings overlay), settings descriptors, files, clock, in-memory patching, frame dumps; no_std"
license = "MIT"

[lib]
name = "a2rt"
path = "src/lib.rs"

[features]
# Frame dumps (dump.rs), which read targets back through gpu.
dump = ["dep:gpu"]

[dependencies]
a2ini = { path = "../a2ini" }
gpu = { path = "../../gpu", optional = true }
