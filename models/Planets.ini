[Planets]
; How much finer than stock the engine tessellates planets: it divides the
; engine's facet tolerance, which was set for 640x480.  8 draws a clean rim at
; 3440x1440; 1 (or 0) is stock and patches nothing.
Detail=8
; 1 writes Planets.log beside Armada2.exe: one line at startup.
Log=1
