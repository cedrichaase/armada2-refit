note=128px props and small craft: the three transporter effects, the Species 8472
note=cocoon and photon, FluidicRift2 (its own texture -- see Props), the starfield
note=plate `Stars`, and the Bee construction craft of three factions.
note=`Stars` was in this target and was REMOVED after measuring, not on taste. It is
note=a sparse starfield -- the class Mbgstars is deliberately left stock for, because
note=an upscaler turns a 1px star into a blob. The bright-pixel fraction is the test:
note=a point that keeps its angular size covers scale^2 more pixels out of scale^2
note=more total, so the fraction is invariant. Mstars held (8.84% -> 8.66% above 10%)
note=and Xflare held (45.74% -> 45.64%), but Stars lost 43% of its bright pixels
note=(>25%: 0.128% -> 0.074%, >50%: 0.049% -> 0.034%) with the mean preserved -- i.e.
note=each star's core shrank and its light spread into a sub-threshold halo. Note the
note=failure is the OPPOSITE sign from blobbing and a mean check cannot see it at all.
note=`starcluster` has the same kind of name and is NOT this: 8.76% of it is above
note=10%, so it is a dense cluster, and it upscaled with its fractions intact.
note=8472cocoon is 32-bit and classify-alpha called it AMBIGUOUS. Looked at it: it
note=has NO fully transparent texels at all (0.0% at a=0, 93.7% mid), so nothing is
note=being cut out -- it is graded translucency over an organic hull, smooth, with
note=no high-frequency structure to recover. Lanczos alpha, not ai.
note=Bbee is a coverage mask. blend=70: small craft draw small on screen.
