kind=plain
size=1024
monohue=0
blend=70
mips=auto
alphafilter=Mitchell
install=yes
note=Borg hull and station plates, 24 textures at 256px built to 1024.
note=No alpha=ai here: these are coverage masks, binary masks, or 24-bit plates
note=with no alpha at all. A mask has only edges, Lanczos resolves an edge
note=exactly, and a model that invents detail into a mask invents holes in the
note=object. attach_alpha's default Lanczos path is what these want.
note=blend=70 carries over from the Federation, where it was checked across the
note=whole zoom range (81/231/377/1055px, measured off four captures) rather than
note=at one size. Re-measure with textures/tools/measure-invention.sh rather than assuming.
note=alphafilter=Mitchell. borgUI3's alpha is a coverage mask with soft edges -- 20.1%
note=exact zero, 65.1% exact 255, 14.8% graded, and black underneath -- and Lanczos
note=rings on it, dropping the channel mean 200.71 -> 199.22, past verify's tolerance
note=of 1.0. Mitchell gives 200.49, Triangle 200.74, Box 200.71 exactly. The direction
note=is DOWN here where fedpod10's was up: which way the clipping asymmetry goes depends
note=on whether the mask is mostly transparent or mostly opaque, so the sign is not a
note=diagnostic and the magnitude is.
note=Measured from STORED BYTES, not ImageMagick's in-memory mean. `-alpha extract ...
note=-format %[fx:mean]` reports 200.715 for the Lanczos result, which is the value that
note=would make this look fine; the file on disk holds 199.223. Same reason verify.py
note=reads raw TGA bytes -- the library's opinion about a channel is not the channel.
