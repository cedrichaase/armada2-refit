note=Species8472 hull and station plates, 1 textures at 64px built to 256.
note=alpha=ai: every plate here classifies as a night-lights map with
note=textures/tools/classify-alpha.py -- mostly-zero alpha with graded structure above it,
note=and painted hull rather than black underneath the transparent texels. The
note=luminance-under-transparent test is the one that decides it; a coverage mask
note=hides a region the artist never painted and reads near 0 there.
note=Measured across this target: 67.7-67.7% exact zero, luminance under transparent 168-168.
note=blend=70 carries over from the Federation, where it was checked across the
note=whole zoom range (81/231/377/1055px, measured off four captures) rather than
note=at one size. Re-measure with textures/tools/measure-invention.sh rather than assuming.
note=blend=35, not the project's 70, and set by eye because the measurement is blind
note=here. textures/tools/measure-invention.sh is saturation-based, and this plate is an organic
note=cell structure with essentially no saturated markings: its numbers are FLAT across
note=every blend from 20 to 100 (invented 0.037-0.040% throughout), which says the metric
note=cannot see what the model is doing rather than that the model is doing nothing.
note=What it is doing, visible on a render: at 70 the veins acquire a granular speckle
note=that is not in stock, and at 100 that is frank noise. This is a 64px source at a 16x
note=lift -- the regime CLAUDE.md rule 4 warns about -- and it behaves exactly as that
note=rule predicts. 35 keeps the vein structure clean.
note=The general lesson: a saturation metric is only a check on textures that HAVE
note=saturated markings. On organic or near-greyscale art it must be a render.
