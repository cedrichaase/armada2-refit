monohue=0
blend=70
mips=auto
install=yes
note=Federation hulls whose alpha is a COVERAGE MASK, not a night-lights map. No
note=alpha=ai here, deliberately: a mask has only edges, Lanczos resolves an edge
note=exactly, and a model that invents plausible detail into a mask invents holes in
note=the object. attach_alpha's default Lanczos path is what these want.
note=Ffreight: 97.2% of its alpha is exactly 255 and the RGB beneath its non-opaque
note=texels has mean luminance 0.0 -- the hidden region is unpainted, which is what
note=makes it coverage rather than light. The night-lights plates in FedCapital read
note=100-160 there.
note=fdata: exactly TWO distinct alpha values. There is no picture content to recover.
