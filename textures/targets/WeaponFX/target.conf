kind=plain
size=1024
monohue=0
blend=35
mips=auto
install=yes
note=Weapon and shield-effect plates: beams, waves, emitters, colony beams.
note=All 24-bit, no alpha. Additive sprites -- the channel MEAN is the light
note=contributed, so verify.py's per-channel mean check is the binding invariant
note=here, not a nicety. textures/tools/measure-invention.sh misreads these badly (it scores
note=a tightened glow as erasure); judge on a render and on the mean.
note=blend=35, not 70: a beam sprite stretches across the viewport, so this is the
note=fills-the-screen case of generative rule 5, not the small-on-screen one.
note=`Wshldrmd` was in this target and was REMOVED -- mip_strays() refused the whole
note=target over it, correctly. Stock ships a COMPLETE, valid chain (Wshldrmd 256 ->
note=_1 128 -> _2 64) and then a FOURTH file, Wshldrmd_1_2 at 64, named as level 2
note=of _1 but sized as level 1 of it, and not byte-identical to Wshldrmd_2. Nothing
note=here walks that name, so upscaling would leave a stale 64px file beside a 512px
note=_1 -- the invalid-chain shape that crashed the Klingon campaign.
note=Mirroring stock's relationship (_1_2 at half of _1, so 256) would probably be
note=safe, and "probably" is the wrong standard when the failure is a hard crash and
note=cannot be tested from here. It belongs with the 47 `misnamed stock mip level`
note=textures in INVENTORY.md, which are all blocked on the SAME unanswered question:
note=does the engine read a level named _2 when the _1 it implies is absent? Answer
note=that in game once and Wshldrmd and all 47 unblock together.
note=Note the guard refused all 24 textures over this one, which is the design -- it
note=is a target-level refusal on purpose. The other 23 install unchanged.
