note=Federation capital and mid hulls: Galaxy (hull + saucer), Akira, Steamrunner,
note=Intrepid and the two Nebula plates, each with its Borg-assimilated sibling.
note=All 256x256 32-bit with a 2-level hand-authored chain, built at 1024 -- the same
note=shape the Sovereign established, and 4x is where this model's invention is mildest.
note=alpha=ai: every plate here is a night-lights map, not a coverage mask. Measured as
note=84-90% exact zero with 243-256 distinct values above it, and -- the test that
note=actually separates the two -- the RGB underneath the transparent texels is painted
note=hull, mean luminance 100-160, not black. A coverage mask leaves its hidden region
note=unpainted; Ffreight's reads exactly 0.0 there, which is why it is in FedMask.
note=blend=70 follows the Sovereign: at 35 that target was indistinguishable from stock
note=in game, because the invented hull glyphs 35 suppresses land under a pixel at the
note=size a ship is actually drawn. Judge any change to it on a render at ~340px wide.
