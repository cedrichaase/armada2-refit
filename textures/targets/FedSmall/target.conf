kind=plain
size=512
monohue=0
blend=70
mips=auto
alphafilter=Mitchell
install=yes
note=The 128x128 Federation plates, built at 512 to hold the same 4x scale factor the
note=256px targets use -- size= is per target, so they cannot share one with them.
note=Both are masks, so no alpha=ai: Fbee has two distinct alpha values, fedpod10 has
note=thirteen with only 0.4% of texels between the extremes.
note=alphafilter=Mitchell, not the default Lanczos. fedpod10's alpha is a coverage
note=mask that is 91.1% exact zero and 8.5% exact 255 in small isolated blobs, and
note=Lanczos ringing on that geometry clips asymmetrically -- the undershoot below 0
note=has nowhere to go -- lifting the channel mean 22.24 -> 23.36 at 4x, past verify's
note=tolerance of 1.0, and leaving a faint halo around every blob. Mitchell does not
note=ring: 22.43. Triangle is exact at 22.24 but spreads the edge over twice the width.
note=Fbee in the same target drifts 0.02 through either, so this is fedpod10's geometry
note=rather than a property of masks -- which is why the knob is per target, not global.
