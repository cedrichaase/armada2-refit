note=Federation stations whose alpha is NOT picture content, plus the ones with no alpha
note=at all. One target because the only difference between them is bit depth, and
note=write_tga takes that from each stock file independently.
note=Fyard is the instructive one: 45.4% exact zero across 256 distinct values, which
note=looks like a night-lights map by the shape of the histogram alone -- and is not.
note=The luminance under its transparent texels is exactly 0.0, so the hidden region was
note=never painted. That is an Advanced Shipyard's open scaffold, genuine cutout
note=geometry, and sending it through the generative upscaler would invent holes in it.
note=Fbase and fresear are 2-distinct binary masks; fresearch is 46.5/53.0 with only
note=0.4% between the extremes. Fpod and fmining are 24-bit with no alpha at all.
